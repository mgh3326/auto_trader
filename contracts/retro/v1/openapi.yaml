  /trading/api/retro/v1/retro_timeline:
    get:
      operationId: retro_timeline
      description: >-
        One row per symbol that appears in any evidence source for one KST
        date and market (or the requested symbol), with a closed state and the
        ordered events behind it. Sources and date basis: the observation log
        (first capture, trading_date; KR only), the screener pick log
        (recorded_at), recorded decisions and deferred_no_action forecasts
        (decided_at, created_at), and the chain's proposals, orders and fills —
        all on the KST calendar day of the request. The daily plan contributes a
        plan source: one published event per row in force (published_executable
        or published_watch) and its expiry, bound to the plan head, seq and row
        key, plus the closed plan_reason for a candidate that produced no buy.
        Minute bars are counts and
        first/last bar start only; KR by the KST day, US by the stored ET
        trading day equal to the requested date. A source read that failed or
        was cut off makes the rows it could have changed null with reason
        source_unavailable — never a weaker state. coverage says what was
        recording that day, so not_observed is distinguishable from nothing
        was recording. Refs are opaque; no raw text, account numbers or broker
        order numbers.
      parameters:
      - name: market
        in: query
        required: true
        schema:
          type: string
          enum:
          - kr
          - us
          - crypto
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: symbol
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.:/\-]{1,32}$
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.:\-]+$
          maxLength: 128
          description: Code or opaque reference only; no raw exception or broker message.
      responses:
