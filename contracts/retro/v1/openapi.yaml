openapi: 3.1.0
info:
  title: Factortrail retro provider contract
  version: 1.0.0
  description: Read-only closed projections; max 500 rows/page, 366 days inclusive.
    Unknown is never zero. Opaque refs carry no raw identifiers.
paths:
  /trading/api/retro/v1/retro_day:
    get:
      operationId: retro_day
      description: 'Maximum date span: 366 days inclusive. Count and rows share one
        read-only snapshot. '
      parameters:
      - name: market
        in: query
        required: true
        schema:
          type: string
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: cursor
        in: query
        required: false
        schema: &id001
          type: string
      responses:
        '200':
          description: Read-only result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetroDayResponse'
        '401':
          description: auth_missing or auth_invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: scope_denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: feature_off
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: timeout, upstream_unavailable or schema_mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trading/api/retro/v1/retro_symbol:
