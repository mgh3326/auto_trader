    TradeCosts:
      description: >-
        Costs of the ledger fills of the orders recorded for the trade. recorded
        is what the broker reported and is null (with recorded_reason) when any
        fill did not provide it; a fee of a fill with fee_basis not_provided is
        never a recorded zero. fee_includes_tax is true when a fill predates the
        split of Toss commission and tax and its fee is their sum. estimated is
        policy round_trip_cost_bps over the entry notional, never mixed into
        recorded. The reasons are present only when their side is null.
      type: object
      additionalProperties: false
      required:
      - recorded
      - estimated
      properties:
        recorded:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - fee
            - tax
            - currency
            - fee_includes_tax
            properties:
              fee:
                $ref: '#/components/schemas/DecimalValue'
              tax:
                $ref: '#/components/schemas/DecimalValue'
              currency: *trade001
              fee_includes_tax:
                type: boolean
          - type: 'null'
        recorded_reason:
          type: [string, 'null']
          enum: [not_provided, missing_currency, null]
        estimated:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - amount
            - rate_source
            - policy_version
            - policy_content_hash
            - basis
            properties:
              amount:
                $ref: '#/components/schemas/DecimalValue'
              rate_source: *trade001
              policy_version: *trade001
              policy_content_hash: *trade001
              basis:
                type: string
                enum: [inference]
          - type: 'null'
        estimated_reason:
          type: [string, 'null']
          enum: [missing_notional, rate_unavailable, null]
    TradeRow:
      description: >-
        The optional decision_ref, decision_link_basis, link_reason,
        fill_time_basis and costs are present only with a value. decision_ref is
        the decision stored on the trade's retrospectives (recorded), or, with
        none stored, the one derived through the retrospective's correlation and
        the order's send attempts (inference, never stored); several decisions
        or orders give no link (ambiguous_decision, ambiguous_attempts).
        fill_time_basis and costs describe the ledger fills of the orders
        recorded for the trade.
      type: object
      additionalProperties: false
      required:
      - trade_ref
      - symbol
      - market
      - side
      - strategy
      - entry_at
      - exit_at
      - quantity
      - entry_price
      - exit_price
      - currency
      - return_rate
      - realized_amount
      - realized_currency
      - exit_reason
      - basis
      - reviews
      properties:
        trade_ref: *trade001
        symbol: *trade001
        market:
          type: [string, 'null']
          enum: [kr, us, crypto, null]
        side: *trade001
        strategy: *trade001
        entry_at: *trade003
        exit_at: *trade003
        quantity:
          $ref: '#/components/schemas/DecimalValue'
        entry_price:
          $ref: '#/components/schemas/DecimalValue'
        exit_price:
          $ref: '#/components/schemas/DecimalValue'
        currency: *trade001
        return_rate:
          $ref: '#/components/schemas/DecimalValue'
        realized_amount:
          $ref: '#/components/schemas/DecimalValue'
        realized_currency: *trade001
        exit_reason: *trade001
        basis:
          $ref: '#/components/schemas/EvidenceBasis'
        reviews:
          type: array
