  /trading/api/retro/v1/retro_scoreboard:
    get:
      operationId: retro_scoreboard
      description: 'Maximum date span: 366 days inclusive. Count and rows share one
        read-only snapshot. External-flow completeness is a server-side fact, never
        a request parameter. Account uses Modified Dietz, market holdings only, sleeve
        attributed P&L over unchanged budget. US VOO benchmark is unknown when adjusted-close
        sources are mixed.'
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: cursor
        in: query
        required: false
        schema: *id001
      responses:
        '200':
          description: Read-only result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetroScoreboardResponse'
        '401':
          description: auth_missing or auth_invalid
