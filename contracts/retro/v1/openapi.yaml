  /trading/api/retro/v1/get_bars:
    get:
      operationId: get_bars
      description: 'Maximum date span: 366 days inclusive. Count and rows share one
        read-only snapshot. '
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
      - name: tf
        in: query
        required: true
        schema:
          type: string
          enum:
          - 1m
          - 5m
          - 60m
          - 1d
      - name: from
        in: query
