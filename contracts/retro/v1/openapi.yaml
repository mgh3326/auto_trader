                $ref: '#/components/schemas/RetroFunnelResponse'
        '401':
          description: auth_missing or auth_invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: scope_denied
          content:
            application/json:
              schema:
