      - no_risk_per_unit
      - no_complete_session
      - window_open
      - missing_notional
      - missing_currency
      - rate_unavailable
      - not_provided
      - no_proposal
      - no_linked_order
      - no_fills
      - no_exit_fill
      - missing_data
      - sell_decision
      - side_not_recorded
      - null
    Excursion:
      description: >-
        One MFE or MAE horizon: amount and pct share the entry price unit; r
        divides by the entry risk per unit when known. status is complete when
        the window closed, pending while it is still open, and unknown when it
        can never be computed; a non-complete status carries reason.
      type: object
      additionalProperties: false
      required:
      - amount
      - pct
      - r
      - status
      - reason
      properties:
        amount:
          $ref: '#/components/schemas/DecimalValue'
        pct:
