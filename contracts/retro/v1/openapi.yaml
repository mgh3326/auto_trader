            $ref: '#/components/schemas/TradeReviewRow'
        decision_ref: *trade001
        decision_link_basis:
          $ref: '#/components/schemas/LinkBasis'
        link_reason:
          $ref: '#/components/schemas/LinkReason'
        fill_time_basis:
          description: >-
            Weakest time basis among the ledger fills of the trade's recorded
            orders: broker_fill_time, broker_order_time (the order time stood in
            for the fill time) or observed_at. Absent when no fill is found or a
            fill's basis is unknown.
          type: [string, 'null']
          enum: [broker_fill_time, broker_order_time, observed_at, null]
