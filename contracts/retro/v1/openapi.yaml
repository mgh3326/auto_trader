        status:
          type: string
          enum:
          - complete
          - unknown
          - pending
        reason:
          $ref: '#/components/schemas/DecisionReason'
    Excursions:
      description: 'MFE or MAE per horizon: 1, 5 and 20 sessions, and to_exit.'
      type: object
      additionalProperties: false
      required:
      - '1'
      - '5'
      - '20'
      - to_exit
      properties:
        '1':
          $ref: '#/components/schemas/Excursion'
        '5':
          $ref: '#/components/schemas/Excursion'
        '20':
          $ref: '#/components/schemas/Excursion'
        to_exit:
          $ref: '#/components/schemas/Excursion'
    DecisionRow:
      description: >-
        One recorded decision and what was derived from it at read time.
        Every *_reason field is present only to explain its sibling null (or
        weakened) value; null reasons are not_applicable. candidate_ref is the
        pick the recorded candidate reference resolves to. order_states uses
        the chain's closed vocabulary; order_count is the number of order
        ledger rows whose send attempts resolve to this decision (null with
        attempts_unavailable when that read failed). entry_avg_price and
        filled_quantity are the buy fills of those orders. costs keeps
        broker-reported costs apart from the policy estimate. mfe/mae are
        daily-bar excursions (basis always inference, adjusted unknown).
        retrospective_ref is the stored decision_id link (recorded) or the
        single correlation-derived review (inference); r_multiple needs both
        entry and exit fills plus a known risk per unit. A sell decision
        reports entry_avg_price and filled_quantity as null with fill_reason
        sell_decision and carries its own linked sell fills in the optional
        sell_filled_quantity, sell_avg_price and sell_fill_reason. A declined
        decision that never recorded a side (stored NULL, or the historical
        placeholder buy with an empty rung 0) reports side null with the
        optional side_reason side_not_recorded.
      type: object
      additionalProperties: false
      required:
      - decision_ref
      - decision_kind
      - decided_at
      - decided_by
      - market
      - symbol
      - side
      - strategy
      - candidate_ref
      - candidate_link_basis
      - candidate_reason
      - reference_price
      - reference_kind
      - reference_reason
      - stop_price
      - stop_source
      - risk_basis
      - planned_quantity
      - planned_reason
      - planned_risk_amount
      - risk_reason
      - risk_pct_of_notional
      - risk_pct_of_budget
      - risk_pct_of_budget_reason
      - proposal_ref
      - proposal_reason
      - order_count
      - order_count_reason
      - order_states
      - order_states_reason
      - entry_avg_price
      - filled_quantity
      - fill_reason
      - fill_time_basis
      - costs
      - mfe
      - mae
      - excursion_basis
      - adjusted
      - retrospective_ref
      - retrospective_link_basis
      - retrospective_reason
      - r_multiple
      - r_multiple_reason
      - basis
      properties:
        decision_ref: *id001
        decision_kind:
          type: [string, 'null']
          enum: [proposal, direct_order, declined, null]
        decided_at: *id003
        decided_by: *id002
        market:
          type: [string, 'null']
          enum: [kr, us, crypto, null]
        symbol: *id001
        side:
          type: [string, 'null']
          enum: [buy, sell, null]
        strategy: *id002
        candidate_ref: *id002
        candidate_link_basis:
          $ref: '#/components/schemas/LinkBasis'
        candidate_reason:
          $ref: '#/components/schemas/DecisionReason'
        reference_price:
          $ref: '#/components/schemas/DecimalValue'
        reference_kind:
          type: [string, 'null']
          enum: [limit, approval_price, quote_at_decision, candidate_price, null]
        reference_reason:
          $ref: '#/components/schemas/DecisionReason'
        stop_price:
          $ref: '#/components/schemas/DecimalValue'
        stop_source: *id002
        risk_basis:
          type: [string, 'null']
          enum: [recorded, inference, null]
        planned_quantity:
          $ref: '#/components/schemas/DecimalValue'
        planned_reason:
          $ref: '#/components/schemas/DecisionReason'
        planned_risk_amount:
          $ref: '#/components/schemas/DecimalValue'
        risk_reason:
          $ref: '#/components/schemas/DecisionReason'
        risk_pct_of_notional:
          $ref: '#/components/schemas/DecimalValue'
        risk_pct_of_budget:
          $ref: '#/components/schemas/DecimalValue'
        risk_pct_of_budget_reason:
          $ref: '#/components/schemas/DecisionReason'
        proposal_ref: *id002
        proposal_reason:
          $ref: '#/components/schemas/DecisionReason'
        order_count: *trade004
        order_count_reason:
          $ref: '#/components/schemas/DecisionReason'
        order_states:
          type: [array, 'null']
          items:
            type: string
            enum:
            - filled
            - partially_filled
            - working
            - cancelled
            - expired
            - rejected
            - unresolved
        order_states_reason:
          $ref: '#/components/schemas/DecisionReason'
        entry_avg_price:
          $ref: '#/components/schemas/DecimalValue'
        filled_quantity:
          $ref: '#/components/schemas/DecimalValue'
        fill_reason:
          $ref: '#/components/schemas/DecisionReason'
        fill_time_basis:
          type: [string, 'null']
          enum: [broker_fill_time, broker_order_time, observed_at, null]
        costs:
          anyOf:
          - $ref: '#/components/schemas/TradeCosts'
          - type: 'null'
        mfe:
          $ref: '#/components/schemas/Excursions'
        mae:
          $ref: '#/components/schemas/Excursions'
        excursion_basis:
          type: string
          enum: [inference]
        adjusted: *id005
        retrospective_ref: *id002
        retrospective_link_basis:
          $ref: '#/components/schemas/LinkBasis'
        retrospective_reason:
          $ref: '#/components/schemas/DecisionReason'
        r_multiple:
          $ref: '#/components/schemas/DecimalValue'
        r_multiple_reason:
          $ref: '#/components/schemas/DecisionReason'
        basis:
          $ref: '#/components/schemas/EvidenceBasis'
        side_reason:
          $ref: '#/components/schemas/DecisionReason'
        sell_filled_quantity:
          $ref: '#/components/schemas/DecimalValue'
        sell_avg_price:
          $ref: '#/components/schemas/DecimalValue'
        sell_fill_reason:
          $ref: '#/components/schemas/DecisionReason'
    RetroDecisionsResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/DecisionRow'
      description: total counts matching decision rows in the requested KST window
        before pagination, or null with count_unavailable. Page length is never
        total.
      unevaluatedProperties: false
    TimelineEvent:
      description: >-
        One piece of evidence. kind and reason are closed codes copied from the
        source vocabularies (pick log admission and reason, decision kind, the
        chain's proposal/order/fill status and reason, the ranking surface of
        an observation, the daily plan row's execution state and action);
        never raw text. ref is the opaque ref the same record has in retro_day
        or retro_decisions; the observation log has none. A plan event is bound
        to the plan head, published seq and row key, and its kind is
        published_executable, published_watch or expired.
      type: object
      additionalProperties: false
      required:
      - at
      - source
      - kind
      - reason
      - ref
      properties:
        at: *id004
        source:
          type: string
          enum:
          - observation_log
          - pick_log
          - decision
          - proposal
          - order
          - fill
          - plan
        kind: *id001
        reason: *id002
        ref: *id002
    TimelineMinuteBars:
      description: >-
        Stored one-minute bars of the symbol on the date for one venue: row
        count and the start of the first and last bar. No prices.
      type: object
      additionalProperties: false
      required:
      - venue
      - rows
      - first_bar_at
      - last_bar_at
      properties:
        venue: *id001
        rows:
          type: integer
          minimum: 0
        first_bar_at: *id004
        last_bar_at: *id004
    RetroTimelineRow:
      description: >-
        state is null only with reason source_unavailable. Precedence:
        proposed_filled/proposed_unfilled (a proposal, order, fill or
        proposal/direct-order decision exists; filled by the chain's fills),
        admitted_held (an admitted pick and a declined decision or
        deferred_no_action forecast; a declined record with no pick row at all
        reports reason declined_without_pick_record), admitted_no_record (an
        admitted pick and no decision record of any kind - never a hold),
        candidate_not_admitted (pick rows only not_admitted or
        dropped_preselection, reason is the recorded admission reason),
        observed_only (observation log first capture only, or pick rows whose
        admission was never recorded), not_observed (a requested symbol in no
        source). plan_reason is the closed no-buy reason of the daily plan row
        in force and does not change state. minute_bars is null with
        minute_bars_reason when unread.
      type: object
      additionalProperties: false
      required:
      - symbol
      - market
      - state
      - reason
      - events
      - minute_bars
      properties:
        symbol:
          type: string
          pattern: ^[A-Za-z0-9_.:/\-]{1,32}$
        market:
          type: string
          enum:
          - kr
          - us
          - crypto
        state:
          type:
          - string
          - 'null'
          enum:
          - not_observed
          - observed_only
          - candidate_not_admitted
          - admitted_no_record
          - admitted_held
          - proposed_unfilled
          - proposed_filled
          - null
        reason: *id001
        events:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
        minute_bars:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TimelineMinuteBars'
        minute_bars_reason:
          type: string
          enum:
          - unsupported_market
          - source_unavailable
        plan_reason:
          description: >-
            The closed no-buy reason of the daily plan row in force for the
            symbol (design 6939 section 6), derived only from stored evidence:
            the version's input bundle candidate set, the 6790 score snapshot,
            the E1 child journal and the in-effect ledger. candidate_not_captured
            (absent from the bundle candidate set), condition_not_reached (an
            executable row expired with no child), data_delayed_or_missing (an
            unavailable input in the score snapshot), budget_or_guard_block (an
            E1 cap/kill/arming/staleness refusal or a reserved_waiting or
            skipped_waiting allocation), unfilled (an accepted child with no
            in-effect fill at expiry). Anything the evidence does not decide is
            source_unavailable and is never collapsed into one of the five.
          type: string
          enum:
          - candidate_not_captured
          - condition_not_reached
          - data_delayed_or_missing
          - budget_or_guard_block
          - unfilled
          - source_unavailable
    TimelineCoverage:
      description: >-
        What was recording on the date. observation_log_not_running means no
        run status row exists for the KST date (runs counts those rows by
        status); it is not proof that no snapshot exists. pick_log.calls is the
        number of distinct screener calls recorded that day for the market.
      type: object
      additionalProperties: false
      required:
      - observation_log
      - pick_log
      - minute_bars
      properties:
        observation_log:
          type: object
          additionalProperties: false
          required:
          - status
          - runs
          properties:
            status:
              type: string
              enum:
              - runs_recorded
              - observation_log_not_running
              - unsupported_market
              - source_unavailable
            runs:
              type:
              - object
              - 'null'
              additionalProperties: false
              required:
              - ok
              - empty
              - error
              properties:
                ok:
                  type: integer
                  minimum: 0
                empty:
                  type: integer
                  minimum: 0
                error:
                  type: integer
                  minimum: 0
        pick_log:
          type: object
          additionalProperties: false
          required:
          - status
          - calls
          properties:
            status:
              type: string
              enum:
              - calls_recorded
              - no_calls
              - source_unavailable
            calls:
              type:
              - integer
              - 'null'
              minimum: 0
        minute_bars:
          type: object
          additionalProperties: false
          required:
          - status
          properties:
            status:
              type: string
              enum:
              - available
              - unsupported_market
              - source_unavailable
    RetroTimelineResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - data
        - coverage
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/RetroTimelineRow'
          coverage:
            $ref: '#/components/schemas/TimelineCoverage'
      description: total counts the symbols in the date's population before
        pagination, or null with count_unavailable when a source read failed or
        was cut off. Page length is never total.
      unevaluatedProperties: false
    SessionObservationRow:
      description: >-
        One symbol in one session of one venue. reason is the rule that decided
        state and also explains the row's nulls. state is closed (not a trading
        day, not started, or not traded on that venue), no_trades (bars are
        stored, none with volume), not_collected (no bar is stored for a session
        that should have one, or no feed exists), delayed (a stored bar arrived
        late, or the newest one is old), observed (trade bars arrived in time),
        or null when it cannot be decided. Counts and sources are null when the
        bar read failed, never 0. venue is null when a US symbol has no known
        exchange. session_start and session_end are null for the US day market
        (its hours are not stored) and outside trading days.
      type: object
      additionalProperties: false
      required:
      - market
      - symbol
      - origin
      - venue
      - session
      - session_start
      - session_end
      - phase
      - state
      - reason
      - source
      - sources
      - stored_bar_count
      - trade_bar_count
      - last_bar_at
      - last_trade_bar_at
      - last_received_at
      - receive_lag_seconds
      - reference_close_price
      - reference_close_date
      - reference_close_basis
      - reference_close_source
      - reference_close_reason
      - currency
      properties:
        market:
          type: string
          enum:
          - kr
          - us
          - futures
        symbol:
          type: string
          pattern: ^[A-Za-z0-9_.:/\-]{1,32}$
        origin:
          description: Why the symbol is listed.
          type: string
          enum:
          - fixed
          - mover
          - requested
          - stored_contract
        venue: *id002
        session:
          type: string
          enum:
          - KRX_REGULAR
          - KRX_AFTER
          - NXT_PRE
          - NXT_OVERLAP
          - NXT_POST
          - US_DAY
          - US_PRE
          - US_REGULAR
          - US_POST
          - FUT_DAY
          - FUT_NIGHT
        session_start: *id003
        session_end: *id003
        phase:
          description: Where as_of stands against the session.
          type: string
          enum:
          - before_open
          - open
          - ended
          - not_trading_day
          - unknown
        state:
          type:
          - string
          - 'null'
          enum:
          - closed
          - no_trades
          - not_collected
          - delayed
          - observed
          - null
        reason:
          type: string
          enum:
          - trade_bars_received
          - only_zero_volume_bars
          - receive_lag_over_threshold
          - latest_bar_older_than_threshold
          - no_stored_bars
          - symbol_not_in_universe
          - collection_unsupported
          - not_trading_day
          - session_not_started
          - symbol_not_nxt_eligible
          - awaiting_first_receipt
          - eligibility_unknown
          - window_unknown
          - calendar_unknown
          - source_unavailable
        source:
          description: Stored provider of the last trade bar, else of the newest bar.
          type:
          - string
          - 'null'
          pattern: ^[A-Za-z0-9_.:\-]+$
          maxLength: 128
        sources:
          description: Every stored provider of the session's bars.
          type:
          - array
          - 'null'
          items: *id001
        stored_bar_count:
          type:
          - integer
          - 'null'
          minimum: 0
        trade_bar_count:
          description: Stored bars with volume above 0.
          type:
          - integer
          - 'null'
          minimum: 0
        last_bar_at:
          description: Start of the newest stored bar, volume 0 included.
          type:
          - string
          - 'null'
          format: date-time
        last_trade_bar_at:
          description: Start of the newest stored bar with volume above 0.
          type:
          - string
          - 'null'
          format: date-time
        last_received_at:
          description: Latest first receipt among the session's bars.
          type:
          - string
          - 'null'
          format: date-time
        receive_lag_seconds:
          description: Seconds from the close of the newest bar to its first receipt,
            rounded up.
          type:
          - integer
          - 'null'
        reference_close_price:
          $ref: '#/components/schemas/DecimalValue'
        reference_close_date:
          description: Session date the reference close was looked up for (the previous
            session).
          type:
          - string
          - 'null'
          format: date
        reference_close_basis:
          type:
          - string
          - 'null'
          enum:
          - krx_official
          - stored_daily
          - null
        reference_close_source: *id002
        reference_close_reason:
          description: Why reference_close_price is null.
          type:
          - string
          - 'null'
          enum:
          - no_stored_close
          - source_mixed
          - source_unavailable
          - calendar_unknown
          - unsupported
          - null
        currency:
          type:
          - string
          - 'null'
          enum:
          - KRW
          - USD
          - null
    SessionObservationRules:
      description: The inputs of the state rules used for this response.
      type: object
      additionalProperties: false
      required:
      - session_date
      - max_lag_seconds
      - movers_per_market
      properties:
        session_date:
          type: string
          format: date
        max_lag_seconds:
          type: integer
          minimum: 60
          maximum: 3600
        movers_per_market:
          type: integer
          minimum: 0
          maximum: 50
    SessionObservationResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - data
        - rule_parameters
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/SessionObservationRow'
          rule_parameters:
            $ref: '#/components/schemas/SessionObservationRules'
      description: total counts every symbol x venue x session row before
        pagination, or null with count_unavailable when a source read failed or
        was cut off. Page length is never total.
      unevaluatedProperties: false
    SymbolBarRow:
      description: >-
        One stored daily bar that was held at the cutoff. date is the market's
        own session date (KR the KST day, US the ET trading day, crypto the UTC
        day). bar_end_at is when the day's bar can no longer move (20:00 KST for
        KR, the regular session close for US, the next UTC midnight for
        crypto). stored_at is the last stored write of the row, the only receipt
        evidence a daily bar has. Values are stored provider data.
      type: object
      additionalProperties: false
      required:
      - row_type
      - date
      - symbol
      - market
      - open_price
      - high_price
      - low_price
      - close_price
      - quantity
      - currency
      - unit
      - source
      - venue
      - adjusted
      - missing_reason
      - basis
      - bar_end_at
      - stored_at
      - availability_basis
      properties:
        row_type:
          type: string
          const: bar
        date:
          type: string
          format: date
        symbol: *id001
        market:
          type: string
          enum: [kr, us, crypto]
        open_price:
          $ref: '#/components/schemas/DecimalValue'
        high_price:
          $ref: '#/components/schemas/DecimalValue'
        low_price:
          $ref: '#/components/schemas/DecimalValue'
        close_price:
          $ref: '#/components/schemas/DecimalValue'
        quantity:
          $ref: '#/components/schemas/DecimalValue'
        currency: *id001
        unit: *id001
        source: *id002
        venue: *id002
        adjusted: *id005
        missing_reason: *id006
        basis: *id007
        bar_end_at: *id004
        stored_at: *id004
        availability_basis:
          type: string
          const: last_stored_write
    SymbolEventSource:
      description: >-
        One original provider record behind an event, first received at or
        before the cutoff. source_event_id and source_url are present only when
        they are a public document id and a link on the source's own host.
      type: object
      additionalProperties: false
      required:
      - source
      - first_received_at
      properties:
        source:
          type: string
          enum:
          - dart
          - naver_disclosure
          - sec
          - benzinga
          - upbit_notice
          - bithumb_notice
        first_received_at: *id004
        source_event_id:
          type: string
          pattern: ^[A-Za-z0-9_.:\-]+$
          maxLength: 128
        source_url:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 512
    SymbolEventRow:
      description: >-
        One official event as known at the cutoff. version_state says how the
        version was determined: as_of_revision (the revision log;
        version_seq is the last revision observed at or before the cutoff),
        unchanged_since_cutoff (no revision log and the row was not written
        later, or the source never rewrites rows), rewritten_after_cutoff (no
        revision log and the row was written later: every value that could have
        changed is null and superseded_later is null because a later change
        cannot be told apart). reason reconstructed_from_revision marks a
        superseded version rebuilt from its stored revision: only the values
        that revision proves are present. published_at is a UTC instant and
        published_offset the source's own offset; a date-precision publication
        has published_date only. A row whose publication precision was never
        recorded has all four null with not_recorded unknowns (a dart receipt
        time the collector stored is reported with minute precision). symbol is the requested symbol; symbols are the
        version's linked symbols. effective_at is when the event takes effect,
        only where a source recorded it.
      type: object
      additionalProperties: false
      required:
      - row_type
      - date
      - symbol
      - market
      - event_ref
      - event_type
      - source
      - status
      - published_at
      - published_date
      - published_offset
      - published_precision
      - first_received_at
      - revised_at
      - effective_at
      - relevance
      - relevance_state
      - relevance_basis
      - symbols
      - version_seq
      - version_state
      - superseded_later
      - sources
      - reason
      properties:
        row_type:
          type: string
          const: event
        date:
          type: string
          format: date
        symbol: *id001
        market:
          type: string
          enum: [kr, us, crypto]
        event_ref:
          type: string
          pattern: ^evt-[0-9a-f]{20}$
        event_type: *id001
        source:
          type: string
          enum:
          - dart
          - naver_disclosure
          - sec
          - benzinga
          - upbit_notice
          - bithumb_notice
        status:
          type:
          - string
          - 'null'
          enum:
          - scheduled
          - released
          - revised
          - cancelled
          - tentative
          - null
        published_at: *id003
        published_date:
          type:
          - string
          - 'null'
          format: date
        published_offset:
          type:
          - string
          - 'null'
          pattern: ^[A-Za-z0-9_+\-:/]{1,64}$
        published_precision:
          type:
          - string
          - 'null'
          enum: [date, datetime, minute, second, null]
        first_received_at: *id004
        revised_at: *id003
        effective_at: *id003
        relevance:
          type:
          - string
          - 'null'
          enum: [direct, sector, market, null]
        relevance_state:
          type:
          - string
          - 'null'
          enum: [known, unknown, null]
        relevance_basis:
          type:
          - string
          - 'null'
          enum: [recorded, inferred, null]
        symbols:
          type:
          - array
          - 'null'
          items:
            type: string
            pattern: ^[A-Za-z0-9_.:/\-]{1,32}$
        version_seq:
          type:
          - integer
          - 'null'
          minimum: 1
        version_state:
          type: string
          enum:
          - as_of_revision
          - unchanged_since_cutoff
          - rewritten_after_cutoff
        superseded_later:
          type:
          - boolean
          - 'null'
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SymbolEventSource'
        reason:
          type:
          - string
          - 'null'
          enum:
          - rewritten_after_cutoff
          - reconstructed_from_revision
          - null
    SymbolRowCounts:
      description: >-
        Row counts only; nothing about the counted rows is returned. null means
        the count could not be made and is never 0.
      type: object
      additionalProperties: false
      required:
      - events
      - bars
      properties:
        events:
          type:
          - integer
          - 'null'
          minimum: 0
        bars:
          type:
          - integer
          - 'null'
          minimum: 0
    SymbolCollectionGap:
      description: >-
        One day of the window whose collection is not complete. date is the
        partition date (for sec the collector run date).
      type: object
      additionalProperties: false
      required:
      - source
      - category
      - date
      - reason
      properties:
        source: *id001
        category: *id001
        date:
          type: string
          format: date
        reason:
          type: string
          enum:
          - not_yet_run
          - calendar_unknown
          - pending
          - running
          - partial
          - unproven_zero
          - failed
          - http_4xx
          - http_5xx
          - timeout
          - transport
          - bad_response
          - unparseable
          - quota
    SymbolLatestCollected:
      description: >-
        Per official source of the market, the newest partition date that
        succeeded with at least one stored event (a zero that is not proven
        complete does not advance it). null means no such partition is recorded,
        never that nothing happened; the collection.latest_collected.<source>
        unknown says why (no_partition when the source writes none,
        scoped_collection when its runs cover only requested symbols).
      type: object
      additionalProperties: false
      properties:
        dart: &id_collected
          type:
          - string
          - 'null'
          format: date
        naver_disclosure: *id_collected
        sec: *id_collected
        benzinga: *id_collected
        upbit_notice: *id_collected
        bithumb_notice: *id_collected
    SymbolCollection:
      description: >-
        Ingestion state at generation time, projected from the ingestion
        partitions. gaps lists, per partition date in the window: not_yet_run
        (an expected dart session with no partition), calendar_unknown,
        pending, running, partial, unproven_zero (succeeded with zero events
        and no completeness proof), failed or the writer's closed failure code.
        dart days are listed only on XKRX sessions; for the other sources a
        missing partition is not listed. A pending sec partition is not listed:
        its runs are symbol-scoped and stay pending. gaps is null when the
        partition read failed; when more than 200 gaps exist the newest 200 are
        returned and gaps_truncated is true.
      type: object
      additionalProperties: false
      required:
      - basis
      - latest_collected
      - gaps
      - gaps_truncated
      properties:
        basis:
          type: string
          const: current_partitions
        latest_collected:
          $ref: '#/components/schemas/SymbolLatestCollected'
        gaps:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SymbolCollectionGap'
        gaps_truncated:
          type: boolean
    RetroSymbolEventsResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - data
        - symbol
        - market
        - known_cutoff
        - excluded_after_cutoff
        - excluded_unproven
        - collection
        properties:
          data:
            type: array
            items:
              oneOf:
              - $ref: '#/components/schemas/SymbolBarRow'
              - $ref: '#/components/schemas/SymbolEventRow'
          symbol: *id001
          market:
            type: string
            enum: [kr, us, crypto]
          known_cutoff: *id004
          excluded_after_cutoff:
            $ref: '#/components/schemas/SymbolRowCounts'
          excluded_unproven:
            $ref: '#/components/schemas/SymbolRowCounts'
          collection:
            $ref: '#/components/schemas/SymbolCollection'
      description: total counts the shown rows of the window before pagination,
        or null with count_unavailable when an event or bar read failed or was
        cut off. Page length is never total.
      unevaluatedProperties: false
  securitySchemes:
    RetroReadToken:
      type: apiKey
      in: header
      name: X-Retro-Read-Token
security:
- RetroReadToken: []
