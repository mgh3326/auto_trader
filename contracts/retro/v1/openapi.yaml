    TradeReviewRow:
      type: object
      additionalProperties: false
      required:
      - review_ref
      - outcome
      - trigger_type
      - root_cause_class
      - pnl_status
      - pnl_class
      - realized_pnl
      - realized_pnl_currency
      - fill_evidence_available
      - created_at
      - lesson
      - result_summary
      - rationale
      - next_strategy
      properties:
        review_ref: &trade001
          type:
          - string
          - 'null'
          pattern: ^[A-Za-z0-9_.:\-]+$
          maxLength: 64
        outcome: *trade001
        trigger_type: *trade001
        root_cause_class: *trade001
        pnl_status: *trade001
        pnl_class:
          type: string
          enum:
          - recorded
          - not_applicable
          - unknown
          - missing
        realized_pnl:
          $ref: '#/components/schemas/DecimalValue'
        realized_pnl_currency: *trade001
        fill_evidence_available:
          type: boolean
        created_at: &trade003
          type:
          - string
          - 'null'
          format: date-time
        lesson: &trade002
          type:
          - string
          - 'null'
          pattern: (?s)^.{0,1000}$
        result_summary: *trade002
        rationale: *trade002
        next_strategy: *trade002
    TradeRow:
      type: object
      additionalProperties: false
      required:
      - trade_ref
      - symbol
      - market
      - side
      - strategy
      - entry_at
      - exit_at
      - quantity
      - entry_price
      - exit_price
      - currency
      - return_rate
      - realized_amount
      - realized_currency
      - exit_reason
      - basis
      - reviews
      properties:
        trade_ref: *trade001
        symbol: *trade001
        market:
          type: [string, 'null']
          enum: [kr, us, crypto, null]
        side: *trade001
        strategy: *trade001
        entry_at: *trade003
        exit_at: *trade003
        quantity:
          $ref: '#/components/schemas/DecimalValue'
        entry_price:
          $ref: '#/components/schemas/DecimalValue'
        exit_price:
          $ref: '#/components/schemas/DecimalValue'
        currency: *trade001
        return_rate:
          $ref: '#/components/schemas/DecimalValue'
        realized_amount:
          $ref: '#/components/schemas/DecimalValue'
        realized_currency: *trade001
        exit_reason: *trade001
        basis:
          $ref: '#/components/schemas/EvidenceBasis'
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/TradeReviewRow'
    TradeSummary:
      type: object
      additionalProperties: false
      required:
      - trade_count
      - return_rate_count
      - realized_by_currency
      - pnl_coverage
      properties:
        trade_count: &trade004
          type:
          - integer
          - 'null'
          minimum: 0
        return_rate_count: *trade004
        realized_by_currency:
          type:
          - object
          - 'null'
          propertyNames:
            enum:
            - KRW
            - USD
          additionalProperties:
            $ref: '#/components/schemas/DecimalValue'
        pnl_coverage:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - recorded
            - not_applicable
            - unknown
            - missing
            properties:
              recorded:
                type: integer
                minimum: 0
              not_applicable:
                type: integer
                minimum: 0
              unknown:
                type: integer
                minimum: 0
              missing:
                type: integer
                minimum: 0
          - type: 'null'
    RetroTradesResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - data
        - summary
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/TradeRow'
          summary:
            $ref: '#/components/schemas/TradeSummary'
      unevaluatedProperties: false
  securitySchemes:
    RetroReadToken:
      type: apiKey
      in: header
      name: X-Retro-Read-Token
security:
- RetroReadToken: []
