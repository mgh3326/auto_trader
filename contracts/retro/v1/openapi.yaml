  /trading/api/retro/v1/session_observation:
    get:
      operationId: session_observation
      description: >-
        What can be seen, per market, venue and session, for one session date
        (KR the KST day, US the ET trading day, futures the trading date). It
        reports only what is stored: no broker or exchange is called. Without
        symbols the population is the fixed list (005930, 000660, 278470, SPY,
        QQQ, SMH) plus up to movers symbols per market ranked in the date's
        mover observation log, and the index futures contracts stored in the
        last 7 days. Bars are the research one-minute tables, first receipts
        only (backfill and promotion batches are not read); a volume-0 bar is
        stored but is never a trade. The reference close is the previous
        session's close: KRX official when present, else the stored daily
        candle. state is decided by the first rule that applies, in this order:
        source_unavailable (a read failed, state null); with stored bars,
        receive_lag_over_threshold (first receipt of the newest bar minus its
        close exceeds max_lag_seconds, delayed), latest_bar_older_than_threshold
        (the newest bar ended more than max_lag_seconds before the earlier of
        as_of and the session end, delayed; not applied when the session hours
        are unknown), only_zero_volume_bars (no_trades), trade_bars_received
        (observed); without stored bars, not_trading_day (closed),
        calendar_unknown (null), symbol_not_nxt_eligible (closed),
        window_unknown (null, no first possible start), session_not_started
        (closed), source_unavailable or eligibility_unknown (null),
        collection_unsupported (not_collected, no feed exists), window_unknown
        (null, US day market hours are not stored), awaiting_first_receipt
        (null, the first bar is not yet late), symbol_not_in_universe or
        no_stored_bars (not_collected). Observation only: nothing here opens or
        permits an order.
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: market
        in: query
        required: false
        schema:
          type: string
          enum:
          - kr
          - us
          - futures
      - name: symbols
        in: query
        required: false
        description: >-
          Comma-separated symbols replacing the default population, at most 50.
          Not combinable with movers.
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.:/\-]{1,32}(,[A-Za-z0-9_.:/\-]{1,32}){0,49}$
      - name: movers
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 50
          default: 10
      - name: max_lag_seconds
        in: query
        required: false
        schema:
          type: integer
          minimum: 60
          maximum: 3600
          default: 600
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.:\-]+$
          maxLength: 128
          description: Code or opaque reference only; no raw exception or broker message.
      responses:
        '200':
          description: Read-only result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionObservationResponse'
        '401':
          description: auth_missing or auth_invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: scope_denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: feature_off
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: timeout, upstream_unavailable or schema_mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trading/api/retro/v1/retro_symbol_events:
    get:
      operationId: retro_symbol_events
      description: >-
        One timeline of stored daily bars and stored official events for one
        symbol, cut off at known_cutoff. as_of stays the response generation
        time; known_cutoff is the separate knowledge cutoff and is echoed back.
        from and to select the market's own session date of a bar and the
        source's event date of an event (inclusive, at most 366 days). Rows are
        ordered by date, then instant (bar end, event first receipt).

        Events: official sources only - dart and naver_disclosure (kr), sec and
        benzinga (us), upbit_notice and bithumb_notice (crypto) - linked to the
        symbol itself; market-wide events are not included. An event is shown
        only when first_received_at <= known_cutoff. Its representation is the
        last stored revision observed at or before the cutoff;
        superseded_later only says that a later revision exists, and no value of
        a later version is returned. The symbol link is read from the current
        row, so an event a later revision moved to another symbol is not listed.

        Bars: a daily bar is shown only when bar_end_at <= stored_at <=
        known_cutoff, stored_at being the last stored write. The KR and US daily
        sync rewrites its recent sessions, so recent bars before an old cutoff
        are usually withheld and counted.

        excluded_after_cutoff counts rows received, stored or closed after the
        cutoff. It is a retrospective count only and is never evidence that the
        information was available then. excluded_unproven counts rows whose
        receipt, version, symbol link or bar finality cannot be proven. A null
        count has a count_unavailable unknown. collection is the ingestion
        partition state at generation time (not at the cutoff); this operation
        never starts or waits for a collector. Count and rows share one
        read-only snapshot.
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.:/\-]{1,32}$
      - name: market
        in: query
        required: false
        description: Explicit market selection; when omitted, inferred from symbol.
        schema:
          type: string
          enum: [kr, us, crypto]
      - name: known_cutoff
        in: query
        required: true
        description: >-
          Knowledge cutoff, an RFC 3339 UTC instant ending in Z. Only what was
          received or stored at or before it is returned.
        schema:
          type: string
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,6})?Z$
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.:\-]+$
          maxLength: 128
          description: Code or opaque reference only; no raw exception or broker message.
      responses:
        '200':
          description: Read-only result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetroSymbolEventsResponse'
        '401':
          description: auth_missing or auth_invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: scope_denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: feature_off
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: validation_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: timeout, upstream_unavailable or schema_mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    DecimalValue:
      type:
      - string
      - 'null'
      pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$
      description: Exact decimal string; no float conversion. Unit and currency are
        given by the containing row.
    EvidenceBasis:
      type: string
      enum:
      - broker
      - inference
      - unknown
    LinkBasis:
      description: >-
        How a link was made. recorded is an exact key a writer stored at its
        own event; inference is a heuristic, or a stored key without proof that
        the order was sent.
      type:
      - string
      - 'null'
      enum:
      - recorded
      - inference
      - null
    LinkReason:
      description: >-
        Closed code for a missing or weakened link. ambiguous_attempts - the live
        send attempts of one order key belong to several decisions.
        attempt_unconfirmed - one decision, but no sent outcome was recorded.
        no_candidate_ref, candidate_outside_trading_day, candidate_ref_unresolved
        - why a proposal has no candidate link. ambiguous_decision,
        no_decision_link - why a trade has no decision link. attempts_unavailable
        - the send-attempt read failed or was cut off, so no link was concluded.
      type:
      - string
      - 'null'
      enum:
      - ambiguous_attempts
      - attempt_unconfirmed
      - no_candidate_ref
      - candidate_outside_trading_day
      - candidate_ref_unresolved
      - ambiguous_decision
      - no_decision_link
      - attempts_unavailable
      - null
    BlockReason:
      description: >-
        Why a proposal or rung has not been submitted, derived from stored
        columns only. awaiting_human_approval - an approval card went to a
        person and is unanswered. auto_approve_demoted - auto-approve was
        evaluated and refused, so the order waits for a person.
        deferred_session_closed, no_executable_window, calendar_unknown,
        invalid_valid_until - the approval-window verdict that stopped the
        last card dispatch. expired_valid_until - the order expired before it
        was sent. voided, superseded - the proposal or rung was voided or
        replaced. denied_by_operator - a person denied it. rejected_policy_guard
        - a policy guard rejected the rung. rejected_broker - the broker
        rejected or throttled it. duplicate_intent - an identical pending
        intent already existed. The stored reason text and any broker message
        are never exposed.
      type: string
      enum:
      - awaiting_human_approval
      - auto_approve_demoted
      - deferred_session_closed
      - no_executable_window
      - calendar_unknown
      - invalid_valid_until
      - expired_valid_until
      - voided
      - superseded
      - denied_by_operator
      - rejected_policy_guard
      - rejected_broker
      - duplicate_intent
    UnknownReason:
      type: string
      enum:
      - not_read
      - unavailable
      - unsupported
      - stale
      - upstream_error
      - count_unavailable
      - missing_data
      - not_applicable
      - flows_not_confirmed
      - source_mixed
      - incomplete_evidence
      - redacted
      - no_partition
      - not_recorded
      - scoped_collection
    Unknown:
      type: object
      additionalProperties: false
      required:
      - field
      - reason
      properties:
        field: *id001
        reason:
          $ref: '#/components/schemas/UnknownReason'
    Envelope:
      description: >-
        A null total requires a total/count_unavailable unknown. Every null row
        value requires a row reason or missing_reason, or an unknown entry with
        its dotted data path. Never include raw exceptions or broker messages.
      type: object
      required:
      - as_of
      - data_as_of
      - timezone
      - total
      - truncated
      - limit
      - cursor
      - next_cursor
      - unknowns
      properties:
        as_of: &id004
          type: string
          format: date-time
        data_as_of: &id003
          type:
          - string
          - 'null'
          format: date-time
        timezone: *id001
        total:
          type:
          - integer
          - 'null'
          minimum: 0
        truncated:
          type: boolean
        limit:
          type: integer
          minimum: 1
          maximum: 500
        cursor: &id002
          type:
          - string
          - 'null'
          pattern: ^[A-Za-z0-9_.:\-]+$
          maxLength: 128
          description: Code or opaque reference only; no raw exception or broker message.
        next_cursor: *id002
        unknowns:
          type: array
          items:
            $ref: '#/components/schemas/Unknown'
      allOf:
      - if:
          properties:
            total:
              type: 'null'
          required:
          - total
        then:
          properties:
            unknowns:
              contains:
                type: object
                properties:
                  field:
                    const: total
                  reason:
                    const: count_unavailable
                required:
                - field
                - reason
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - auth_missing
          - auth_invalid
          - scope_denied
          - feature_off
          - validation_error
          - timeout
          - upstream_unavailable
          - schema_mismatch
        message:
          type: string
          description: Fixed safe message; no raw exception or broker message.
          enum:
          - Authentication required.
          - Authentication invalid.
          - Scope denied.
          - Feature unavailable.
          - Request invalid.
          - Invalid market parameter.
          - Request timed out.
          - Upstream unavailable.
          - Schema mismatch.
    ChainRow:
      description: >-
        Order rows originate from live broker order ledgers, including direct orders.
        An unambiguous order links to its rung; fills link to their ledger order.
        Order statuses are filled, partially_filled, working, cancelled, expired,
        rejected, and unresolved. Authoritative fills take precedence, followed
        by broker terminal status, then the linked rung expiry inference; a
        current-day open order is working and an older one without terminal
        evidence is unresolved. Rejection reasons are rate_limited, price_limit,
        insufficient_balance, market_closed, invalid_order, or broker_other.
        Expiry reasons are day_order_expired or expired_inference_no_broker_original;
        cancellation uses cancelled and unresolved uses no_terminal_evidence.
        The optional link fields are present only with a value. link_basis says
        how linked_ref was made; decision_ref is the decision a proposal, rung or
        order descends from and decision_link_basis how that was made.
        An order whose send key has attempts of one decision links to that
        decision (recorded with a sent outcome, otherwise inference with
        attempt_unconfirmed); attempts of several decisions give no link
        (ambiguous_attempts); with no attempt the rung match applies (idempotency
        key recorded, correlation only inference). A proposal links to the
        candidate its decision names; one without a decision links to an earlier
        candidate of the same KST day only (inference).
        The optional block_reason and block_reason_basis appear only on proposal
        and rung rows whose stored evidence decides why the order is not
        submitted; recorded is a value a writer stored, inference is derived from
        the absence of a send. A row without such evidence has neither key.
      type: object
      additionalProperties: false
      required:
      - symbol
      - stage
      - event_at
      - event_ref
      - linked_ref
      - status
      - reason
      - quantity
      - price
      - currency
      - unit
      - basis
      properties:
        symbol: *id001
        stage:
          type: string
          enum:
          - candidate
          - proposal
          - rung
          - order
          - fill
          - markout
          - lot
        event_at: *id003
        fill_time_basis:
          description: >-
            Time basis of event_at on a fill row. Complete same-order websocket
            coverage supplies the latest broker fill time for an aggregate row.
            Otherwise the ledger row supplies the time and basis. Absent when unknown.
          type: string
          enum: [broker_fill_time, broker_order_time, observed_at]
        event_ref: *id001
        linked_ref: *id002
        status: *id001
        reason: *id002
        quantity:
          $ref: '#/components/schemas/DecimalValue'
        price:
          $ref: '#/components/schemas/DecimalValue'
        currency: *id002
        unit: *id001
        basis:
          $ref: '#/components/schemas/EvidenceBasis'
        link_basis:
          $ref: '#/components/schemas/LinkBasis'
        decision_ref: *id002
        decision_link_basis:
          $ref: '#/components/schemas/LinkBasis'
        link_reason:
          $ref: '#/components/schemas/LinkReason'
        block_reason:
          $ref: '#/components/schemas/BlockReason'
        block_reason_basis:
          type: string
          enum:
          - recorded
          - inference
    FunnelRow:
      description: Order and fill counts use the same ledger orders and fill rows as the chain.
      type: object
      additionalProperties: false
      required:
      - stage
      - cohort
      - count
      - denominator
      - fill_rate
      - unit
      - basis
      - missing_reason
      properties:
        stage: *id001
        cohort: *id001
        count:
          type:
          - integer
          - 'null'
          minimum: 0
        denominator:
          type:
          - integer
          - 'null'
          minimum: 0
        fill_rate:
          $ref: '#/components/schemas/DecimalValue'
        unit: *id001
        basis:
          $ref: '#/components/schemas/EvidenceBasis'
        missing_reason:
          anyOf:
          - $ref: '#/components/schemas/UnknownReason'
          - type: 'null'
        account_mode:
          description: Present only on stages that read live account populations.
          type: string
          enum:
          - live
        brokers:
          description: Live brokers whose ledger population this stage's query selected
            for the market. Present with account_mode only.
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - kis
            - toss
            - upbit
        date_basis:
          description: The KST window column the stage was filtered on. candidate_recorded_at_kst
            - screener pick recorded_at. forecast_created_kst - rejected forecast created_at.
            proposal_created_kst - proposal created_at (rung counts use their proposal's
            date). order_trade_date_kst - trade_date of the live order ledgers. fill_filled_at_kst
            - execution_ledger filled_at.
          type: string
          enum:
          - candidate_recorded_at_kst
          - forecast_created_kst
          - proposal_created_kst
          - order_trade_date_kst
          - fill_filled_at_kst
    Benchmark:
      type: object
      additionalProperties: false
      required:
      - return_rate
      - source
      - basis
      - unknown_reason
      properties:
        return_rate:
          $ref: '#/components/schemas/DecimalValue'
        source: *id002
        basis:
          $ref: '#/components/schemas/EvidenceBasis'
        unknown_reason:
          anyOf:
          - $ref: '#/components/schemas/UnknownReason'
          - type: 'null'
    ScoreRow:
      type: object
      additionalProperties: false
      required:
      - scope
      - subject_ref
      - market
      - basis
      - evidence_basis
      - return_rate
      - unmeasured_reason
      - flows_complete
      - start_amount
      - end_amount
      - flow_amount
      - currency
      - unit
      - benchmark
      properties:
        scope:
          type: string
          enum:
          - account
          - market
          - sleeve
        subject_ref: *id001
        market: *id001
        basis:
          type: string
          enum:
          - modified_dietz
          - holdings_only
          - sleeve_budget
        evidence_basis:
          $ref: '#/components/schemas/EvidenceBasis'
        return_rate:
          $ref: '#/components/schemas/DecimalValue'
        unmeasured_reason: *id002
        flows_complete:
          type:
          - boolean
          - 'null'
          description: Server-side fact; null when not applicable or unknown.
        start_amount:
          $ref: '#/components/schemas/DecimalValue'
        end_amount:
          $ref: '#/components/schemas/DecimalValue'
        flow_amount:
          $ref: '#/components/schemas/DecimalValue'
        currency: *id001
        unit: *id001
        benchmark:
          $ref: '#/components/schemas/Benchmark'
    PositionRow:
      type: object
      additionalProperties: false
      required:
      - symbol
      - market
      - position_ref
      - broker
      - quantity
      - average_price
      - unrealized_amount
      - currency
      - unit
      - basis
      - lot_state
      - missing_reason
      properties:
        symbol: *id001
        market:
          type: string
          description: Market derived from the ledger instrument type.
          enum: [kr, us, crypto]
        position_ref: *id001
        broker:
          description: Broker code, never an account identifier.
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
        quantity:
          $ref: '#/components/schemas/DecimalValue'
        average_price:
          $ref: '#/components/schemas/DecimalValue'
        unrealized_amount:
          $ref: '#/components/schemas/DecimalValue'
        currency: *id001
        unit: *id001
        basis:
          $ref: '#/components/schemas/EvidenceBasis'
        lot_state:
          type: string
          enum:
          - known
          - unknown
        missing_reason:
          anyOf:
          - $ref: '#/components/schemas/UnknownReason'
          - type: 'null'
    ExperimentRow:
      type: object
      additionalProperties: false
      required:
      - strategy_id
      - experiment_ref
      - environment
      - planned_count
      - sent_count
      - filled_count
      - uncertain_count
      - episode_pnl_amount
      - currency
      - unit
      - basis
      properties:
        strategy_id: *id001
        experiment_ref: *id001
        environment: *id001
        planned_count:
          type:
          - integer
          - 'null'
          minimum: 0
        sent_count:
          type:
          - integer
          - 'null'
          minimum: 0
        filled_count:
          type:
          - integer
          - 'null'
          minimum: 0
        uncertain_count:
          type:
          - integer
          - 'null'
          minimum: 0
        episode_pnl_amount:
          $ref: '#/components/schemas/DecimalValue'
        currency: *id001
        unit: *id001
        basis:
          $ref: '#/components/schemas/EvidenceBasis'
    BarRow:
      type: object
      additionalProperties: false
      required:
      - symbol
      - market
      - time
      - open_price
      - high_price
      - low_price
      - close_price
      - quantity
      - currency
      - unit
      - source
      - venue
      - adjusted
      - missing_reason
      - basis
      properties:
        symbol: *id001
        market:
          type: string
          description: Market actually read, selected explicitly or inferred from symbol.
          enum: [kr, us, crypto]
        time: *id004
        open_price:
          $ref: '#/components/schemas/DecimalValue'
        high_price:
          $ref: '#/components/schemas/DecimalValue'
        low_price:
          $ref: '#/components/schemas/DecimalValue'
        close_price:
          $ref: '#/components/schemas/DecimalValue'
        quantity:
          $ref: '#/components/schemas/DecimalValue'
        currency: *id001
        unit: *id001
        source: *id002
        venue: *id002
        adjusted: &id005
          type:
          - boolean
          - 'null'
        missing_reason: &id006
          anyOf:
          - $ref: '#/components/schemas/UnknownReason'
          - type: 'null'
        basis: &id007
          $ref: '#/components/schemas/EvidenceBasis'
        session_segment:
          description: Session label of a kr/us 1m bar (research table). Absent for
            other bars.
          type: string
          enum:
          - KRX_REGULAR
          - KRX_AFTER
          - NXT_PRE
          - NXT_OVERLAP
          - NXT_POST
          - US_PRE
          - US_REGULAR
          - US_POST
          - US_DAY
          - UNKNOWN
        value:
          description: Per-bar traded value of a kr/us 1m bar, exact decimal. Absent
            (never 0) when storage holds NULL; value_reason says why.
          type: string
          pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$
        value_reason:
          description: Present only when value is absent on a kr/us 1m bar.
          $ref: '#/components/schemas/UnknownReason'
        first_received_at:
          description: First receipt time (research retrieved_at) of a kr/us 1m bar.
            Absent when the row came from a backfill/promotion batch.
          type: string
          format: date-time
        first_received_reason:
          description: Present only when first_received_at is absent on a kr/us 1m
            bar.
          $ref: '#/components/schemas/UnknownReason'
        revised_at:
          description: Receipt time of the selected KIS KRX auction revision, if present.
          type: string
          format: date-time
        krx_official_close:
          description: Exact KRW close from the revised KIS KRX 15:30 auction bar, if present.
          type: string
          pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$
    GapRow:
      type: object
      additionalProperties: false
      required:
      - dataset
      - symbol
      - last_updated_at
      - source
      - venue
      - adjusted
      - missing_reason
      - basis
      properties:
        dataset: *id001
        symbol: *id002
        last_updated_at: *id003
        source: *id002
        venue: *id002
        adjusted: *id005
        missing_reason: *id006
        basis: *id007
    RetroDayResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/ChainRow'
      description: total counts matching chain events for the requested market and
        date before pagination, or null with count_unavailable. Page length is never
        total.
      unevaluatedProperties: false
    RetroSymbolResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/ChainRow'
      description: total counts matching chain and lot events for the symbol and range
        before pagination, or null with count_unavailable. Page length is never total.
      unevaluatedProperties: false
    RetroFunnelResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/FunnelRow'
      description: total counts matching funnel stages for the same cohort before
        pagination, or null with count_unavailable. Page length is never total.
      unevaluatedProperties: false
    RetroScoreboardResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/ScoreRow'
      description: total counts matching account, market and sleeve rows before pagination,
        or null with count_unavailable. Page length is never total.
      unevaluatedProperties: false
    RetroPositionsResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/PositionRow'
      description: total counts matching position rows at the requested cutoff before
        pagination, or null with count_unavailable. Page length is never total.
      unevaluatedProperties: false
    MockExperimentsResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/ExperimentRow'
      description: total counts matching experiment rows before pagination, or null
        with count_unavailable. Page length is never total.
      unevaluatedProperties: false
    RoundTripLeg:
      type: object
      additionalProperties: false
      required:
      - leg_ref
      - role
      - side
      - broker_side
      - status
      - broker_order_bound
      properties:
        leg_ref: *id001
        role:
          type: string
          enum:
          - entry
          - exit
        side:
          type: string
          enum:
          - buy
          - sell
          - short
          - cover
        broker_side:
          type: string
          enum:
          - buy
          - sell
        status:
          type: string
          enum:
          - planned
          - sending
          - uncertain
          - accepted
          - partially_filled
          - filled
          - canceled
