# Task #1003 (incident 2026-09-29 22:35, us-2235 on at-mcp-live-us): pinned
# inventory of the MCP tools the live-session prompts reference, per live
# lane, for tests/mcp_server/test_live_prompt_profile_contract.py.
#
# Source of truth is the operator repo. This file pins what the prompts said
# at operator_commit so the always-run contract test needs no operator
# checkout. With AUTO_TRADER_OPERATOR_ROOT set, the drift tests re-read the
# prompts and fail when a referenced tool is neither served nor classified
# here, or when a pinned name or ref no longer holds.
#
# served lists the referenced tools the profile serves. The other classes
# cover referenced tools it does NOT serve (required ones may later move in):
#   required     — unconditional step, or the only named source for a step
#   conditional  — conditional step, fallback, or one of two alternatives
#   guarded      — prompt already says: call only if on the surface, else record
#   not_required — prompt forbids it / says not callable (NEG), mentions it
#                  descriptively (DESC), or only in another market's section (NA)
# The contract: served and required must both be in the live profile
# (required is xfail while the #1003 gap is open); conditional, guarded and
# not_required are recorded, not enforced. Move entries between classes only
# with the operator decision (hk:doc incident/2026-09-29/live-profile-gap).
