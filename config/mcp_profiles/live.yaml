          purpose: "Save a forecast record for the learning loop."
        - name: forecast_resolve
          calls_30d: 717
          purpose: "Resolve a forecast outcome for scoring."
        - name: save_trade_retrospective
          calls_30d: 110
          purpose: "Persist a trade retrospective record."
