        # operator-approved PR.
        - name: get_investment_opinions
          calls_30d: 0
          purpose: "Analyst opinions + consensus read; kr lane allowlist #930."
        - name: get_market_index
          calls_30d: 113
          purpose: "Market index levels."
        - name: analyze_stock_batch
          calls_30d: 570
          purpose: "Batch multi-symbol analysis (top-20 usage)."
        - name: session_context_get_recent
          calls_30d: 119
          purpose: "Read recent session context entries."
        # Q-65 (task #918): get_news dropped from this lane's extension to
        # admit the two cash-sweep reads below (sweep playbook #879/#899);
        # get_news is restorable by an operator-approved PR.
        - name: get_parking_exclusion
          calls_30d: 0
          purpose: "Cash-sweep parking-exclusion read; kr/us lane allowlists #883."
          gate: ORDER_PROPOSALS_ENABLED
        - name: toss_proposal_accounts
          calls_30d: 0
          purpose: "Toss account list read for the sweep proposal path; lane allowlists #883."
          gate: ORDER_PROPOSALS_ENABLED
      # emergency/recovery exceptions — existing tools only, own group.
      # No direct place tool: loss_cut is disabled on all of them (ROB-864);
      # the loss_cut path is order_proposal_create (core).
      emergency:
        - name: cancel_order
          purpose: "Cancel an open order (generic account_mode route)."
        - name: modify_order
          purpose: "Modify an open order (generic account_mode route)."
        - name: kis_live_cancel_order
          purpose: "Cancel an open KIS live KR order (typed path)."
        - name: kis_live_modify_order
          purpose: "Modify an open KIS live KR order (typed path)."
        - name: kis_live_reconcile_orders
          purpose: "Reconcile KIS live KR orders against broker fill evidence (dry_run default)."
        - name: toss_cancel_order
          purpose: "Cancel an open Toss live order (typed path)."
        - name: toss_modify_order
          purpose: "Modify an open Toss live order (typed path)."
        - name: toss_reconcile_orders
          purpose: "Reconcile Toss live orders against broker evidence (dry_run default)."
        - name: investment_watch_void
          calls_30d: 6
          purpose: "Void an investment watch (watch lifecycle recovery)."
