# Task #891 / operator decision Q-53 (2026-09-28; replaces the Q-52
# CORE/EXTENDED tiering).
#
# The ONE file that lists every tool the live-session MCP profiles
# (live-kr / live-us / live-crypto) may register. Nothing reaches a live
# profile unless it is listed here; every listed name must resolve to an
# already-registered tool or startup fails.
#
# Three groups per lane, all loaded:
#   core      — 15 tools: quotes, balances, open orders, proposals,
#               watches, records. get_available_capital, never
#               get_cash_balance.
#   extension — up to 10 per-market heavy hitters from the usage doc.
#   emergency — recovery exceptions, existing tools only, kept in their
#               own group so they are visible: cancel, modify, reconcile,
#               watch void — and nothing else (operator ruling Q-62). This
#               is the ONLY group where order-mutation tools may appear,
#               and only the names listed per lane.
#
# Counting rule (Q-53): the "20-25 tools per lane" budget applies to
# core+extension; emergency entries are additive named exceptions.
# core 15 + extension <= 10 lands every lane inside the budget.
#
# loss_cut truth (verified against the code):
#   * The ONLY existing loss_cut execution path is
#     order_proposal_create(exit_intent="loss_cut") — kept in CORE.
#   * The direct place tools (place_order, toss_place_order,
#     kis_live_place_order) reject exit_intent="loss_cut" outright
#     (ROB-864, error loss_cut_direct_path_disabled_use_order_proposal_create),
#     so they are NOT loss_cut paths. Listing them would silently grant
#     unrestricted direct live placement outside the proposal/Telegram
#     approval flow — operator ruling Q-62 keeps them out entirely.
#   * kis_live_get_order_history stays out entirely — harness-denied for
#     live sessions (#678, HARNESS_DENIED_TOOLS). get_upbit_altseason is the
#     same denial class but listed on live-crypto per operator decision
#     Q-58 (registered surface only until the #678 denial is lifted).
#
# Every line carries its 30-day call count from the usage evidence doc
# (calls_30d) and a one-line purpose. Counts are reference only (Sentry
# figures exclude failures, refusals, wrong calls replaced within a minute,
# and reads that never led to a write); emergency entries may omit the
# count since inclusion there is categorical, not usage-driven.
#
# Adding a tool = operator-approved PR touching this file; quarterly Sentry
# review removes unused tools. This whitelist is the baseline before runner
# mechanization and will be re-cut later. See docs/runbooks/live-mcp-profiles.md.
version: 1
evidence:
  doc: "hk:doc report/2026-09-28/q52-mcp-usage-30d"
  window: "2026-08-29..2026-09-28"
  note: >-
    Counts are 30-day calls observed on the default profile (10,376 calls,
    87 tools; top-20 = 84%). Reads are mostly untagged by lane so the same
    doc counts apply per lane. Deliberate exclusions with doc basis:
    get_cash_balance (12 calls; superseded by get_available_capital, 208);
    kis_live_get_order_history (227 calls but harness-denied for live
    sessions per the #678 ruling — it is in HARNESS_DENIED_TOOLS);
    list_active_watches (60), get_indicators (69), get_trading_policy (64),
    get_forecasts (80), analysis_artifact_get (84), get_fx_rate, get_quote_fresh,
    get_position, screen_stocks, forecast_accuracy_recent,
    session_bootstrap_pack — below cutoff or not evidenced for live lanes;
    any can return via an operator-approved PR.
