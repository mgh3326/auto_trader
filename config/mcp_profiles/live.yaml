# Task #891 / operator decision Q-52 (2026-09-28).
#
# The ONE file that lists every tool the live-session MCP profiles
# (live-kr / live-us / live-crypto) may register. Nothing reaches a live
# profile unless it is listed here; every listed name must resolve to an
# already-registered tool or startup fails.
#
# Tiers: `core` is the operator's ~15-tool spine; `extended` is the
# doc-evidenced remainder. `tiers:` under each profile is the single switch
# selecting which tiers load — default [core, extended] until the operator
# decides the final cut (tracked in the task report).
#
# Every line carries its 30-day call count from the usage evidence doc
# (calls_30d) and a one-line purpose. Write/persistence tools are allowed
# only when they are in the operator draft or appear under `extended` with
# the doc's evidence. Direct broker order/cancel/modify tools are forbidden
# here and rejected at load time.
#
# Adding a tool = operator-approved PR touching this file; quarterly Sentry
# review removes unused tools. See docs/runbooks/live-mcp-profiles.md.
version: 1
evidence:
  doc: "hk:doc report/2026-09-28/q52-mcp-usage-30d"
  window: "2026-08-29..2026-09-28"
  note: >-
    Counts are 30-day calls observed on the default profile (10,376 calls,
    87 tools; top-20 = 84%). Reads are mostly untagged by lane so the same
    doc counts apply per lane. Deliberate exclusions with doc basis:
    get_cash_balance (12 calls; superseded by get_available_capital, 208);
    kis_live_get_order_history (227 calls but harness-denied for live
    sessions per the #678 ruling — it is in HARNESS_DENIED_TOOLS);
    list_active_watches (60), get_indicators (69), get_trading_policy (64),
    get_forecasts (80), analysis_artifact_get (84), get_fx_rate, get_quote_fresh,
    get_position, screen_stocks, forecast_accuracy_recent,
    session_bootstrap_pack — below cutoff or not evidenced for live lanes;
    any can return via an operator-approved PR.
profiles:
  live-kr:
    description: >-
      KR live lane (KIS/Toss domestic). Proposal-led trading only:
      order_proposal_* writes a proposal for the existing approval path;
      direct broker order/cancel/modify tools are never present.
    tiers: [core, extended]
    tools:
      - name: get_quote
        tier: core
        calls_30d: 1626
        purpose: "Current quote for a symbol (compact projection; doc: 'quote')."
      - name: forecast_save
        tier: core
        calls_30d: 792
        purpose: "Persist a forecast for later accuracy resolution."
      - name: route_request
        tier: core
        calls_30d: 785
        purpose: "Lane router: intent+market -> proposal-led allowed/blocked plan."
      - name: forecast_resolve
        tier: core
        calls_30d: 717
        purpose: "Resolve a saved forecast against the observed outcome."
      - name: get_support_resistance
        tier: core
        calls_30d: 570
        purpose: "Support/resistance levels for a symbol."
      - name: analyze_stock_batch
        tier: core
        calls_30d: 570
        purpose: "Batch full-pipeline analysis (signal/confidence/position)."
      - name: order_proposal_list
        tier: core
        calls_30d: 418
        purpose: "List order proposals and their states (read)."
        gate: ORDER_PROPOSALS_ENABLED
      - name: get_ohlcv
