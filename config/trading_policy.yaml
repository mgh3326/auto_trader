# Trading policy — single authoritative source (ROB-646).
# Seeded verbatim from docs/playbooks/trading-decision-playbook.md policy_keys
# (captured 2026-07-02). Edited by operator PR ONLY — there is no write tool.
# Repo is public; exposing these values is an accepted decision.
# §104차 (2026-08-19): crash-day 신규진입은 표준 매수 게이트를 통과한
# strong 지지 후보에 한해 조건부로만 전면 hold를 해제한다. 즉석 판단이나
# 게이트 면제·완화·대체가 아니며, preplanned ladder도 advisory로만 남긴다.
# §115차 (2026-08-20): fresh 명명 저항이 0개인 보유(ETH·LINK 랠리 실사고)는
# 저항 기반 매도 티어에 하나도 매칭되지 않아 익절 경로가 소멸한다. 그 공백만
# 닫는 폴백 티어 sell.trim_preplace.breakeven_extension_ladder 를 신설한다.
# 저항 티어의 대체가 아니며, exclusions.no_resistance_reference 는 유지된다.
# §139차 (2026-08-22): 매수 회고 운영자 결정 3건이 정책 표면에 내려온다 — US
# one_share 절대상한 철폐, 지수 ETF 유니버스 동등 편입, crypto 보유
# 메이저 지지선 사전 그물(한시·4주 채점). 세 개 모두 게이트를 낮추지
# 않고, 세 번째는 배치 전에 폐지 조건을 문서에 고정해 둔다.
# §142차 (2026-08-23): 정책 절 간 모순 1건 해소(versioned bugfix, 소급 적용
# 금지). §115차 래더 1단 앵커(평단×1.01)와 §44차 reserve-trim post-max 앵커는
# §40차 breakeven_band_pct=1% 의 **포함 비교**(|distance| <= band)와 경계에서
# 충돌한다 — 평단×1.01 이 이미 틱 배수면 tick ceil 이 no-op 이라 매도 rung 이
# 밴드 경계에 그대로 앉고, take_profit 이 breakeven_band 로 강등되어 §40차
# 자동승인 레인에 영원히 진입하지 못한다(검증자 실측: avg 4,000,000 KRW →
# raw 4,040,000 → ceil no-op → eligible=False reason='breakeven_band').
# 수리는 국소적이다: 두 앵커의 실효값을 밴드 상단 위 첫 유효 틱까지만 밀어
# 올린다. 🔴 classify_sell_profit 의 전역 포함 비교(<=)는 건드리지 않는다
# (밴드 분류기의 다른 소비자 전수검토 없이 <= → < 변경 금지). 신규 티어·임계
# 완화·수량 규칙 변경 0.
# §156차 (2026-08-26): auto-approval authorization revision. `table_disagreement`
# remains an auditable session record but is no longer an approval-blocking tag.
# §156차 final scope addition ②: tier-shaped metadata is not an input. In
# expanded mode, only a fresh broker-previewed limit sell classified as a
# fee-netted `take_profit` may be marketable; marketable buys and all other
# marketable sell verdicts remain manual. ④⑤: the Toss interlock releases only
# after normal full fill +
# clean ledger reconciliation; the sector cap is observed, warned, and retained
# as an advisory rather than a reserve-net admission gate.
version: "2026-08-26.3"
captured_as_of: "2026-08-12"
source: "ROB-643/751 baseline; ROB-839 crypto-recheck reports 2026-07-11/12; ROB-871 resting auto-approve seed; ROB-932 crash-day advisory keys; ROB-948 user-stance advisory keys; ROB-956 US per-symbol USD sizing key; ROB-999/Fable governance advisory 2026-07-22 Q3 #4/#6; operator theme-cap direction 2026-07-22; KR single-share full-exit far-lane shadow seed 2026-07-23; GPT Pro trading retrospective Phase 2.5 advisory received 2026-07-25; operator D2/D5/D7 momentum-spike, single-share, and minimum-benefit decisions captured 2026-07-27; posture-v1 ROB-1090 transition contract approved 2026-07-27; ROB-1106 posture-v1 shadow stage 1 default-off contract 2026-07-28; operator drift removal 2026-08-08 (Phase 2.5 rules 01-09/11-14 and profit_realization advisory tier removed — unvalidated advisory hypotheses; rule 10 retained as D5 disposition owner); AUTO-APPROVE-EXPAND §40차 profit-take classification inputs 2026-08-12 (breakeven_band_pct, round_trip_cost_bps — consumed only under ORDER_PROPOSALS_AUTO_APPROVE_MODE=expanded, default off); operator §45/§46 buy.support_reserve_net literal policy/consumer contract 2026-08-12 (no proposal-service or broker mutation implementation); verify-r1 S1/S2/S3 completion 2026-08-12 (priority rules, A_limit<=0 NO_ORDER, playbook structure; no execution-surface change) §44차 breakeven reserve trim advisory tier 2026-08-12 (existing loss guard, near-breakeven, and D7 keys reused; no execution guard change) §44차 closeout 2026-08-12 (post-max tick ceil, machine sell-lane tier, and D7 consumer-estimate limits); §115차 breakeven extension ladder fallback tier for zero-fresh-named-resistance holdings 2026-08-20 (ROB-1298; existing loss guard multiple and existing trim sizing reused; no exclusion removal, no gate change); §127차 concurrent-new-entry slots 1→2 and buy.winner_pullback_add pre-registered tier 2026-08-21 (operator decision in claude-mock session; breakout chase remains forbidden); §129차 buy.new_entry_overflow cash-conditioned overflow slots at 0.5x sizing 2026-08-21 (operator decision in claude-mock session; no gate relaxed); §133차 KR per-order auto-approve cap 2M 2026-08-21 (single-share high-priced KR exits structurally carded — SK하이닉스 1,776,000 measured case, §65차 US twin; daily cap unchanged); §136차 A(k) two add symbols per market + owned-symbol add exempt from new-entry symbol cap 2026-08-21 (operator directive to deploy idle Upbit KRW; measured blocker from 2026-08-21 20:20 session; k_used retained at 0.10 — k is the averaging-target parameter, and raising it flips A_limit non-positive, the opposite of expansion); §139차 buy-side retrospective decisions 2026-08-22 (operator decisions in claude-mock session, sourced from retro-buyside-multiweek-20260822.md): US one_share_exception absolute_ceiling_usd 700 -> 10000 (operator: deposited cash is the ceiling; the real boundary is cash plus the USD 1,500 per-order auto-approve cap, and the AVGO -11.58% counter-evidence is retained), buy.index_etf_candidate equal-candidate universe admission for broad index ETFs with structurally-absent gates declared not-applicable rather than waived, and buy.held_majors_support_net time-boxed pre-registered LIVE crypto tier for profitable held coins (<=300k KRW per coin, <=900k KRW tier, scored 2026-09-19 and retired unless the filled cohort D+20 median >= 0 and lower quartile > -8%; ROB-1031 60% post-touch breakdown and the XRP -8.36% one-hour flush recorded as counter-evidence). No gate relaxed for new-coin discovery; no approval cap raised. §142차 breakeven band boundary repair 2026-08-23 (GPT Pro checkpoint #3 Q4 permitted class 'policy-clause contradiction resolution'; versioned bugfix, NOT retroactive — cohorts and forecasts stamped with an earlier policy version keep the anchor they were placed under): the §115차 breakeven_extension_ladder tier-1 anchor and the §44차 sell.breakeven_reserve_trim post-max anchor now resolve to max(tick_ceil(raw anchor), first valid tick STRICTLY above average_cost × (1 + order_proposals.auto_approve.breakeven_band_pct / 100)), because the §40차 break-even band comparison is inclusive (|distance| <= band) and a rung that lands exactly on avg × 1.01 was classified breakeven_band instead of take_profit whenever the tick ceil was a no-op. The §40차 classifier itself is unchanged — the inclusive comparison stays inclusive globally — and no threshold, cap, tier, sizing rule, or exclusion is added or relaxed. §145차 crypto per-order auto-approve cap 1M -> 5M and daily cap 5M -> 10M 2026-08-23 (operator decision in claude-mock session: \"100만 초과도 자동이었으면 해\"): the averaging-down A_limit band the §136차 add lane produces runs past 1M (XRP ~2.93M at the -5% conversion point, measured 2026-08-23), so every such add was structurally carded. The §71차 lesson is kept by raising the daily cap in proportion (5M -> 10M) so the first auto-approved add does not demote the rest of the day to cards. Per §106차 the per-order cap remains the maximum-loss boundary of one automation error; the operator re-defined that boundary at 5M. The real ceiling stays the Upbit orderable cash (§144차 trigger reserve plus JIT deposit), and a short-of-cash proposal still emits deferred_with_condition plus a deposit alert before any order. min_distance, resting-only, tag scan, loss guard, and the no-partial-fill rule are unchanged, and no KR or US cap moves. §147차 concurrent-new-entry slot limit ABOLISHED 2026-08-24 (operator decision in claude-mock session: \"원화 여유로우니 슬롯 제한 불필요, 지지선 매수는 부담 없다\"): the §127차 two-slot count and the §129차 cash-conditioned 0.5x overflow slots are removed from the user_stances prose, and the buy.new_entry_overflow rule is DELETED because its whole reason to exist was to relieve a slot count that no longer exists. The number of concurrent new entries is now bounded by ORDERABLE CASH ALONE. This removes a COUNT limit only — every quality and diversification device is untouched and none is relaxed: the buy gates (RSI, support, upside, deep band), the per-symbol notional bands (KR 200,000-400,000 / US 150-450), the 10% sector cluster cap (portfolio.sector_cluster_cap_pct), and the 2-symbols-per-theme cap (portfolio.max_symbols_per_theme) all stand unchanged, so a candidate that fails any gate is still not admitted and concentration is still bounded. Honest record of the Q4 tension (carried forward verbatim from the operator ledger): this change is a withdrawal of an operator STANCE (a count limit), not the creation of a new tier, but it is in tension with the \"no relaxation before scoring\" intent of the Q4 tier freeze - the operator was informed of that tension and decided anyway. The scoring infrastructure (screener pick logging and negative-class recording) is already running, so the effect of this change is itself tracked in the record. No threshold, cap, sizing rule, gate, or approval surface is added or raised. §148차 A(k) eligibility wording contradiction resolution 2026-08-24 (Q4 permitted class: policy-clause contradiction resolution; this is wording-only scope clarification: threshold/value/enum changes 0; application-scope clarification only; discovery strong requirement and all other gates remain unchanged; versioned wording clarification, NOT retroactive — cohorts and forecasts stamped with an earlier policy version keep the anchor they were placed under). §156차 auto-approval authorization revision 2026-08-26 (table_disagreement retained as audit evidence, not an approval blocker; marketable orders remain resting-only pending canonical tier evidence; no threshold, cap, tier, sizing, or default-mode change). §156차 scope addendum ④⑤ 2026-08-26 (operator-approved): a same-session Toss fill interlock releases only after exact normal full-fill and clean ledger reconciliation; missing, partial, or unexpected evidence remains frozen. The 10% sector cluster cap is deliberately relaxed from a reserve-net admission backstop to an emitted and persisted advisory; unknown sector, negative projected-sector data, and max_symbols_per_sector_cluster remain hard gates; portfolio.max_symbols_per_theme and all quality, cash, and approval controls are otherwise unchanged. This directly reverses the §147 assertion that the sector cap stood unchanged and concentration was bounded by it; despite the recorded Q4 \"no relaxation before scoring\" tension, the informed operator decided that this cap must be observed, warned, and recorded rather than block an otherwise eligible candidate. §156차 final scope addendum ② 2026-08-26 (operator-approved): the earlier pending-canonical-tier-evidence wording is superseded. This is a narrow authorization relaxation: only an expanded-mode limit sell that is marketable and whose submit-time broker/account preview produces classify_sell_profit(...)=take_profit may auto-submit. The predicate uses the broker-origin avg_buy_price, inclusive break-even band, conservative round-trip cost, and the more pessimistic preview realized_pnl when supplied; no tier, strategy, rationale, or session self-declaration is an input. A fill can precede the veto card in this one case; marketable buys, market orders, loss/breakeven/unclassifiable sells, loss-cut, policy_deviation, account/market allowlists, and the existing loss-sell guard remain blocked or unchanged. Per-order and daily caps remain hard gates: for a marketable `take_profit` sell they meter `max(limit_price, current_price) × quantity`; resting sells, buys, and `off` mode retain `limit_price × quantity`."

authority:
  scope: judgment_policy_only
  governs: "advisory judgment thresholds, decision rules, and the observation-only sector-cluster concentration signal"
  does_not_govern:
    - "loss_guard code guard (order_validation.py avg*1.01) — stays fail-closed in code"
    - "ladder near-market guard (ladder_fill_safety.py 0.3%) — code"
    - "RSI scoring bands (scoring.py) — code"
    - "symbol_trade_settings — live per-symbol sizing (separate authority)"
    - "sell_conditions — dormant/test-only (not authoritative)"
    - "trade_profile — dead since ROB-488 (not revived)"

# ROB-1106 posture-v1 stage 1. This block is deliberately default-off and
# shadow-only. It is consumed only by the manual posture shadow entrypoint;
# existing signal/gate, proposal, broker, worker, and scheduler paths do not
# import or consult it.
posture:
  enabled: false
  mode: shadow
  states:
    - RESTING
    - CONDITIONAL
    - ARMED_DEFERRED
    - DISARMED
    - EXPIRED_REARMABLE
  policy_stamp_required: true

# ROB-871 — master-gated by ORDER_PROPOSALS_AUTO_APPROVE=false. Caps use the
# settlement currency for each market (KRW for kr/crypto, USD for us).
# TOSS-AUTO-FULL (§51, historical): the original caps were derived from the
# per-symbol notional bands × the then "동시 신규 최대 1종목" stance. That
# derivation is superseded — caps are now set directly by §106차 below. Slot
# lineage: §127차 raised the stance count 1→2 and §129차 added
# ``buy.new_entry_overflow`` (cash-conditioned 0.5x overflow); §147차
# (2026-08-24) ABOLISHED the count limit entirely and DELETED that rule, so
# no new-entry slot count exists anywhere in this document any more — the
# only bound on concurrent new entries is orderable cash. This comment
# records the lineage only; the caps below do not depend on any slot count.
order_proposals:
  auto_approve:
    min_distance_pct: 3
    # §106차 (2026-08-19): daily caps are a practical circuit-breaker release;
    # the daily limit must not constrict the approval lane. Per-order caps are
    # raised, not removed, and remain the maximum-loss boundary for one
    # automation error. The 3% distance in `off` mode, tag scan, breakeven
    # band, and round-trip-cost gates remain unchanged. §156 later permits only
    # an expanded-mode, fresh-previewed `take_profit` limit sell to be
    # marketable. Its per-order and daily cap measure is execution-price based
    # (`max(limit_price, current_price) × quantity`); all other rungs retain
    # limit-price cap metering, and no buy/loss-sell guard is relaxed.
    per_order_cap:
      # §133차 (2026-08-21): 1000000 → 2000000. The KR book holds single-share
      # lots of high-priced stocks (SK하이닉스 1주 = 1,776,000 KRW measured
      # 2026-08-21 11:41, reason_code per_order_cap_exceeded), so the 1M cap
      # structurally excluded every such one-share exit from auto-approve —
      # the KR twin of the US §65차 finding. 2M admits one-share exits while
      # still capping multi-share notional.
      kr: 2000000
      # §65차 (2026-08-14): 450 → 800. The US book holds single-share lots of
      # high-priced ETFs (QQQ/VOO/IVV/BRK.B at $500-750/share), so the band-
      # derived 450 structurally excluded every single-share profit-take from
      # auto-approve (25/25 sell proposals carded on 2026-08-13). 800 admits
      # one-share exits while still capping multi-share notional.
      us: 1500
      # §145차 (2026-08-23): 1000000 → 5000000. 운영자 결정 — "100만 초과도
      # 자동이었으면 해". §136차 A(k) add 레인이 만드는 물타기 A_limit 구간이
      # 100만을 넘어가서(2026-08-23 실측 −5% 전환점 기준 XRP ≈ 293만, SOL ≈
      # 532만은 여전히 초과) 그 구간 전체가 구조적으로 카드로 강등됐다. §106차
      # 원칙("per-order 캡 = 자동화 오류 1회의 최대 손실 경계")은 그대로 두고,
      # 운영자가 그 경계를 500만으로 재정의한 것이다. 실질 상한은 여전히 업비트
      # 가용 현금(§144차 트리거 리저브 ~270만 + JIT 입금)이며, 현금이 모자라면
      # deferred_with_condition + 입금 알림이 주문보다 먼저 나간다.
      # §145 당시 불변: min_distance 3% · resting-only(marketable은 카드) ·
      # 태그 스캔 · 손실가드 · 부분체결 금지. §156 later narrows that historical
      # resting-only statement solely for an expanded-mode `take_profit` limit
      # sell with fresh broker cost basis; kr/us caps remain untouched.
      crypto: 5000000
    daily_cap:
      kr: 5000000
      # §71차 (2026-08-14): 800 -> 5000. The §65차 same-value pairing was wrong
      # for US session scale: a 25-proposal trim day totals $4.4-4.8k per
      # account, so the first auto-approved single share (QQQ $741) consumed
      # 92.7% of the cap and demoted every later rung to a human card
      # (measured 2026-08-14 22:35, all rejections daily_cap_exceeded).
      # 5000 covers an observed full trim session (~10% of book/day/account);
      # the $800 per-order cap and per-rung veto cards remain the guardrails.
      us: 20000
      # §145차 (2026-08-23): 5000000 → 10000000. per-order 상향에 비례해서
      # 함께 올린다 — §71차 교훈(일일캡이 주문당캡에 붙어 있으면 첫 자동승인
      # 1건이 캡을 대부분 소진하고 이후 주문이 전부 카드로 강등됨)이 crypto
      # 레인에서 재현되지 않도록 하기 위한 것이며, 일일캡은 승인 레인을
      # 좁히는 장치가 아니라는 §106차 규정을 따른다.
      crypto: 10000000
    # AUTO-APPROVE-EXPAND (§40차) — inputs to the profit-take classification,
    # consumed only when ORDER_PROPOSALS_AUTO_APPROVE_MODE=expanded.
    #
    # breakeven_band_pct: the ±% band around avg_buy_price inside which a sell
    # is treated as a break-even boundary case and must go to a human, whatever
    # the sign of the P&L. §40차 fixes this at 1%.
    breakeven_band_pct: 1
    #
    # round_trip_cost_bps: total both-leg cost (commission + transaction tax +
    # FX spread where applicable), used to net down expected realized P&L
    # before the "> 0" test.
    #
    # These are NOT measured rates. The veto-capable ledgers
    # (review.kis_live_order_ledger, review.live_order_ledger) have no
    # commission/tax columns, so this repo has no realized fee evidence for
    # kis_live or upbit to derive a rate from — only review.toss_live_order_ledger
    # records commission/tax, and toss_live is not veto-capable. Until a measured
    # rate exists these are the CONSERVATIVE MAXIMUM of the rates this repo
    # already declares, so the profit-take test is narrower than reality:
    #   kr     47.4 = 14.7bp x 2 legs (account_routing kis_domestic commission_bps)
    #                 + 18bp sell tax (paper_trading FEE_RATES equity_kr tax_sell)
    #                 vs the 21bp the paper_trading commission alone implies.
    #   us     90.0 = (25bp commission + 20bp fx spread) x 2 legs
    #                 (account_routing kis_overseas) vs 14bp from paper_trading.
    #   crypto 10.0 = 5bp x 2 legs (paper_trading FEE_RATES crypto).
    # auto_approve.py enforces the same values as a floor, so lowering a number
    # here cannot widen auto-approval — only raising one has any effect.
    round_trip_cost_bps:
      kr: 47.4
      us: 90
      crypto: 10

# Raw-sector -> cluster grouping for the concentration advisory. A member matches a
# symbol's symbol_sectors label (name_kr / name_en / source_key) when the member
# is a case-insensitive SUBSTRING of the label (one-directional: member ⊂ label),
# so "반도체" matches "반도체와반도체장비" but "의료" does NOT invent a match against
# "의료정밀". List members as specific labels, not broad umbrellas. Best-effort;
# unmapped => fail-open.
sector_clusters:
  financials: ["금융", "은행", "증권", "보험", "Financial Services", "Banks", "Insurance"]
  shipbuilding_defense: ["조선", "방산", "항공우주", "Aerospace & Defense"]
  bio: ["제약", "바이오", "Biotechnology", "Drug Manufacturers"]
  semis_memory: ["반도체", "메모리", "Semiconductors", "Semiconductor Equipment & Materials"]

thresholds:
  recovery_gate.min_conditions_met:
    lanes: [buy]
    value: 2
    unit: count
    of: 2
    semantics: min countable recovery-gate conditions to deploy reserve (else support-conditional only)
  portfolio.sector_cluster_cap_pct:
    lanes: [buy, sell]
    value: 10
    unit: percent
    semantics: projected concentration warning per sector cluster (~9-10%); advisory only — must be surfaced and recorded, never a reserve-net admission block or hold reason
  portfolio.max_symbols_per_theme:
    lanes: [buy, discovery]
    value: 2
    unit: count
    semantics: max symbols per theme; theme overlap is a disclosure item, not an auto-reject
      — strong expected-value candidates may be proposed with overlap stated in thesis
      (operator risk direction 2026-07-22; sector concentration is surfaced by portfolio.sector_cluster_cap_pct)
  order.day_expiry_kst:
    lanes: [buy, sell]
    value: "20:00"
    unit: kst_time
    semantics: DAY order expiry; unfilled -> re-place next day
  buy.deep_limit_pct_range:
    lanes: [buy]
    value: [-12, -3]
    unit: percent
    semantics: deep limit distance below current price (pull-back catch, no chasing)
  buy.per_symbol_notional_krw_range:
    lanes: [buy, discovery]
    value: [200000, 400000]
    unit: krw
    semantics: per-symbol order sizing for new entries (policy threshold, not account balance; KR lane only)
  # ROB-956 — US-lane sizing decoupled from KRW/FX (KR range in FX terms
  # priced new US entries out above ~$268/share at FX~1491). USD-denominated;
  # not derived from the KR range.
  buy.per_symbol_notional_usd_range:
    lanes: [buy, discovery]
    value: [150, 450]  # 신규 진입 1차 트란치 밴드
    unit: usd
    # §139차 (2026-08-22): 700 -> 10000. 운영자 문언 그대로 — "입금해둔 게
    # 상한, 덜 거래하려면 출금하겠다". 즉 이 숫자는 더 이상 리스크 상한을
    # 표현하지 않는다. 실질 경계는 두 가지로만 남는다: ① 계좌에 입금된 현금
    # ② per-order 자동승인 캡 USD 1,500(order_proposals.auto_approve
    # .per_order_cap.us) — 이를 넘는 1주는 카드(수동 승인)로 나간다. 10000은
    # BRK.A/NVR급 초고가 오타를 막는 fat-finger 상한으로만 남는다.
    # 반대 증거는 지우지 않고 기록한다(회고 §4-ⓕ-1): 상한 상향은 SNDK
    # (1주 $1,237.92 -> +25.67%, MFE +43.82%)를 통과시켰겠지만 동시에
    # AVGO(1주 $416.05 -> -11.58%)도 통과시켰을 것이다. n=2, 평균 +7.04% —
    # 표본은 승격 근거가 되지 못하며, 이 변경은 실측이 아니라 운영자의
    # 자산배분 권한 행사다.
    one_share_exception:
      enabled: true
      absolute_ceiling_usd: 10000
      max_deep_rungs: 1
    semantics: per-symbol first-tranche sizing for US new entries; advisory (ROB-646 원칙 — 코드 강제 아님)
  sell.loss_guard_min_multiple:
    lanes: [buy, sell]
    value: 1.01
    unit: multiple_of_avg_cost
    semantics: minimum sell price as multiple of average cost (loss guard)
  sell.loss_cut_max_slip:
    lanes: [sell]
    value: 0.02
    unit: fraction
    semantics: >-
      ROB-800 — max downward slip below current price a sanctioned loss_cut
      limit sell may price at (price >= current * (1 - value)). Code-enforced
      band inside a resolved loss_cut context only; fat-finger deep discounts
      stay blocked. Not applied to any other sell path.
  sell.breakeven_near_pct:
    lanes: [sell]
    value: 2
    unit: percent
    semantics: near-breakeven scan band (+/-)
  sell.resistance_near_pct:
    lanes: [sell]
    value: 6
    unit: percent
    semantics: resistance-proximity threshold for PLACE vs WATCH
  sell.rsi_place_min:
    lanes: [sell]
    value: 58
    unit: rsi
    semantics: RSI at/above which PLACE is favored
  sell.upside_place_max_pct:
    lanes: [sell]
    value: 45
    unit: percent
    semantics: honest upside below which PLACE is favored
  sell.watch_rsi_max:
    lanes: [sell]
    value: 52
    unit: rsi
    semantics: RSI below which WATCH (let-it-run) is allowed
  sell.watch_upside_min_pct:
    lanes: [sell]
    value: 50
    unit: percent
    semantics: upside at/above which WATCH (let-it-run) is allowed
  sell.momentum_spike_change_pct_min:
    lanes: [sell]
    value: 10
    unit: percent
    semantics: >-
      D2 advisory threshold for a KR/US equity momentum-spike day or premarket
      session; applicability and evidence requirements are defined by the
      momentum_spike_profit_ladder tier. TRANSITIONAL PATCH: posture-v1
      (ROB-1090) §11 retires the RSI hard gate in favor of continuous signal
      multipliers, so this tier is absorbed after posture shadow completion.
      Parameter status: 측정으로 확정할 가설; frozen at 10 for this policy
      version, not adjustable by a runtime session, and changeable only by an
      operator-reviewed policy PR after measurement
  sell.single_share_profit_pct_min:
    lanes: [sell]
    value: 8
    unit: percent
    semantics: >-
      D5 advisory profit threshold at which a one-share KR/US equity position
      may be reviewed for a full-position resistance exit; never a partial trim.
      posture-v1 (ROB-1090) carries this full-position verdict forward.
      Parameter status: 측정으로 확정할 가설; frozen at 8 for this policy
      version, not adjustable by a runtime session, and changeable only by an
      operator-reviewed policy PR after measurement
  sell.trim_min_expected_net_realized_gain_krw:
    lanes: [sell]
    value: 5000
    unit: krw_equivalent
    semantics: >-
      D7 advisory minimum expected net realized gain after estimated fees and
      taxes for a trim; US gains use the decision snapshot FX rate, and a trim
      below this threshold becomes WATCH instead of inventing a session-local
      gate. posture-v1 (ROB-1090) carries this forward as
      sell.net_realization_floor. Parameter status: 측정으로 확정할 가설;
      frozen at 5000 KRW equivalent for this policy version, not adjustable by
      a runtime session, and changeable only by an operator-reviewed policy PR
      after measurement
  screen.rsi_max:
    lanes: [discovery]
    value: 45
    unit: rsi
    semantics: max RSI for a discovery candidate
  screen.support_within_pct:
    lanes: [discovery]
    value: 8
    unit: percent
    semantics: strong support must be within this distance
  screen.upside_min_pct:
    lanes: [discovery]
    value: 40
    unit: percent
    semantics: minimum honest upside for a candidate

decision_rules:
  # Operator §45/§46. This is a policy/consumer contract only: it neither
  # creates a proposal nor calls a broker. The Q1/Q2/Q3/Q4 literals below are
  # intentionally kept field-for-field, with supporting accounting and
  # prohibition fields making their non-negotiable semantics explicit.
  buy.support_reserve_net:
    lanes: [buy]
    semantics: >-
      Advisory reserve-net tier for candidates that pass every regular discovery
      condition except RSI failure or absence. When
      eligible_only_when_regular_gate_failure is RSI_ONLY, support eligibility
      is evaluated against this tier's own support_strength_min (moderate) and
      independent_support_source_count_min (2), not discovery's strong support
      requirement. Thus RSI failure plus tier-qualified moderate two-family
      support does not count as a support-condition failure when determining
      RSI_ONLY; failure of any other gate, including honest upside,
      support distance, liquidity, or other regular conditions, remains
      ineligible. Existing regular-discovery candidates retain
      buy.deep_limit_pct_range; no candidate may receive both tiers. No runtime
      relaxation is permitted when the candidate set is empty.
    # Q1 — deep-only relaxation gate (literal)
    regular_discovery_precedence: true
    eligible_only_when_regular_gate_failure: RSI_ONLY
    rsi_gate: omitted_for_this_tier_only
    support_strength_min: moderate
    independent_support_source_count_min: 2
    independent_support_source_families: [fib, bb_lower, volume_profile]
    support_within_current_pct_max: 8
    honest_upside_pct_min: 40
    honest_upside_reference: decision_time_current_price
    discount_below_support_pct_range: [5, 10]
    final_limit_distance_from_current_pct_range: [-15, -5]
    order_type: limit
    tif: DAY
    # Q1 supporting anchor contract: tick floor is calculated below support;
    # a final current-price distance outside the inclusive band is excluded,
    # never clamped into it.
    anchor_price_formula: "tick_floor(S × (1-d))"
    final_limit_distance_out_of_range: EXCLUDE
    # Q2 — budget/concurrency (literal)
    all_pending_buy_required_cash_hard_cap_pct: 90
    tier_armed_required_cash_cap_pct: 50
    max_owned_or_open_symbols_per_market: 2
    # §136차 — 심볼 캡은 신규 진입의 분산 상한이다. 기보유 lot에 대한 add는
    # 심볼 수를 늘리지 않으므로 면제(2026-08-21 20:20 회차 실측: 보유 5종>2가
    # A(k) add 전건을 차단 — 캡의 의도가 아니었다).
    owned_symbol_add_exempt_from_symbol_cap: true
    max_active_orders_per_symbol: 1
    max_symbols_per_sector_cluster: 1
    unknown_sector: INELIGIBLE
    auto_submit_notional:
      krw: 200000
      usd: 150
    larger_notional_within_existing_band: HUMAN_APPROVAL_REQUIRED
    daily_auto_cap_includes_all_buy_tiers: true
    cash_reservation:
      net_orderable: fresh_broker_orderable_cash_minus_same_account_currency_pending_required_cash
      pending_required_cash_scope: not_yet_reached_broker
      required_cash_primary: preview_estimated_value_plus_fee
      required_cash_fallback: quantity_times_limit_price
      broker_orderable_unavailable_or_error: FAIL_CLOSED
      cancel_proposal_cash_reservation: KEEP_RESERVED_UNTIL_BROKER_TERMINAL_CONFIRMATION
    # Q3 — confirmed-fill triage (literal). A future consumer may create the
    # approval-gated proposal; this policy never authorizes automatic cancel.
    fill_triage:
      on_first_confirmed_fill: FREEZE_NEW_SUBMITS
      cancellation_mode: PROPOSAL_REQUIRES_APPROVAL
      broker_cancel_confirmation_required_before_releasing_cash: true
      same_session_rearm: false
      unknown_or_ambiguous_order_state: KEEP_RESERVED_AND_BLOCK
      burst_key: [broker_account_id, currency, market_session]
    # Q4 — add-candidate constraints (literal)
    add_candidate:
      r931_review_required: PASS
      r931_review_max_age_days: 7
      policy_table_max_age_hours: 36
      # §136차 검토 결과 k는 유지 — k는 사이징 %가 아니라 평단 개선 목표
      # (새 평단 ≤ 제안가×(1+k)) 파라미터다. k를 키우면 목표가 느슨해져
      # A_limit≤0(살 필요 없음→NO_ORDER)이 되기 쉬워 확대와 정반대로 작동한다.
      k_used: 0.10
      sizing_price: proposed_limit_price
      a_limit_lte_zero: NO_ORDER
      partial_A_limit_fill: FORBIDDEN
      max_add_symbols_per_market: 2
      max_reserve_net_add_fills_per_symbol_per_policy_version: 1
      same_day_rearm_after_fill: false
      crash_day_averaging_exemption: false
    # §Q2 lines 82–87 — allocation order for constrained armed cash. This
    # fixes new-entry precedence before an add can consume the first slot.
    priority_rules:
      allocation_order:
        - dedupe_active_or_resting_same_symbol
        - first_slot_eligible_new_candidate
        - add_secondary_pool_only_after_r931_pass_and_full_a_limit_10
      same_symbol_active_or_resting: DEDUPE_FIRST
      first_slot: ELIGIBLE_NEW_CANDIDATE_FIRST
      add_candidate_rank: SECONDARY_CANDIDATE_POOL
      add_candidate_r931_review_required: PASS
      add_candidate_a_limit_10: FULLY_SATISFIED
      max_add_symbols_per_market: 2
      same_intent_class_sort_order:
        - support_strength_desc
        - independent_support_source_count_desc
        - honest_upside_pct_desc
        - post_fill_sector_increase_asc
        - required_cash_asc
      exact_tie_break: NEW_BEFORE_ADD
    # §Q4 "must not" items 1–8, made machine-checkable as a contract.
    prohibitions:
      no_new_add_or_deep_limit_rung_overlap: true
      aggregate_active_buy_by_beneficial_owner_across_accounts: true
      fresh_cost_basis_quantity_and_A_limit_before_next_day_reissue: true
      partial_A_limit_fill: FORBIDDEN
      candidate_zero_runtime_gate_relaxation: FORBIDDEN
      crash_day_averaging_exemption: false
      cancel_proposal_is_not_broker_cancellation: true
      unconfirmed_cancel_keeps_required_cash_reserved: true
      market_order: FORBIDDEN
      gtc: FORBIDDEN
      multi_rung: FORBIDDEN
      daily_regeneration: REQUIRED
    toss_live_approval: HUMAN_APPROVAL_REQUIRED_UNTIL_VETO_WIRING

  # §104차 — 표준 매수 게이트를 전부 통과한 후보만 사전 계획 래더에
  # 올린다. crash_day에서는 기존 계획을 유지할 뿐이며, 코드 집행은 없다.
  buy.preplanned_support_ladder:
    lanes: [buy]
    semantics: >-
      Advisory only. A preplanned support ladder is retained only for a
      candidate that passes every standard buy gate; it does not relax,
      waive, replace, or bypass any gate.
    enabled: true
    eligibility: standard_buy_gates_pass
    rungs_max: 2
    per_rung_notional_multiplier: 0.5
    crash_day_behavior: keep

  # §127차 (2026-08-21) — 불타기의 유일한 인가 형태. 돌파 추격이 아니라
  # "수익 중 보유분이 상승 후 평단 위에 새로 만든 strong 지지로 눌릴 때"의
  # 지정가 추가매수다. ROB-1031(지지 터치 후 붕괴 60% 병존)이 금지하는 것은
  # 지지 없는 증액이지, 평단 위 fresh 지지의 눌림 수용이 아니다.
  buy.winner_pullback_add:
    lanes: [buy]
    semantics: >-
      Advisory pre-registration (§127차). Adding to a winning position is
      allowed ONLY as a resting LIMIT at a fresh strong support that formed
      ABOVE the position's average cost after the rise, with the limit price
      inside buy.deep_limit_pct_range from the current price. Requires an
      unrealized gain and a re-confirmed thesis at decision time. Never a
      breakout chase and never a market-order momentum add. Max add notional
      is 50% of the existing position's current notional; at most one add
      per symbol per policy-version. Each add records a forecast for
      scoring. Existing approval boundaries (auto-approve caps, cards) and
      sector/theme caps are unchanged and not relaxed.
    tiers:
      - id: winner_pullback_add
        conditions:
          position_unrealized_gain_required: true
          fresh_strong_support_above_avg_cost: true
          limit_within_deep_limit_pct_range: true
          thesis_reconfirmed: true
        action: resting_limit_add_at_support
        sizing: "max 50% of existing position notional; one add per symbol per policy-version; forecast_save required"
    exclusions:
      - breakout_chase
      - market_order_momentum_add

  # §139차 (2026-08-22) — 지수 ETF는 발굴 유니버스의 "동등 후보"다.
  # 회고 §4-ⓔ가 기각한 것은 "N회차 연속 후보 0이면 유휴 현금 X%를 지수
  # ETF에"라는 자산배분 규칙이지 후보 자격이 아니다. 그 규칙을 기각한 근거는
  # 그대로 유효하다 — 같은 창에서 KR 069500 +9.62% / US VOO -0.51%로 부호가
  # 반대였고, 시장을 사후에 골라 적용하면 hindsight이며, KR 계좌는 이미 KR
  # 베타에 과다 노출(45 lot 중 22 lot이 -15% 미만)이라 지수 ETF 추가는 베타
  # 위의 베타다. 그래서 이 티어는 배분을 만들지 않고 "같은 게이트로 경쟁"만
  # 시킨다. ETF에 구조적으로 부재한 게이트는 면제가 아니라 부적용이다.
  buy.index_etf_candidate:
    lanes: [buy, discovery]
    markets: [kr, us]
    semantics: >-
      Advisory (§139차). A broad-market index ETF (KR 069500-class, US
      VOO/IVV-class) enters the discovery universe as an EQUAL candidate. It
      is never a special allocation rule, never an idle-cash fallback, and is
      never promoted because the candidate set came back empty — zero passing
      candidates still means zero orders. Gates that are structurally absent
      for an index ETF (honest_upside, analyst consensus/count) are declared
      NOT APPLICABLE for this instrument class; they are not waived for
      equities and no equity inherits that non-applicability. Every gate an
      ETF can satisfy — RSI, support strength, support distance — applies
      unchanged, at the same thresholds. Sizing is the standard per-market
      new-entry tranche with no ETF-specific multiplier, and the entry
      consumes a normal new-entry slot rather than a reserved one. If another
      candidate ranks higher, the other candidate wins: this tier adds an
      entrant to the ranking, it does not reserve a place in it.
    tiers:
      - id: index_etf_candidate
        conditions:
          instrument_class: broad_market_index_etf
          ranked_against_equities_in_same_pool: true
          slot_reserved_for_etf: false
          promoted_when_candidate_set_empty: false
          idle_cash_allocation_rule: false
          etf_specific_sizing_multiplier: false
          rsi_gate_applies: true
          support_strength_gate_applies: true
          support_distance_gate_applies: true
          honest_upside_gate: not_applicable_structurally_absent
          analyst_gate: not_applicable_structurally_absent
        action: rank_as_equal_new_entry_candidate
        sizing: "standard per-market new-entry tranche (buy.per_symbol_notional_krw_range / buy.per_symbol_notional_usd_range); no ETF-specific multiplier"
    exclusions:
      - leveraged_etf
      - inverse_etf

  # §139차 (2026-08-22) — crypto 보유 메이저 지지선 사전 그물. 사전등록
  # 라이브 티어이며 한시적이다: 2026-09-19 채점으로 존속/폐지가 갈리고,
  # 폐지 조건은 배치 전에 여기 고정돼 있다. 운영자 문언 — "상승장이라면
  # 지지선에 매수 걸면 돈 벌 거잖아". 그것이 가설이기 때문에 채점 게이트가
  # 붙는다. 반대 증거는 지우지 않고 병기한다: ROB-1031 실측 지지 터치 후
  # 붕괴율 60%·D+20 중앙값 음수, 그리고 XRP가 2026-08-22 02:00봉 고가
  # 1,842에서 03:00봉 저가 1,688까지 1시간에 -8.36% 플러시를 냈다 —
  # moderate 지지가 그 속도를 버틴다는 증거는 없다.
  # 신규 코인 발굴 게이트는 이 티어와 무관하며 하나도 완화되지 않는다.
  #
  # 🔴 집행 표면(B1 수리, 2026-08-22): "LIVE" 는 실자금이라는 뜻이지 이 레포에
  # 집행기가 있다는 뜻이 아니다. 이 파일의 모든 티어와 동일하게 advisory 다
  # (authority.scope: judgment_policy_only — §115차/§127차/§129차와 같은 구조).
  # 아래 조건을 읽어 주문을 만들거나 막는 코드는 레포에 없다. 세션이 판단으로
  # 적용하고, 결과 주문에 걸리는 유일한 코드 경계는 서버측 자동승인 게이트다:
  # crypto per-order 자동승인 캡 초과는 자동승인 불가 → 카드(수동 승인)로
  # 내려간다(§139차 당시 100만, §145차 2026-08-23 이후 500만).
  # 그 아래의 30만/90만·(코인,지지레벨)당 1회·급락 중지·forecast 의무는 전부
  # 세션 계약이며 기계 가드가 아니다 — 무시하는 세션을 레포가 멈추지 못한다.
  # 그래서 대응 절이 운영자 레포(auto_trader-operator live/CLAUDE.md)에 있다.
  # "메이저" 역시 기계 판정 대상이 아니다 — 코인 allowlist/classifier 조건은
  # 없고, 기계로 표현된 것은 보유 여부와 이익권뿐이다.
  buy.held_majors_support_net:
    lanes: [buy]
    markets: [crypto]
    semantics: >-
      Pre-registered tier for LIVE funds, time-boxed (§139차; armed
      2026-08-22, scored 2026-09-19). ENFORCEMENT SURFACE — advisory, exactly
      like every other tier in this file (authority.scope:
      judgment_policy_only; same structure as §115차/§127차/§129차): no code
      in this repo reads these conditions to place, size, aggregate, or block
      an order. "LIVE" describes the funds, not an armed executor. The
      session applies the conditions as judgment, and the only code-enforced
      boundary on a resulting order is the server-side auto-approve gate — a
      crypto order above the 5,000,000 KRW per-order cap cannot auto-approve
      and falls back to a manual card (that cap read 1,000,000 KRW when this
      tier was armed; §145차 2026-08-23 raised it, which widens the lane and
      does not narrow this tier's own 300,000/900,000 KRW session caps).
      Everything below that line — the 300,000 KRW per-coin cap, the 900,000 KRW tier total, the
      one-placement-per-(coin, support level) rule, the crash-day suspension,
      and the forecast obligation — is a SESSION CONTRACT, not a machine
      guard; the repo will not stop a session that ignores it, which is why
      the matching clause lives in the operator prompt
      (auto_trader-operator live/CLAUDE.md). "Major" is likewise session
      judgment: this tier carries no coin allowlist or classifier, so held
      and profitable are the only machine-expressed eligibility conditions.
      Eligibility is crypto HOLDINGS ONLY and only while the
      holding's unrealized P&L is positive at decision time — this tier can
      never admit an unheld coin and never averages down a losing lot, so the
      new-coin discovery gate is untouched by it. A resting LIMIT may be
      pre-placed at a support of at least `moderate` strength that is
      confirmed by at least 2 independent source families and sits between
      -12% and -3% of the current price. Sizing is capped at 300,000 KRW per
      coin and 900,000 KRW across the whole tier, at most one placement per
      (coin, support level) per policy version. Orders route through the
      EXISTING auto-approve path — each is far below the crypto per-order cap
      (1,000,000 KRW when §139차 armed this tier, 5,000,000 KRW since §145차),
      so this tier creates no new approval surface and raised no cap itself.
      Crypto orders rest GTC by Upbit convention; DAY is not used here. Every placement records a forecast (touch / fill / D+20 outcome).
      On 2026-09-19 the tier is RETIRED unless the FILLED cohort's D+20
      median is >= 0 AND its lower quartile is > -8%; those two numbers are
      fixed in advance and may not be reinterpreted at scoring time. During a
      crypto crash regime (24h drawdown worse than -10%) no new batch is
      placed — this tier does not carry the preplanned-ladder "keep"
      behaviour.
    tiers:
      - id: held_majors_support_net
        conditions:
          holding_required: true
          unrealized_pnl_pct_min_exclusive: 0
          new_coin_discovery_gate_unchanged: true
          support_strength_min: moderate
          independent_support_source_count_min: 2
          support_distance_from_current_pct_range: [-12, -3]
          order_type: limit
          resting_only: true
          tif: GTC
          auto_approve_path: existing_per_order_cap
          per_order_cap_raised: false
          max_notional_krw_per_coin: 300000
          max_notional_krw_per_tier: 900000
          max_placements_per_coin_per_support_level_per_policy_version: 1
          forecast_save_required: true
          forecast_scored_fields: "touch, fill, d20_outcome"
          # B1 수리 — 이 세 키가 "무엇이 기계로 강제되는가"의 정본이다.
          enforcement_surface: advisory_session_contract
          code_enforced_boundary: crypto_per_order_auto_approve_cap_then_card
          major_classification: session_judgment_no_machine_allowlist
          crash_day_new_batch_suspended: true
          crypto_crash_24h_drawdown_pct_max: -10
          review_date: "2026-09-19"
          retire_unless_filled_cohort_d20_median_pct_min: 0
          retire_unless_filled_cohort_d20_lower_quartile_pct_min_exclusive: -8
        action: pre_place_resting_limit_at_support
        sizing: "<= 300000 KRW per coin; <= 900000 KRW tier total; one placement per (coin, support level) per policy version; forecast_save required per placement"
    exclusions:
      - new_coin_entry
      - unheld_symbol
      - losing_position_averaging_down
      - market_order
      - crash_day_new_batch

  sell.trim_preplace:
    lanes: [sell]
    semantics: >-
      Tiers are evaluated in declared priority order and the first match wins.
      ADVISORY ONLY. de_minimis_trim_watch prevents session-local benefit gates.
      A one-share equity position is assessed for a full exit, never a
      pseudo-partial trim. momentum_spike_profit_ladder exempts only its matched
      spike candidate from the RSI gate and remains profit-zone-only. When
      resistance-near favors PLACE but upside-rich would otherwise allow WATCH,
      resistance proximity can pre-place only a small trim; upside richness
      limits size, not eligibility. sell.breakeven_reserve_trim is an advisory
      pre-guard reserve-trim contract: calculate its guard-and-D7 anchor before
      consumption, and use WATCH only when that anchor cannot be calculated.
      breakeven_extension_ladder is the last-resort fallback for a holding with
      zero fresh named resistance: it is reached only after every named-
      resistance tier has failed to match, never instead of one, and it does not
      remove or weaken the no_resistance_reference exclusion. §142차 (2026-08-23)
      resolves one contradiction between clauses: both breakeven_extension_ladder
      rung 1 and the sell.breakeven_reserve_trim post-max anchor can land exactly
      on the §40차 break-even band edge (average_cost × 1.01), and that band is
      compared inclusively, so such a rung is downgraded to breakeven_band and
      can never be auto-approved. Their EFFECTIVE anchors are therefore the max
      of the tick-ceiled raw anchor and the first valid tick strictly above the
      band edge. This is a versioned bugfix, is not applied retroactively, adds
      no tier, relaxes no threshold, changes no sizing rule, and does not change
      the inclusive band comparison for any other consumer.
    tiers:
      - id: de_minimis_trim_watch
        conditions:
          markets: [kr, us, crypto]
          trim_candidate: true
          expected_net_realized_gain_krw_below_policy_key: sell.trim_min_expected_net_realized_gain_krw
        action: register_watch_instead_of_trim
        sizing: no_preplaced_trim
      # §44차. Parameter status: no new numeric threshold; every value below
      # references an existing operator-reviewed policy key and is not
      # session-adjustable. This is advisory judgment metadata only.
      - id: sell.breakeven_reserve_trim
        conditions:
          markets: [kr, us, crypto]
          lot_pnl_basis: current_price_vs_average_cost
          lot_pnl_pct_min_inclusive_negated_policy_key: sell.breakeven_near_pct
          lot_pre_guard_average_cost_multiple_max_exclusive_policy_key: sell.loss_guard_min_multiple
          anchor_operator: max
          anchor_operands: [average_cost_times_loss_guard, d7_compliant_lowest_price]
          anchor_guard_policy_key: sell.loss_guard_min_multiple
          d7_min_expected_net_realized_gain_krw_policy_key: sell.trim_min_expected_net_realized_gain_krw
          d7_minimum_price_basis: one_share_expected_net_realized_gain_after_estimated_fees_and_taxes
          d7_scope_semantics: one_share_net_realized_gain_not_total_trim
          d7_estimation_limit_semantics: consumer_estimated_fees_and_taxes_required_no_fee_or_tax_model_added_by_this_tier
          post_max_tick_snap_direction: ceil
          # §142차 (2026-08-23) — versioned bugfix, not retroactive. The
          # post-max anchor can resolve to average_cost × loss_guard (when the
          # guard operand wins the max), which is exactly the §40차 break-even
          # band edge; the band comparison is INCLUSIVE, so such a rung is
          # classified breakeven_band and never reaches the auto-approve lane.
          # The effective anchor is therefore pushed to the first valid tick
          # strictly above the band edge — and no further.
          post_max_effective_anchor_operator: max
          post_max_effective_anchor_operands:
            - tick_ceil_post_max_anchor
            - first_valid_tick_strictly_above_average_cost_times_one_plus_breakeven_band
          post_max_effective_anchor_band_policy_key: order_proposals.auto_approve.breakeven_band_pct
          post_max_effective_anchor_reason: section_40_breakeven_band_comparison_is_inclusive
          post_max_effective_anchor_band_comparison_unchanged: true
          post_max_effective_anchor_since_policy_version: "2026-08-23.1"
          post_max_effective_anchor_retroactive: false
          resting_limit_order: true
          time_in_force: DAY
          regeneration: daily_rep
          day_expiry_policy_key: order.day_expiry_kst
          submission_contract: section_40_auto_approve_with_veto
          watch_fallback: anchor_uncomputable_only
          advisory: true
        action: preplace_resting_breakeven_reserve_trim
        sizing: existing_trim_rule
      - id: single_share_full_exit_review
        conditions:
          markets: [kr, us]
          total_quantity_eq: 1
          profit_pct_min_policy_key: sell.single_share_profit_pct_min
          resistance_reference_required: true
          disposition_policy_key: phase25.10_single_share_exit_choice
        action: advise_full_quantity_resistance_exit_or_trailing_verdict
        sizing: full_position
      - id: momentum_spike_profit_ladder
        conditions:
          markets: [kr, us]
          position_quantity_min: 2
          session_change_basis: [regular_day, premarket]
          session_change_pct_min_policy_key: sell.momentum_spike_change_pct_min
          rsi_gate_exempt: true
          required_thesis_evidence: [catalyst_basis, flow_basis]
          resistance_levels_required: [resistance_1, resistance_2]
          average_cost_multiple_min_exclusive: 1.0
          ladder_total_position_pct_max: 33.3333
        action: preplace_resistance_1_2_small_trim_ladder
        sizing: at_most_one_third_position
      - id: rsi_confirmed_resistance
        conditions:
          rsi_min_policy_key: sell.rsi_place_min
          resistance_near_pct_max_policy_key: sell.resistance_near_pct
        action: preplace_small_trim_ladder
        sizing: small_trim_only
      - id: ultra_near_resistance
        conditions:
          rsi_below_policy_key: sell.rsi_place_min
          resistance_near_pct_max: 2
        action: preplace_small_trim_ladder
        sizing: small_trim_only
      - id: watch_zone
        conditions:
          rsi_below_policy_key: sell.rsi_place_min
          resistance_near_pct_min_exclusive: 2
          resistance_near_pct_max_policy_key: sell.resistance_near_pct
        action: register_watch
        sizing: no_preplaced_trim
      # §115차 (ROB-1298, 2026-08-20). 무저항 보유분 익절 그물.
      # 문제: ETH·LINK 가 120일 명명 구조 전체를 상회해 fresh 명명 저항이
      # 0개가 되면 위 저항 기반 티어(single_share_full_exit_review,
      # momentum_spike_profit_ladder, rsi_confirmed_resistance,
      # ultra_near_resistance, watch_zone)가 전부 미매칭이고
      # exclusions.no_resistance_reference 로 떨어진다. 손익분기 돌파 워치가
      # 발화해도 그물을 깔 앵커가 없다 — 강한 랠리 보유일수록 익절 경로가
      # 소멸하는 역설.
      # 해법의 형태: exclusions 에서 no_resistance_reference 를 제거해 저항
      # 티어를 무저항 보유에 흘려보내는 방식은 금지된다(저항 조건이 없는
      # 보유에 저항 임계를 적용하게 되어 의미가 없다). 대신 그 제외 케이스
      # 전용 폴백 티어를 마지막에 하나 둔다. 이 티어는 저항 티어의 폴백이지
      # 대체가 아니다 — fresh 명명 저항이 하나라도 복원되면
      # fresh_named_resistance_count_eq: 0 이 깨져 이 티어는 진입 불가이고
      # 위 저항 티어가 먼저 매칭된다(tie_breaks.tier_priority 참조).
      # Parameter status: 하위 rung 은 기존 sell.loss_guard_min_multiple 을
      # 그대로 인용한 동일 산식이고(평단×1.01), 신규 수량 규칙은 없다
      # (sizing: existing_trim_rule). 손실가드·D7 순실현 하한·자동승인 게이트
      # 키는 하나도 바뀌지 않는다. Advisory judgment metadata only.
      - id: breakeven_extension_ladder
        conditions:
          markets: [kr, us, crypto]
          fresh_named_resistance_count_eq: 0
          matched_exclusion_case: no_resistance_reference
          resistance_tier_fallback_only: true
          lot_pnl_basis: current_price_vs_average_cost
          anchor_basis: average_cost
          anchor_lowest_rung_policy_key: sell.loss_guard_min_multiple
          anchor_average_cost_multiples: [1.01, 1.05, 1.10]
          rungs_max: 3
          tick_snap_direction: ceil
          tick_grid: market_native_sell_side_tick_grid
          # §142차 (2026-08-23) — versioned bugfix, not retroactive. Rung 1 is
          # average_cost × 1.01, which IS the §40차 break-even band edge
          # (breakeven_band_pct = 1). classify_sell_profit compares inclusively
          # (|distance| <= band), so whenever average_cost × 1.01 already sits
          # on the tick grid the ceil snap is a no-op and rung 1 is downgraded
          # from take_profit to breakeven_band — the §115차 net can never be
          # auto-submitted. Measured: avg 4,000,000 KRW → raw 4,040,000 →
          # ceil no-op → eligible=False reason='breakeven_band'.
          # Rungs 2 and 3 (1.05 / 1.10) sit far outside the band and are
          # untouched; this repair applies to rung 1 only and lifts it by at
          # most one tick above the band edge.
          tier1_effective_anchor_operator: max
          tier1_effective_anchor_operands:
            - tick_ceil_average_cost_times_lowest_multiple
            - first_valid_tick_strictly_above_average_cost_times_one_plus_breakeven_band
          tier1_effective_anchor_band_policy_key: order_proposals.auto_approve.breakeven_band_pct
          tier1_effective_anchor_reason: section_40_breakeven_band_comparison_is_inclusive
          tier1_effective_anchor_band_comparison_unchanged: true
          tier1_effective_anchor_scope: lowest_rung_only
          tier1_effective_anchor_since_policy_version: "2026-08-23.1"
          tier1_effective_anchor_retroactive: false
          resting_limit_order: true
          time_in_force: DAY
          regeneration: daily_rep
          day_expiry_policy_key: order.day_expiry_kst
          submission_contract: section_40_auto_approve_with_veto
          watch_fallback: anchor_or_tick_grid_uncomputable_only
          advisory: true
        action: preplace_resting_breakeven_extension_ladder
        sizing: existing_trim_rule
    tie_breaks:
      tier_priority: "de_minimis_trim_watch > sell.breakeven_reserve_trim > single_share_full_exit_review > momentum_spike_profit_ladder > rsi_confirmed_resistance > ultra_near_resistance > watch_zone > breakeven_extension_ladder"
      multiple_tiers_matched: first_matching_tier_wins
      sell.upside_place_max_pct: size_limit_only
      momentum_spike_rsi_exception: matched_tier_only
      momentum_spike_profit_zone: average_cost_multiple_strictly_above_1
      momentum_spike_integer_rounding: floor_without_exceeding_one_third_or_watch
      single_share_disposition: full_static_target_or_full_trailing_verdict_never_partial
      minimum_benefit_boundary: at_or_above_threshold_may_trim_below_threshold_watch
      breakeven_extension_fallback_order: named_resistance_tiers_first_extension_ladder_only_when_zero_fresh_named_resistance
      breakeven_extension_exclusion_retained: no_resistance_reference_stays_in_exclusions_dedicated_tier_not_exclusion_removal
      breakeven_extension_minimum_benefit: de_minimis_trim_watch_still_preempts
    exclusions:
      - no_resistance_reference
      - composite_gates
  sell.single_share_exit:
    lanes: [sell]
    semantics: >-
      DEPRECATED AS THE GENERAL SINGLE-SHARE EXCLUSION/FALLBACK. Retained without
      key deletion or activation change for historical KR KIS+Toss shadow and
      replay evidence only. The replacement advisory path is
      sell.trim_preplace.single_share_full_exit_review, with disposition by
      phase25.10_single_share_exit_choice. This shadow rule cannot narrow that
      general advisory eligibility and cannot create, approve, or execute a
      proposal while proposal_enabled is false. A loss state remains ineligible
      here and belongs exclusively to the existing loss_cut path.
    activation_state: shadow
    proposal_enabled: false
    scope:
      markets: [kr]
      brokers: [kis, toss]
      required_broker_inventory: [kis, toss]
      order_routable_required: true
    conditions:
      symbol_routable_sellable_quantity_eq: 1
      # Provisional: aligned with sell.single_share_profit_pct_min (D5) so this
      # fallback closes only the single-share sizing gap.
      profit_pct_min: 8
      resistance_reference_required: true
      resistance_strength_min: strong
      # Provisional ROB-1037-aligned far lane. The 6% boundary is exclusive;
      # a resistance exactly at +6% remains outside this path.
      resistance_distance_pct_min_exclusive: 6
      resistance_distance_pct_max: 15
      resistance_source_family_min: 2
      resistance_source_families:
        volume_profile_exact: [poc, vah, val, volume_poc, volume_value_area_high, volume_value_area_low]
        fibonacci_prefixes: [fib]
        bollinger_prefixes: [bb_, bollinger]
      # Every evidence class has its own wall-clock age bound, and all endpoints
      # (including captured_at) must also fit one pairwise-bounded snapshot.
      quote_max_age_seconds: 300
      resistance_max_age_seconds: 300
      holdings_max_age_seconds: 300
      open_orders_max_age_seconds: 300
      open_actions_max_age_seconds: 300
      captured_at_max_age_seconds: 300
      snapshot_max_skew_seconds: 300
      required_completed_bar_market: XKRX
      min_sell_price_multiple_policy_key: sell.loss_guard_min_multiple
      same_symbol_open_orders_max: 0
      unresolved_open_actions_max: 0
      loss_state_uses_existing_path: loss_cut_only
    proposal:
      action: full_exit_at_far_resistance
      sizing: full_account_lot_exit
      approval: telegram_manual
      auto_approve: false
      execution: proposal_only
    threshold_status: provisional
    operator_approval_required: true
    recalibration_note: >-
      Fable governance advisory Q3-#4 Phase 1 seed; follow-up sell-policy
      research must recalibrate this initial threshold. Deprecated as a general
      fallback by D5 on 2026-07-27 and retained only for the existing KR
      far-resistance shadow/replay cohort. General one-share advisory eligibility
      is replaced by
      sell.trim_preplace.single_share_full_exit_review and its 8% threshold
      sell.single_share_profit_pct_min; phase25.10_single_share_exit_choice owns
      the full-static-target versus full-trailing verdict. Shadow evidence must
      still be adversarially validated before proposal_enabled can be considered
      separately by the operator.

  # GPT Pro trading retrospective Phase 2.5 (received 2026-07-25).
  # Rules 01-09 and 11-14 were removed 2026-08-08 by operator decision:
  # unvalidated advisory drift (hypotheses never confirmed by measurement).
  # Rule 10 is retained because it owns the disposition verdict for the
  # operator-confirmed D5 single-share tier (disposition_policy_key).
  phase25.10_single_share_exit_choice:
    lanes: [sell]
    semantics: >-
      ADVISORY ONLY. An equity position of exactly one share cannot use a
      pseudo-partial exit: choose a full static target or a full trailing
      verdict. This rule owns disposition after
      sell.trim_preplace.single_share_full_exit_review includes the position in
      the funnel. At or above sell.single_share_profit_pct_min, a full-position
      resistance exit may be preplaced or proposed; this does not force an exit.
      Crypto is excluded because the recommendation is share-specific. Existing
      loss-cut and approval guards remain unchanged.
    tiers:
      - id: one_share_profitable_resistance_exit
        conditions:
          markets: [kr, us]
          total_quantity_eq: 1
          profit_pct_min_policy_key: sell.single_share_profit_pct_min
          resistance_reference_required: true
        action: advise_full_quantity_resistance_exit_or_proposal
        sizing: full_position
      - id: one_share_hard_exit
        conditions:
          markets: [kr, us]
          total_quantity_eq: 1
          level_role: HARD_EXIT
        action: advise_full_quantity_resting_sell
        sizing: full_position
      - id: one_share_conditional_exit
        conditions:
          markets: [kr, us]
          total_quantity_eq: 1
          level_role: CONDITIONAL_EXIT
        action: advise_watch_then_full_exit_verdict
        sizing: full_position
      - id: one_share_open_ended_trend
        conditions:
          markets: [kr, us]
          total_quantity_eq: 1
          trend: open_ended
        action: advise_full_quantity_trailing_verdict
        sizing: full_position
      - id: target_and_floor_collision
        conditions:
          markets: [kr, us]
          total_quantity_eq: 1
          ordered_steps: [cancel_existing_target_sell, confirm_cancel_terminal, submit_full_exit_proposal]
        action: prepare_composite_operator_approved_proposal
        sizing: full_position
      - id: multi_share_hybrid_reference
        conditions:
          markets: [kr, us]
          total_quantity_min: 2
          trim_formula: "max(1, floor(total_qty * 0.5))"
          first_hard_exit_trim_pct_range: [33, 50]
        action: advise_static_trim_then_trail_remainder
        sizing: reserved_quantity_without_overlap
    tie_breaks:
      profitable_resistance_priority: full_exit_review_before_role_or_trail_choice
      one_share_choice: hard_target_or_trail_not_both
      collision_sequence: cancel_terminal_before_replacement_submit
    exclusions: [crypto_fractional_quantity, loss_state_uses_existing_loss_cut_path]

