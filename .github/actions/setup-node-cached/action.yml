name: Set up pinned Node.js with npm cache
description: >-
  Installs the exact Node.js version pinned below. The toolchain directory for
  that exact version is restored from and saved to the runner tool cache before
  actions/setup-node runs, so a warm run skips the download. On a miss,
  setup-node runs up to three times with backoff. The npm cache stays on.
  Callers check out the repository first. Pin lives only in this file; see
  docs/runbooks/ci-required-aggregator.md "Toolchain cache".
inputs:
  node-version:
    description: Exact Node.js version (x.y.z) on the 22 line. Bump here only.
    default: "22.23.4"
  cache-dependency-path:
    description: Lockfile whose hash keys the npm cache.
    required: true
runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
      run: |
        set -euo pipefail
        if ! [[ "$NODE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "setup-node-cached: version must be exact x.y.z (got '$NODE_VERSION')" >&2
          exit 1
        fi
        arch=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
        echo "node-dir=$RUNNER_TOOL_CACHE/node/$NODE_VERSION/$arch" >> "$GITHUB_OUTPUT"

    - id: node-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.paths.outputs.node-dir }}
        key: node-toolcache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}

    - id: setup-node-1
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      continue-on-error: true
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Back off before setup-node attempt 2
      if: steps.setup-node-1.outcome == 'failure'
      shell: bash
      run: |
        echo "setup-node attempt 1 failed; retrying in 30s" >&2
        sleep 30

    - id: setup-node-2
      if: steps.setup-node-1.outcome == 'failure'
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      continue-on-error: true
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Back off before setup-node attempt 3
      if: steps.setup-node-1.outcome == 'failure' && steps.setup-node-2.outcome == 'failure'
      shell: bash
      run: |
        echo "setup-node attempt 2 failed; retrying in 90s" >&2
        sleep 90

    - id: setup-node-3
      if: steps.setup-node-1.outcome == 'failure' && steps.setup-node-2.outcome == 'failure'
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Confirm the pinned Node.js
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
      run: |
        set -euo pipefail
        actual=$(node --version)
        if [ "$actual" != "v$NODE_VERSION" ]; then
          echo "setup-node-cached: expected v$NODE_VERSION, got $actual" >&2
          exit 1
        fi
