name: Build GHCR images (legacy Docker deploy disabled)

on:
  # Automatic builds wait for the Test workflow of the exact main push SHA.
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_unverified:
        description: "Break-glass: build even if CI gate fails. Non-empty reason is logged; empty means gate enforced."
        required: false
        type: string
        default: ""
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_METADATA_SHORT_SHA_LENGTH: 7

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Only trusted main pushes enter the automatic build; the gate judges the six full-suite jobs.
    # hk 2939: a Test run cancelled by a newer main push is superseded, not a verdict
    # on its SHA, so the automatic build skips it (the job is skipped, not failed).
    # Deploying such a SHA needs `gh workflow run test.yml --ref <sha>` first; the
    # exact-SHA gate below is unchanged. Dispatch and release never read this field.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      short: ${{ steps.sha.outputs.short }}
      # hk 3445: the deploy tier checks exactly this pushed digest (one matrix leg).
      digest: ${{ steps.build.outputs.digest }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: ./Dockerfile.api
            suffix: ""

    steps:
      - name: Resolve build SHA
        id: sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            sha="$WORKFLOW_RUN_SHA"
          else
            sha="$EVENT_SHA"
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Refusing to build: '$sha' is not a full 40-hex commit SHA"
            exit 78
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false

      - name: Verify CI gate for exact SHA
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ steps.sha.outputs.sha }}
          ALLOW_UNVERIFIED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unverified || '' }}
        run: |
          set -euo pipefail
          args=(--sha "$BUILD_SHA" --repo "$GITHUB_REPOSITORY")
          if [ -n "$ALLOW_UNVERIFIED" ]; then
            args+=(--allow-unverified "$ALLOW_UNVERIFIED")
          fi
          python3 scripts/deploy_ci_gate.py "${args[@]}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Verify Dockerfile exists
        run: |
          echo "Checking for Dockerfile: ${{ matrix.dockerfile }}"
          ls -la ${{ matrix.dockerfile }}
          echo "Context files:"
          ls -la .

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
          # Moving tags are promoted together only after this SHA image exists.
          flavor: latest=false
          # workflow_run runs in default-branch context, so ref/sha/default-branch
          # defaults would describe the branch tip, not the gated SHA: tag explicitly.
          tags: |
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=raw,value=production,enable=${{ startsWith(github.ref, 'refs/heads/production') }}
          labels: |
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}

      - name: Build and push ${{ matrix.image }} Docker image
        id: build
        timeout-minutes: 30
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            VCS_REF=${{ steps.sha.outputs.sha }}
            GITHUB_SHA=${{ steps.sha.outputs.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build cache lives in GHCR (`:buildcache` tag of the image repository), never in
          # the 10GB Actions cache: image layers there LRU-evict the toolchain caches (hk 3578).
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          platforms: linux/amd64,linux/arm64
          provenance: false

      - name: Legacy deploy disabled notice
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Legacy Docker deploy disabled

          This workflow only builds/pushes GHCR images. ROB-263 retired the
          Raspberry Pi Docker production deploy path that used the old Pi SSH
          deployment secret and `scripts/deploy.sh`.

          Production deployment is operator-run on NCP with:
          - `scripts/deploy-ncp-pull.sh`
          - `docs/runbooks/ncp-pull-deploy.md`
          EOF

      - name: Build Summary
        if: always()
        run: |
          {
            echo "## Build Summary for ${{ matrix.image }}"
            echo "- **Image**: ${{ matrix.image }}"
            echo "- **Dockerfile**: ${{ matrix.dockerfile }}"
            echo "- **Status**: ${{ job.status }}"
            if [ "${{ steps.build.outcome }}" = "success" ]; then
              echo "- **Image pushed**: ✅"
              echo "- **Tags**: ${{ steps.meta.outputs.tags }}"
            else
              echo "- **Image pushed**: ❌"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Queued moving-tag promotions may be superseded by GitHub concurrency.
  # SHA image builds above are outside this group and cannot be dropped by it.
  promote-moving-tags:
    needs: build-and-push
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            suffix: ""
    concurrency:
      group: ghcr-${{ github.repository }}-${{ matrix.image }}-moving-tags
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.build-and-push.outputs.sha }}
          persist-credentials: false

      - name: Verify CI gate for exact SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ needs.build-and-push.outputs.sha }}
          ALLOW_UNVERIFIED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unverified || '' }}
        run: |
          set -euo pipefail
          args=(--sha "$BUILD_SHA" --repo "$GITHUB_REPOSITORY")
          if [ -n "$ALLOW_UNVERIFIED" ]; then
            args+=(--allow-unverified "$ALLOW_UNVERIFIED")
          fi
          python3 scripts/deploy_ci_gate.py "${args[@]}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote current main image
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ needs.build-and-push.outputs.sha }}
          SHORT_SHA: ${{ needs.build-and-push.outputs.short }}
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
        run: |
          set -euo pipefail
          tip="$(gh api --method GET "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$tip" != "$BUILD_SHA" ]; then
            echo "Historical build: SHA image is published; leave main/latest unchanged."
            exit 0
          fi
          docker buildx imagetools create \
            --tag "$IMAGE_REPOSITORY:main" \
            --tag "$IMAGE_REPOSITORY:latest" \
            "$IMAGE_REPOSITORY:sha-$SHORT_SHA"

  # hk 3445: deploy tier (docs/runbooks/ci-required-aggregator.md). Runs only for
  # a main-push Test run that succeeded (a cancelled or red Test run gets none),
  # on the digest pushed above; it never rebuilds. One run per repository, never
  # cancelled (deploy-checks.yml). It publishes `deploy-ok`; nothing reads it yet.
  # A red deploy tier never unpublishes or untags an image, and promote-moving-tags
  # and notify do not wait for it.
  deploy-checks:
    needs: build-and-push
    if: >-
      needs.build-and-push.result == 'success' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: read
      statuses: write
    uses: ./.github/workflows/deploy-checks.yml
    with:
      sha: ${{ needs.build-and-push.outputs.sha }}
      image: ghcr.io/${{ github.repository }}@${{ needs.build-and-push.outputs.digest }}

  notify:
    if: failure()
    needs: [build-and-push, promote-moving-tags]
    runs-on: ubuntu-latest
    steps:
      - name: Discord failure notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"❌ GHCR 이미지 빌드 실패\",
                \"description\": \"**Branch:** \`${{ github.event.workflow_run.head_branch || github.ref_name }}\`\n**Commit:** \`${BUILD_SHA::7}\`\n**Author:** ${{ github.actor }}\n**Image:** GHCR push failed\",
                \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                \"color\": 16711680,
                \"footer\": {\"text\": \"${{ github.repository }}\"},
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" \
            "$DISCORD_WEBHOOK"
