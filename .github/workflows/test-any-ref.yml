name: Test (any ref)

# hk 3487: the any-ref CI that mergewake dispatches (policy.any_ref_workflow) for a
# bisect commit whose push run GitHub cancelled. It runs test.yml, called with that
# exact commit, so the jobs are the push run's jobs. It records the commit and the
# watched check names as an artifact. post-any-ref-status.yml, which runs from the
# DEFAULT branch, reads that artifact and posts the commit statuses.
#
# This workflow holds no statuses permission. Whatever branch dispatches it, the code
# here is that branch's, so it cannot post statuses. Posting is isolated in
# post-any-ref-status.yml, which GitHub runs from the default branch and which posts
# only for a dispatch from main (see that file).
#
# It is not named `Test`, so deploy.yml's workflow_run (workflows: ["Test"]) and
# scripts/deploy_ci_gate.py (Test runs by file) do not see it. A called workflow
# creates no run of its own; docs/runbooks/ci-required-aggregator.md §any-ref checks that.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-hex commit SHA to test. Must be on main's history.
        required: true
        type: string

permissions:
  contents: read

# One group per dispatch and attempt, not per commit. Keyed by the commit, a second
# dispatch for the same SHA would cancel the first, and the cancelled run's
# post-any-ref-status.yml could then post failures after the newer run's success.
# Each run completes with its own verdicts, as test.yml's dispatch groups do.
concurrency:
  group: test-any-ref-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: true

jobs:
  # First job, first steps: the ref is judged before any checkout, and every other
  # job needs this one. The value reaches the shell only through env, never through
  # `${{ }}` interpolation inside the script.
  validate:
    name: validate ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require an exact 40-hex commit SHA
        env:
          TARGET_SHA: ${{ inputs.ref }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ref must be an exact 40-hex commit SHA"
            exit 1
          fi

      - name: Require the commit to be on main's history
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.ref }}
        run: |
          status="$(gh api "repos/${REPO}/compare/main...${TARGET_SHA}" --jq .status)"
          case "$status" in
            behind|identical) echo "${TARGET_SHA} is on main's history" ;;
            *)
              echo "${TARGET_SHA} is not on main's history (compare status: ${status})"
              exit 1
              ;;
          esac

  # The full push-run definition, called with the exact commit. Its jobs keep their
  # names (`suite / lint`, `suite / test (3.13, 1)`, ...) and its `if:` conditions,
  # so a dispatch runs what a push to main runs. Secrets are inherited for the same
  # reason: a push run gets them too.
  suite:
    name: suite
    needs: validate
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit

  # Runs after the suite whatever its result. It writes what post-any-ref-status.yml
  # needs: the commit, and the watched check names it must publish. It is not a
  # watched check, and it posts nothing.
  record:
    name: record any-ref target
    needs: validate
    if: ${{ always() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Write the commit and the expected check names
        env:
          TARGET_SHA: ${{ inputs.ref }}
        run: |
          mkdir -p any-ref-target
          printf '%s\n' "$TARGET_SHA" > any-ref-target/sha.txt
          printf '%s\n' \
            'lint' \
            'taskiq-smoke' \
            'test (3.13, 1)' \
            'test (3.13, 2)' \
            'test (3.13, 3)' \
            'test (3.13, 4)' > any-ref-target/expected-checks.txt
          cat any-ref-target/sha.txt any-ref-target/expected-checks.txt

      - name: Upload the target record
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: any-ref-target
          path: any-ref-target/
          if-no-files-found: error
          retention-days: 7
