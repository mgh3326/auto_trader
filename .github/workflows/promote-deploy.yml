name: Promote deploy tag

# hk 6037: AT pi auto deploy. Moves the `deploy` image tag onto an already built, verified
# main commit; the pi's follow timer (deploy/shiftgate/pi/follow.sh) installs whatever digest
# the tag carries after re-verifying it on its own. No inbound path to the pi: Actions never
# connects to it.
#
# Called by deploy.yml (`workflow_call`) after a successful main-push build, and runnable by an
# operator (`workflow_dispatch`, ref main) to promote a commit that was held for approval.
#
# What it does (all logic lives in scripts/ci/promote_deploy.py; this file is glue):
#   1. scripts/deploy_ci_gate.py: the SHA is main or an ancestor of main, its six full-suite
#      Test jobs are green, and the `sha-<7>` image carries exactly that SHA.
#   2. Reviews deployed..candidate with the repo's `deploy_approval` policy at the deployed
#      commit (mergewake's rule) and always holds new migrations. A hold writes the reasons and
#      the re-dispatch command to the job summary and moves nothing.
#   3. `docker buildx imagetools create` puts `deploy` on the same digest (no rebuild).
# The tooling that judges (promote_deploy.py, deploy_ci_gate.py) runs from main's checkout, never
# from the candidate's tree; a range that edits that tooling is held for a human.
# `approval_ref` (the hk decision key) waives step 2's hold only, never step 1, and only in the
# `promote-approved` job, which runs in the `at-deploy-approval` GitHub Environment: its required
# reviewers are the human approval (create it with reviewers before the first approved promote).
# Runbook: docs/runbooks/pi-shiftgate-deploy.md "자동 배포 (follow)".

on:
  workflow_call:
    inputs:
      sha:
        description: "Full 40-hex SHA of the built main commit."
        required: true
        type: string
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false
  workflow_dispatch:
    inputs:
      promote_sha:
        description: "Full 40-hex SHA to promote (its sha-<7> image must already exist)."
        required: true
        type: string
      approval_ref:
        description: "hk decision key that approved the held range. Empty = no approval."
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  promote:
    runs-on: ubuntu-latest
    # Dispatch only from main: the workflow file that decides what is promoted is main's.
    if: >-
      inputs.approval_ref == '' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    # Never cancelled: a release that was built must still be judged. GitHub keeps only the
    # newest pending run per group; a newer main commit contains the older one's changes.
    concurrency:
      group: at-pi-deploy-promote-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Resolve SHA
        id: sha
        env:
          CALL_SHA: ${{ inputs.sha }}
          DISPATCH_SHA: ${{ inputs.promote_sha }}
        run: |
          set -euo pipefail
          sha="${CALL_SHA:-$DISPATCH_SHA}"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Refusing to promote: '$sha' is not a full 40-hex commit SHA"
            exit 78
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The judging tooling comes from the TRUSTED ref: github.sha is main's HEAD for both the
      # workflow_run-triggered call and a main dispatch. The candidate is only `--sha` below; its
      # own tree is never executed here. Full history so the candidate and the deployed commit
      # are both present for the range review.
      - name: Checkout the trusted ref (main)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify, review the range and move the deploy tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTE_SHA: ${{ steps.sha.outputs.sha }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          python3 scripts/ci/promote_deploy.py promote \
            --sha "$PROMOTE_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --repo-root .

  promote-approved:
    runs-on: ubuntu-latest
    # Dispatch only from main: the workflow file that decides what is promoted is main's.
    if: >-
      inputs.approval_ref != '' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    # The approval is enforced by GitHub, not by a string: this Environment must be configured with
    # required reviewers (a human). The script refuses an approval_ref outside this job.
    environment: at-deploy-approval
    # Its own group, per candidate SHA: GitHub keeps only the newest pending run of a group, so
    # sharing the automatic promote's group let the next main push silently cancel a pending
    # approval. Never cancelled. promote_deploy.py re-reads the tag right before moving it and
    # refuses if another promote moved it meanwhile.
    concurrency:
      group: at-pi-deploy-promote-approved-${{ github.repository }}-${{ inputs.promote_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Resolve SHA
        id: sha
        env:
          CALL_SHA: ${{ inputs.sha }}
          DISPATCH_SHA: ${{ inputs.promote_sha }}
        run: |
          set -euo pipefail
          sha="${CALL_SHA:-$DISPATCH_SHA}"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Refusing to promote: '$sha' is not a full 40-hex commit SHA"
            exit 78
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The judging tooling comes from the TRUSTED ref: github.sha is main's HEAD for both the
      # workflow_run-triggered call and a main dispatch. The candidate is only `--sha` below; its
      # own tree is never executed here. Full history so the candidate and the deployed commit
      # are both present for the range review.
      - name: Checkout the trusted ref (main)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify, review the range and move the deploy tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTE_SHA: ${{ steps.sha.outputs.sha }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          python3 scripts/ci/promote_deploy.py promote \
            --sha "$PROMOTE_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --repo-root . \
            --approval-ref "$APPROVAL_REF" \
            --approval-gated
