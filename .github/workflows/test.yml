name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch protection snapshot (verified 2026-07-28): only lint,
  # taskiq-smoke, and test (3.13, 1..4) are required checks. The
  # report-only security job and both research jobs remain diagnostic,
  # non-required checks; this workflow does not change protection policy.
  lint:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.13"

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: pip install uv

    - name: Load cached venv
      id: cached-uv-dependencies
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync --group dev

    - name: Run Ruff linter
      run: uv run ruff check app/ tests/ research/ scripts/

    - name: Run Ruff formatter check
      run: uv run ruff format --check app/ tests/ research/ scripts/

    - name: Run ty
      run: uv run ty check app/ --error-on-warning

    - name: Run duration merge unit tests
      run: uv run pytest scripts/merge_test_durations_test.py -q

    - name: Run call-duration freshness unit tests
      run: uv run pytest scripts/call_durations_test.py -q

  # Exact-head source-ownership fence for the fencefix PR itself (ROB-1262
  # follow-up). Evaluates only this PR's actual base/head change set from
  # the GitHub event — never a fixed historical SHA vs. an advancing branch
  # — and hard-fails (never skips) on any git resolution/diff failure. See
  # scripts/ci/write_fence_check.py. Diagnostic/non-required for now, same
  # as security/research jobs; branch protection policy is unchanged.
  #
  # 🔴 The --allow list below is specific to THIS branch's own change set
  # (test file + this script + this workflow edit). It is intentionally
  # gated to only that source branch so that, once merged, it goes dormant
  # instead of becoming a permanent 3-file allow-list blocking every future
  # PR. A durable, general-purpose write-fence job (per-job/per-lane allow
  # lists) is a separate, later piece of work — out of scope here.
  write-fence-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/j3a-write-fence-test'
    steps:
    - uses: actions/checkout@v5
      with:
        # Full history: the base commit this fence diffs against must always
        # be locally resolvable without depending on the script's best-effort
        # runtime fetch fallback.
        fetch-depth: 0

    - name: Run write-fence check
      env:
        FENCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        FENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        python3 scripts/ci/write_fence_check.py \
          --allow tests/services/mock_integration/test_coordination.py \
          --allow scripts/ci/write_fence_check.py \
          --allow .github/workflows/test.yml \
          --json-out write-fence-report.json

    - name: Upload write-fence report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: write-fence-report
        path: write-fence-report.json
        if-no-files-found: warn

  # ROB-1294 (R2B) — SHADOW ONLY. Classifies this run's change set into
  # resource lanes and publishes the verdict as job outputs + an artifact.
  # Nothing consumes those outputs to skip a job in this PR; the six
  # branch-protection-required checks (lint, taskiq-smoke, test (3.13, 1..4))
  # run exactly as before. See docs/runbooks/ci-required-aggregator.md.
  #
  # Fail-closed: an unknown path, a rename/copy/delete, any shared CI/config
  # /test-infrastructure file, an empty change set, or an absent base SHA all
  # yield run_all=true; an unresolvable supplied SHA, a git failure, or a
  # malformed diff record turn this job RED instead of narrowing coverage.
  change-classifier:
    name: change-classifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      result: ${{ steps.classify.outputs.result }}
      run_all: ${{ steps.classify.outputs.run_all }}
      reason: ${{ steps.classify.outputs.reason }}
      lanes: ${{ steps.classify.outputs.lanes }}
      jobs: ${{ steps.classify.outputs.jobs }}
    steps:
    - uses: actions/checkout@v5
      with:
        # Full history: the base commit must be locally resolvable. A shallow
        # checkout that hides it is a hard failure in the classifier, not a
        # reason to fall back to a narrower run.
        fetch-depth: 0
        persist-credentials: false

    - name: Classify changed paths (shadow)
      id: classify
      env:
        CLASSIFY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        CLASSIFY_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      # stdlib-only: no uv sync, no dependency install.
      run: |
        python3 scripts/ci/classify_changes.py \
          --github-output \
          --summary \
          --json-out change-classification.json

    - name: Upload change classification
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: change-classification
        path: change-classification.json
        if-no-files-found: warn

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.13"]
        # ROB-1312: each matrix shard runs the fixed, committed file list in
        # ci_shards/shard-<group>.txt instead of a runtime pytest-split
        # `--splits/--group` selection. The four manifests are a deterministic
        # LPT bin-packing over .call_durations.json weights (regenerate via
        # `python3 -m scripts.ci.file_shard_plan generate`, see
        # docs/runbooks/ci-file-shard-manifests.md). Exact-cover (every
        # non-live collected test file in exactly one manifest, none stale) is
        # validated once per run in the taskiq-smoke job, not redundantly
        # here -- a full-suite collect-only in all four jobs would defeat the
        # point of removing duplicate full-suite collection.
        group: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        # ROB-1293 R1: GitHub-managed Redis service replaces the flaky host
        # apt install. The ROB-892 gate-acceptance fixture still tries a
        # disposable `redis-server` binary first (absent on ubuntu-latest, so
        # this service is what it actually resolves to via
        # ROB892_TEST_REDIS_URL / the localhost:6379/15 default) and fails
        # loudly, never skips, if neither is reachable.
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 127.0.0.1:6379:6379

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install UV
      run: pip install uv

    - name: Load cached venv
      id: cached-uv-dependencies
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync --group test
    
    - name: Wait for PostgreSQL to be ready
      run: |
        for i in {1..30}; do
          if pg_isready -h localhost -p 5432 -U postgres -d test_db; then
            echo "PostgreSQL is ready!"
            exit 0
          fi
          echo "Waiting for PostgreSQL... ($i/30)"
          sleep 1
        done
        echo "PostgreSQL failed to start"
        exit 1

    - name: Set environment variables from env.example
      run: |
        chmod +x scripts/setup-test-env.sh
        bash scripts/setup-test-env.sh

    - name: Verify environment setup
      run: |
        echo "DATABASE_URL is set: ${{ env.DATABASE_URL != '' }}"
        echo "PYTHON_VERSION: ${{ matrix.python-version }}"

    - name: Run tests
      env:
        # Python 3.13 coverage.py sysmon tracing is compatible here because
        # [tool.coverage.run] does not enable branch coverage. If branch=true is
        # added before Python 3.14, coverage falls back to ctrace and CI slows
        # down again.
        COVERAGE_CORE: sysmon
      # --cov-fail-under is intentionally absent: each shard only covers a
      # subset of app/, so a per-shard threshold would fail spuriously.
      # Coverage gating lives in Codecov (uploads from all shards are merged
      # per commit).
      #
      # ROB-1312: file list comes from the committed manifest via `mapfile`
      # (never `$(cat ...)` -- that would word-split on whitespace/globs in
      # a path). A missing/unreadable manifest fails this step immediately
      # (redirection failure under the shell's default `-e`), before `set +e`
      # below takes effect.
      run: |
        mkdir -p .artifacts/socket-guard
        mapfile -t SHARD_FILES < "ci_shards/shard-${{ matrix.group }}.txt"
        set +e
        uv run pytest "${SHARD_FILES[@]}" -m "not live" -n 4 --dist=loadfile -ra --durations=25 --durations-min=1.0 -o faulthandler_timeout=120 --cov=app --cov-report=xml --socket-guard-report ".artifacts/socket-guard/summary-shard${{ matrix.group }}.json" 2>&1 | tee pytest-output.log
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ]; then
          {
            echo "### Pytest failure tail: shard ${{ matrix.group }}"
            echo '```text'
            tail -n 200 pytest-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          message=$(uv run python -c 'from pathlib import Path; lines=Path("pytest-output.log").read_text(errors="replace").splitlines(); keys=("FAILURES","ERRORS","FAILED ","ERROR ","short test summary","Required test coverage","===="); selected=[line for line in lines if any(key in line for key in keys)]; body="\n".join(selected[-40:]+["","--- tail ---"]+lines[-25:]); print(body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')
          echo "::error title=pytest shard failed::$message"
        fi
        exit "$status"

    - name: Upload socket guard evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: socket-guard-evidence-${{ matrix.python-version }}-shard${{ matrix.group }}
        path: .artifacts/socket-guard/summary-shard${{ matrix.group }}.json
        if-no-files-found: error

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        flags: shard${{ matrix.group }}
        disable_search: true

  taskiq-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHON_VERSION: "3.13"

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: pip install uv

    - name: Load cached venv
      id: cached-uv-dependencies
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync --group test

    - name: Run TaskIQ smoke helper regression tests
      run: bash .github/workflows/taskiq-smoke-test.sh

    - name: Set environment variables from env.example
      run: |
        chmod +x scripts/setup-test-env.sh
        bash scripts/setup-test-env.sh

    # ROB-1312: the single, independent full-suite authoritative collection
    # for this run's exact-cover check. Deliberately done exactly once, here,
    # not repeated in each of the four `test` matrix jobs -- doing it four
    # times would defeat the whole point of removing duplicate full-suite
    # collection (fresh-artifact CI timing showed ~68-71s per shard for this
    # step alone). taskiq-smoke is a required check, doesn't already collect
    # the suite, and already has `uv sync --group test` + env setup, so a
    # failure here fails a required check directly -- no new job/name, no
    # branch-protection change, and (unlike a non-required job) it cannot be
    # green-merged past. Collect-only does not touch Postgres/Redis (verified
    # locally without a DB running); output is deliberately NOT deduplicated
    # (`sort`, not `sort -u`) so a genuine duplicate collection is visible to
    # the parser instead of silently erased before it can be caught.
    - name: Record authoritative test collection
      run: |
        set -euo pipefail
        uv run pytest tests/ --collect-only -q --no-cov -m "not live" \
          2>/dev/null | grep '^tests/.*::' | LC_ALL=C sort \
          > authoritative-collected-nodes.txt
        test -s authoritative-collected-nodes.txt

    - name: Validate file-shard manifests (exact-cover)
      run: |
        python3 -m scripts.ci.file_shard_plan check \
          --collected authoritative-collected-nodes.txt \
          --manifest-dir ci_shards \
          --shard-count 4

    - name: Upload authoritative collection manifest
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: authoritative-collected-nodes-pr
        path: authoritative-collected-nodes.txt
        if-no-files-found: warn

    - name: TaskIQ worker smoke test
      run: |
        bash .github/workflows/taskiq-smoke.sh \
          "TaskIQ worker smoke test" \
          "Listening started." \
          taskiq-worker.log \
          -- uv run taskiq worker app.core.taskiq_broker:broker app.tasks

    - name: TaskIQ scheduler smoke test
      run: |
        bash .github/workflows/taskiq-smoke.sh \
          "TaskIQ scheduler smoke test" \
          "Startup completed." \
          taskiq-scheduler.log \
          -- uv run taskiq scheduler app.core.scheduler:sched app.tasks --skip-first-run

    - name: Upload TaskIQ smoke logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: taskiq-smoke-logs-${{ env.PYTHON_VERSION }}
        path: |
          taskiq-worker.log
          taskiq-scheduler.log
        if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.13"

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: pip install uv

    - name: Load cached venv
      id: cached-uv-dependencies
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync --group dev

    # ROB-1158 r2: this step used to end both scanners with `|| true`, and the
    # Safety invocation was additionally malformed — `safety check` rejects
    # `--output safety-report.json` ("not one of 'screen','text','json','bare',
    # 'html'"), exited 2, and wrote no report. The report path is now
    # `--save-json` (stdout carries a deprecation banner, so redirecting it would
    # not produce parseable JSON), and both exit codes are captured and surfaced;
    # `continue-on-error` keeps the job advisory (it is not a required check)
    # without laundering the result into a green tick.
    - name: Run security checks
      id: security-scan
      continue-on-error: true
      run: |
        set -o pipefail
        status=0

        uv run bandit -r app/ -f json -o bandit-report.json || bandit_exit=$?
        bandit_exit=${bandit_exit:-0}
        echo "bandit_exit=${bandit_exit}" >> "$GITHUB_OUTPUT"
        echo "bandit raw exit: ${bandit_exit}"

        uv run safety check --output json --save-json safety-report.json \
          || safety_exit=$?
        safety_exit=${safety_exit:-0}
        echo "safety_exit=${safety_exit}" >> "$GITHUB_OUTPUT"
        echo "safety raw exit: ${safety_exit}"

        {
          echo "### Security scan raw exit codes"
          echo ""
          echo "| scanner | exit |"
          echo "|---|---|"
          echo "| bandit | ${bandit_exit} |"
          echo "| safety | ${safety_exit} |"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "${bandit_exit}" -ne 0 ] || [ "${safety_exit}" -ne 0 ]; then
          echo "::warning::security scanners reported findings (bandit=${bandit_exit} safety=${safety_exit}); see uploaded reports"
          status=1
        fi
        exit "${status}"

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  alpaca-track-fast-tests:
    # H1/H2/H3 are separate pytest invocations because they contain duplicate
    # test module basenames under prepend import mode. They share one job so
    # checkout/Python/uv/dependency setup is paid once instead of three times.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHON_VERSION: "3.13"

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: pip install uv

    - name: Load cached venv
      id: cached-uv-dependencies
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync --group test

    - name: Run H1 data-layer tests
      run: |
        uv run pytest research/alpaca_track/tests/ -q -ra --strict-markers

    - name: Run H2 registry-seal tests
      if: ${{ !cancelled() }}
      run: |
        uv run pytest research/alpaca_track_seal/tests/ -q -ra --strict-markers

    - name: Run H3 signal-engine tests
      if: ${{ !cancelled() }}
      run: |
        uv run pytest research/alpaca_track_signals/tests/ -q -ra --strict-markers

  intraday-harness-v2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHON_VERSION: "3.13"

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: pip install uv

    - name: Load cached venv
      id: cached-uv-dependencies
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync --group test

    - name: Run intraday harness v2 freeze and execution tests
      run: uv run pytest research/intraday_harness_v2/tests/ -v -ra --strict-markers

  kiwoom-dual-surface-smoke:
    # This is an orchestration smoke only: synthetic clients/pool are injected
    # by the test, so it performs zero broker HTTP, account access, or DB write.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHON_VERSION: "3.13"

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: pip install uv

    - name: Load cached venv
      id: cached-uv-dependencies
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync --group test

    - name: Run Kiwoom dual-surface synthetic orchestration smoke
      run: uv run pytest tests/test_kiwoom_dual_surface.py -k 'dual_orchestrator' -v -ra --strict-markers

  alpaca-track-walkforward-tests:
    # ROB-1062 H4 remains a separate gate from the consolidated H1/H2/H3 job:
    # it has its own conftest.py sys.path wiring onto its three
    # producer siblings (research/alpaca_track, research/alpaca_track_seal,
    # research/alpaca_track_signals), network-0, no DB/Redis. The main
    # `test` job's `testpaths` and pytest invocation remain UNCHANGED.
    #
    # Runtime note: this suite includes a handful of `@pytest.mark.slow`
    # tests exercising the full walk-forward runner across all 8 sealed
    # AP-A2 configs on one fold (~1 minute each) -- H3's own engine reloads
    # and re-hashes the entire H2 seal from disk on every decision
    # (NO_THRESHOLD_RELAXATION enforcement H4 does not, and must not,
    # bypass), so this is a genuine, disclosed cost inherited from H3, not
    # an H4 inefficiency. `timeout-minutes` is set higher than the sibling
    # H1/H2/H3 jobs to give this comfortable headroom.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHON_VERSION: "3.13"

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: pip install uv

    - name: Load cached venv
      id: cached-uv-dependencies
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync --group test

    - name: Run ROB-1062 alpaca_track_walkforward H4 walk-forward-runner tests (network-0, no DB/Redis)
      run: |
        uv run pytest research/alpaca_track_walkforward/tests/ -v --strict-markers -ra
        # pytest exits 5 ("no tests collected") on an empty/misconfigured
        # path -- a nonzero exit fails this step, so this job cannot pass
        # silently on zero collected tests.

    - name: Run ROB-1064 alpaca_track_accounting H6 accounting-seal tests (network-0, no DB/Redis)
      if: ${{ !cancelled() }}
      run: |
        uv run pytest research/alpaca_track_accounting/tests/ -v --strict-markers -ra
        # H6 is the fail-closed predecessor of H5. This explicit invocation
        # keeps its 16-config/128-cell accounting boundary from disappearing
        # behind the repository's canonical tests/ discovery root.

  # ROB-1294 (R2B) — fixed-name aggregate over the currently required checks.
  #
  # 🔴 This PR does NOT make `ci-required` a required check and writes no
  # branch-protection setting. Branch protection still names lint,
  # taskiq-smoke and test (3.13, 1..4) directly. The operator-only cutover
  # procedure lives in docs/runbooks/ci-required-aggregator.md.
  #
  # `if: always()` is load-bearing: without it this job is skipped whenever a
  # child fails, and a required check that vanishes on failure is a green
  # merge button. Red on child failure, child cancellation, classifier
  # failure, an absent child result, or any unrecognised result string; only
  # an explicitly `--authorize-skip`ped child may be skipped and still pass.
  ci-required:
    name: ci-required
    if: always()
    needs: [lint, test, taskiq-smoke, change-classifier]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Evaluate required child results
      env:
        # toJSON(needs) -> {"lint": {"result": "success", ...}, ...}. For the
        # matrix `test` job GitHub collapses all four shards into one result,
        # which is failure if any shard failed.
        CI_REQUIRED_NEEDS: ${{ toJSON(needs) }}
      # stdlib-only: no uv sync, no dependency install.
      run: |
        python3 scripts/ci/aggregate_required.py \
          --results-env CI_REQUIRED_NEEDS \
          --required lint \
          --required test \
          --required taskiq-smoke \
          --required change-classifier \
          --summary \
          --json-out ci-required-report.json

    - name: Upload ci-required report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: ci-required-report
        path: ci-required-report.json
        if-no-files-found: warn

  notify:
    if: failure()
    needs: [lint, test, taskiq-smoke, security, alpaca-track-fast-tests, alpaca-track-walkforward-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Discord failure notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"❌ Test CI 실패\",
                \"description\": \"**Branch:** \`${{ github.ref_name }}\`\n**Commit:** \`${GITHUB_SHA::7}\`\n**Author:** ${{ github.actor }}\n**Trigger:** ${{ github.event_name }}\",
                \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                \"color\": 16711680,
                \"footer\": {\"text\": \"${{ github.repository }}\"},
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" \
            "$DISCORD_WEBHOOK"
