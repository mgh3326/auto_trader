name: Refresh test durations

# Weekly deterministic refresh of .test_durations (ROB-963 / ROB-1051).
# Each matrix shard owns a PostgreSQL service; xdist workers are further
# isolated by tests/conftest.py. Shards emit clean JSON maps and refuse
# partial, duplicate, wrong-shard, or gap/stale measurements.
#
# ROB-1295: the same "Measure shard" step also captures call-phase-only
# duration telemetry (tests/_call_duration_plugin.py) into a second,
# additive sidecar artifact (.call_durations.json). This never touches
# .test_durations or pytest-split's own duration-storage machinery — it is a
# separate, stricter-validated freshness record (scripts/call_durations.py)
# built and self-validated in the merge job below.
#
# ROB-1312: shards run the four disjoint, committed
# ci_shards/shard-{1..4}.txt file manifests instead of a runtime
# pytest-split `--splits/--group` selection (`--store-durations`/
# `--durations-path` are unchanged -- .test_durations telemetry is still
# collected, just no longer used to pick which subset a shard runs). Each
# shard's own collected-node capture (`collected-shard-N.txt`) is now scoped
# to only the files that shard ran, so it is a strict subset of the full
# suite, not an identical copy across all four. `collect-authoritative`
# captures the independent, separately-run full-suite reference the merge
# job checks the four (disjoint) shard collections against -- deriving
# "authoritative" from the shards' own union would make a shard that quietly
# under-collects invisible.

on:
  schedule:
    - cron: "10 18 * * 1"
  workflow_dispatch: {}

concurrency:
  group: test-durations-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Verify duration refresh token
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      DURATIONS_REFRESH_TOKEN: ${{ secrets.DURATIONS_REFRESH_TOKEN }}

    steps:
    - name: Require DURATIONS_REFRESH_TOKEN
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${DURATIONS_REFRESH_TOKEN:-}" ]]; then
          echo "::error::DURATIONS_REFRESH_TOKEN is required for the duration refresh auto-PR."
          exit 1
        fi
        echo "DURATIONS_REFRESH_TOKEN is configured."

  collect-authoritative:
    name: Collect authoritative test manifest
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHON_VERSION: "3.13"

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: pip install uv

    - name: Load cached venv
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync --group test

    - name: Set test environment
      run: bash scripts/setup-test-env.sh

    # Independent full-suite ground truth, run once, in parallel with the
    # four `measure` shards (not derived from them). Collect-only does not
    # touch Postgres/Redis, so this job carries no service containers.
    # Output is NOT deduplicated (`sort`, not `sort -u`): a genuine
    # duplicate collection must reach the parser, not be silently erased.
    - name: Record authoritative collection manifest
      run: |
        set -euo pipefail
        uv run pytest tests/ --collect-only -q --no-cov -m "not live" \
          2>/dev/null | grep '^tests/.*::' | LC_ALL=C sort \
          > authoritative-collected-nodes.txt
        test -s authoritative-collected-nodes.txt

    - name: Validate file-shard manifests (exact-cover)
      run: |
        python3 -m scripts.ci.file_shard_plan check \
          --collected authoritative-collected-nodes.txt \
          --manifest-dir ci_shards \
          --shard-count 4

    - name: Upload authoritative manifest
      uses: actions/upload-artifact@v6
      with:
        name: authoritative-collected-nodes
        path: authoritative-collected-nodes.txt
        if-no-files-found: error

  measure:
    name: Measure shard ${{ matrix.group }}/4
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    env:
      PYTHON_VERSION: "3.13"

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        # ROB-1293 R1: see .github/workflows/test.yml for rationale — same
        # GitHub-managed service replacing the host apt install here.
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 127.0.0.1:6379:6379

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: pip install uv

    - name: Load cached venv
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync --group test

    - name: Wait for PostgreSQL
      run: |
        for _ in {1..30}; do
          if pg_isready -h localhost -p 5432 -U postgres -d test_db; then
            exit 0
          fi
          sleep 1
        done
        exit 1

    - name: Set test environment
      run: bash scripts/setup-test-env.sh

    # ROB-1312: scoped to this shard's own committed manifest, not the whole
    # suite -- the four shards' collections are now disjoint subsets, cross-
    # validated against collect-authoritative's independent full-suite
    # capture in the merge job below. Not deduplicated (`sort`, not
    # `sort -u`): a genuine duplicate must reach the parser, not be erased.
    - name: Record shard collection manifest
      run: |
        set -euo pipefail
        mapfile -t SHARD_FILES < "ci_shards/shard-${{ matrix.group }}.txt"
        uv run pytest "${SHARD_FILES[@]}" --collect-only -q --no-cov -m "not live" \
          2>/dev/null | grep '^tests/.*::' | LC_ALL=C sort \
          > "collected-shard-${{ matrix.group }}.txt"
        test -s "collected-shard-${{ matrix.group }}.txt"

    - name: Measure shard
      run: |
        cp .test_durations "durations-shard-${{ matrix.group }}.json"
        mapfile -t SHARD_FILES < "ci_shards/shard-${{ matrix.group }}.txt"
        uv run pytest "${SHARD_FILES[@]}" -q -ra -m "not live" \
          --durations-path "durations-shard-${{ matrix.group }}.json" \
          --store-durations --clean-durations \
          -p tests._call_duration_plugin \
          --call-durations-out "call-durations-shard-${{ matrix.group }}.json" \
          -n 4 --dist=loadfile \
          -o faulthandler_timeout=120

    - name: Upload shard measurements
      uses: actions/upload-artifact@v6
      with:
        name: durations-shard-${{ matrix.group }}
        path: |
          durations-shard-${{ matrix.group }}.json
          call-durations-shard-${{ matrix.group }}.json
          collected-shard-${{ matrix.group }}.txt
        if-no-files-found: error

  merge:
    name: Merge duration shards
    needs: [measure, collect-authoritative]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      before_entries: ${{ steps.diff.outputs.before_entries }}
      after_entries: ${{ steps.diff.outputs.after_entries }}
      call_durations_changed: ${{ steps.call-durations-diff.outputs.changed }}
      ci_shards_changed: ${{ steps.ci-shards-diff.outputs.changed }}
    env:
      PYTHON_VERSION: "3.13"

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Download shard measurements
      uses: actions/download-artifact@v6
      with:
        pattern: durations-shard-*
        path: duration-artifacts
        merge-multiple: true

    - name: Download authoritative collection manifest
      uses: actions/download-artifact@v6
      with:
        name: authoritative-collected-nodes
        path: duration-artifacts

    - name: Merge complete current duration set
      run: |
        python scripts/merge_test_durations.py \
          --baseline .test_durations \
          --shard duration-artifacts/durations-shard-1.json \
          --shard duration-artifacts/durations-shard-2.json \
          --shard duration-artifacts/durations-shard-3.json \
          --shard duration-artifacts/durations-shard-4.json \
          --collected duration-artifacts/collected-shard-1.txt \
          --collected duration-artifacts/collected-shard-2.txt \
          --collected duration-artifacts/collected-shard-3.txt \
          --collected duration-artifacts/collected-shard-4.txt \
          --authoritative duration-artifacts/authoritative-collected-nodes.txt \
          --output .test_durations

    - name: Detect .test_durations changes
      id: diff
      run: |
        if git diff --quiet -- .test_durations; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No .test_durations changes — nothing to PR."
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
          before=$(git show HEAD:.test_durations | grep -c '::' || true)
          after=$(grep -c '::' .test_durations || true)
          echo "before_entries=$before" >> "$GITHUB_OUTPUT"
          echo "after_entries=$after" >> "$GITHUB_OUTPUT"
          echo "Recorded duration entries: $before -> $after"
        fi

    - name: Stage merged duration artifact
      if: steps.diff.outputs.changed == 'true'
      run: cp .test_durations refreshed-test-durations.json

    - name: Upload merged duration artifact
      if: steps.diff.outputs.changed == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: merged-test-durations
        path: refreshed-test-durations.json
        if-no-files-found: error

    - name: Build call-phase duration artifact
      run: |
        python -m scripts.call_durations build \
          --shard duration-artifacts/call-durations-shard-1.json \
          --shard duration-artifacts/call-durations-shard-2.json \
          --shard duration-artifacts/call-durations-shard-3.json \
          --shard duration-artifacts/call-durations-shard-4.json \
          --collected duration-artifacts/collected-shard-1.txt \
          --collected duration-artifacts/collected-shard-2.txt \
          --collected duration-artifacts/collected-shard-3.txt \
          --collected duration-artifacts/collected-shard-4.txt \
          --authoritative duration-artifacts/authoritative-collected-nodes.txt \
          --source-commit-sha "${{ github.sha }}" \
          --output .call_durations.json

    - name: Validate call-phase duration freshness
      # Self-check: the artifact this job just built must itself pass the
      # same fail-closed freshness contract a future PR/consumer would run
      # (ROB-1295). A validate failure here means build_artifact and
      # validate_freshness disagree — treat that as a bug, not driftable.
      # `validate` checks against the single authoritative collection only
      # (ROB-1312) -- unrelated to how the artifact was sharded when built.
      run: |
        python -m scripts.call_durations validate \
          --artifact .call_durations.json \
          --authoritative duration-artifacts/authoritative-collected-nodes.txt \
          --expected-source-sha "${{ github.sha }}"

    - name: Detect .call_durations.json changes
      id: call-durations-diff
      # git status --porcelain (not git diff --quiet) because this file does
      # not exist in the repo yet on its first run: git diff never reports
      # an untracked path as changed, which would silently never open the
      # seeding PR.
      run: |
        if [ -z "$(git status --porcelain -- .call_durations.json)" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No .call_durations.json changes — nothing to PR."
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Stage call-phase duration artifact
      if: steps.call-durations-diff.outputs.changed == 'true'
      run: cp .call_durations.json refreshed-call-durations.json

    - name: Upload call-phase duration artifact
      if: steps.call-durations-diff.outputs.changed == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: merged-call-durations
        path: refreshed-call-durations.json
        if-no-files-found: error

    # ROB-1312: ci_shards/*.txt is a deterministic function of
    # .call_durations.json (weight source) + the current authoritative
    # collection -- if the weekly refresh rebuilt .call_durations.json but
    # never regenerated the manifests from it, LPT balance would silently
    # drift out of sync with reality with no duration-refresh workflow left
    # to correct it (exact-cover would still hold, since file membership is
    # unaffected by weight drift, but the "keep predicted shard weight spread
    # low" intent this planner exists for would quietly rot). Regenerate
    # here from the same freshly-built artifact and authoritative capture
    # against which this job already validated .call_durations.json, so both land in
    # the same refresh PR in lockstep.
    - name: Regenerate file-shard manifests
      run: |
        python3 -m scripts.ci.file_shard_plan generate \
          --call-durations .call_durations.json \
          --collected duration-artifacts/authoritative-collected-nodes.txt \
          --manifest-dir ci_shards \
          --shard-count 4

    - name: Validate regenerated file-shard manifests (exact-cover)
      # Self-check, same rationale as "Validate call-phase duration
      # freshness" above: what this job just wrote must itself pass the
      # same fail-closed check a PR/consumer would run.
      run: |
        python3 -m scripts.ci.file_shard_plan check \
          --collected duration-artifacts/authoritative-collected-nodes.txt \
          --manifest-dir ci_shards \
          --shard-count 4

    - name: Detect ci_shards changes
      id: ci-shards-diff
      # git status --porcelain, matching the .call_durations.json check above
      # -- ci_shards/ is already tracked from ROB-1312's initial landing, but
      # this stays robust even if that were ever not true.
      run: |
        if [ -z "$(git status --porcelain -- ci_shards/)" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No ci_shards/ changes — nothing to PR."
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Stage file-shard manifests
      if: steps.ci-shards-diff.outputs.changed == 'true'
      run: |
        mkdir -p ci-shards-refresh-output
        cp ci_shards/shard-1.txt ci_shards/shard-2.txt ci_shards/shard-3.txt \
          ci_shards/shard-4.txt ci_shards/weights.json ci-shards-refresh-output/

    - name: Upload file-shard manifests
      if: steps.ci-shards-diff.outputs.changed == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: refreshed-ci-shards
        path: ci-shards-refresh-output/
        if-no-files-found: error

  pull-request:
    name: Open duration refresh PR
    needs: merge
    if: needs.merge.outputs.changed == 'true' || needs.merge.outputs.call_durations_changed == 'true' || needs.merge.outputs.ci_shards_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Download merged duration artifact
      if: needs.merge.outputs.changed == 'true'
      uses: actions/download-artifact@v6
      with:
        name: merged-test-durations
        path: duration-refresh-output

    - name: Install merged duration set
      if: needs.merge.outputs.changed == 'true'
      run: cp duration-refresh-output/refreshed-test-durations.json .test_durations

    - name: Download call-phase duration artifact
      if: needs.merge.outputs.call_durations_changed == 'true'
      uses: actions/download-artifact@v6
      with:
        name: merged-call-durations
        path: call-durations-refresh-output

    - name: Install call-phase duration set
      if: needs.merge.outputs.call_durations_changed == 'true'
      run: cp call-durations-refresh-output/refreshed-call-durations.json .call_durations.json

    - name: Download file-shard manifests
      if: needs.merge.outputs.ci_shards_changed == 'true'
      uses: actions/download-artifact@v6
      with:
        name: refreshed-ci-shards
        path: ci-shards-refresh-output

    - name: Install file-shard manifests
      if: needs.merge.outputs.ci_shards_changed == 'true'
      run: |
        mkdir -p ci_shards
        cp ci-shards-refresh-output/shard-1.txt ci-shards-refresh-output/shard-2.txt \
          ci-shards-refresh-output/shard-3.txt ci-shards-refresh-output/shard-4.txt \
          ci-shards-refresh-output/weights.json ci_shards/

    - name: Open auto-PR with refreshed durations
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.DURATIONS_REFRESH_TOKEN }}
        commit-message: "chore(ci): refresh .test_durations, .call_durations.json, and ci_shards manifests"
        add-paths: |
          .test_durations
          .call_durations.json
          ci_shards/shard-1.txt
          ci_shards/shard-2.txt
          ci_shards/shard-3.txt
          ci_shards/shard-4.txt
          ci_shards/weights.json
        branch: ci/test-durations-refresh
        delete-branch: true
        base: main
        title: "chore(ci): refresh .test_durations"
        body: |
          Automated weekly refresh of `.test_durations` (ROB-963 / ROB-1051),
          `.call_durations.json` (ROB-1295), and the `ci_shards/*.txt`
          file-shard manifests (ROB-1312).

          Four shards each measured their own disjoint, committed
          `ci_shards/shard-{1..4}.txt` file manifest using independent
          PostgreSQL services and worker-isolated databases. A fifth job
          (`collect-authoritative`) independently captured the full non-live
          suite as ground truth. The merge rejected
          missing/duplicate/wrong-shard measurements and any shard
          collection not pairwise-disjoint or not an exact union of the
          authoritative collection, dropped stale baseline entries, and
          wrote a deterministic node-id-sorted map. `.test_durations` no
          longer drives runtime shard selection in `test.yml` (that is now
          the committed `ci_shards/*.txt` manifests) — it remains a plain
          telemetry record.

          `.call_durations.json` is a separate, additive call-phase-only
          duration record (excludes setup/teardown/fixture cost) with
          source-commit and collection-hash provenance, built and
          self-validated by `scripts/call_durations.py`. It is also the
          weight source this run's `python3 -m scripts.ci.file_shard_plan
          generate` summed per file to rebuild `ci_shards/shard-{1..4}.txt` +
          `ci_shards/weights.json` from the same fresh measurement and the
          same authoritative capture, self-checked with `... check`
          immediately after. This same run refreshes the shard balance alongside
          the duration data; exact cover is unaffected either way. The workflow
          keeps the *balance*, not just membership correctness, current.

          - recorded `.test_durations` entries: `${{ needs.merge.outputs.before_entries }}` → `${{ needs.merge.outputs.after_entries }}`

          Generated by `.github/workflows/test-durations-refresh.yml`.
