# 미등록 Dagu 사본(hk 6409, 설계 6400 §3.1). 저장소는 이 파일을 등록하지 않으며 등록은 운영자 결정·런북으로만 한다.
# 같은 창의 deploy/dagu/at-batch/at-batch1-dart-1830.yaml 제안과 겹친다. 둘 중 하나만 등록한다.
# 18:30 KST 매일. DART 공시 창 [오늘](KST). 장 마감 뒤 접수분을 다시 읽는다.
# 환경: /root/at-secrets/.env.dagu-at-official-events (AT_OFFICIAL_EVENTS_PING_URL_KR_1830, 선택).
description: "공식 이벤트 KR: DART 공시 18:30 KST (오늘)"
schedule: "CRON_TZ=Asia/Seoul 30 18 * * *"
max_active_runs: 1
hist_retention_days: 60
worker_selector:
  host: pi
dotenv: /root/at-secrets/.env.dagu-at-official-events
steps:
  - name: dart-disclosures
    command: docker run --rm --init --network host --workdir /app --env-file /root/at-secrets/.env.api "$(cat /root/at-run/deployed-digest)" /app/.venv/bin/python -m scripts.ingest_market_events --source dart --category disclosure --market kr --from-date $(TZ=Asia/Seoul date +%F) --to-date $(TZ=Asia/Seoul date +%F)
    timeout_sec: 900
    retry_policy:
      limit: 1
      interval_sec: 60
handler_on:
  success:
    command: 'logger -t at-dagu-official-events "dag=official-events-kr-1830 status=success"; [ -z "${AT_OFFICIAL_EVENTS_PING_URL_KR_1830:-}" ] || curl -fsS -m 10 --retry 3 -o /dev/null "${AT_OFFICIAL_EVENTS_PING_URL_KR_1830}"'
  failure:
    command: 'logger -t at-dagu-official-events "dag=official-events-kr-1830 status=failure"; [ -z "${AT_OFFICIAL_EVENTS_PING_URL_KR_1830:-}" ] || curl -fsS -m 10 --retry 3 -o /dev/null "${AT_OFFICIAL_EVENTS_PING_URL_KR_1830}/fail"'
