# 미등록 Dagu 사본(hk 6409, 설계 6400 §3.1). 저장소는 이 파일을 등록하지 않으며 등록은 운영자 결정·런북으로만 한다.
# 같은 CLI 를 5분 간격으로 부르는 deploy/dagu/at-crypto-notices/ 사본이 있다. 하나만 등록한다(재수집은 멱등).
# 06:30 KST 매일. 유의·주의 상태 스냅숏은 그보다 먼저(06:15 KST) 도는 at-batch2-upbit-symbol-universe 가 만들며
# 이 파일은 그 동기화를 다시 돌리지 않는다. 이 step 은 Upbit·Bithumb 공지를 저장한다(공지 수집기는 날짜 창이 없다).
# 환경: /root/at-secrets/.env.dagu-at-official-events (AT_OFFICIAL_EVENTS_PING_URL_CRYPTO, 선택).
description: "공식 이벤트 crypto: Upbit·Bithumb 공지"
schedule: "CRON_TZ=Asia/Seoul 30 6 * * *"
max_active_runs: 1
hist_retention_days: 60
worker_selector:
  host: pi
dotenv: /root/at-secrets/.env.dagu-at-official-events
steps:
  - name: exchange-notices
    command: docker run --rm --init --network host --workdir /app --env-file /root/at-secrets/.env.api "$(cat /root/at-run/deployed-digest)" /app/.venv/bin/python -m scripts.collect_crypto_notices --commit
    timeout_sec: 300
    retry_policy:
      limit: 1
      interval_sec: 60
handler_on:
  success:
    command: 'logger -t at-dagu-official-events "dag=official-events-crypto status=success"; [ -z "${AT_OFFICIAL_EVENTS_PING_URL_CRYPTO:-}" ] || curl -fsS -m 10 --retry 3 -o /dev/null "${AT_OFFICIAL_EVENTS_PING_URL_CRYPTO}"'
  failure:
    command: 'logger -t at-dagu-official-events "dag=official-events-crypto status=failure"; [ -z "${AT_OFFICIAL_EVENTS_PING_URL_CRYPTO:-}" ] || curl -fsS -m 10 --retry 3 -o /dev/null "${AT_OFFICIAL_EVENTS_PING_URL_CRYPTO}/fail"'
