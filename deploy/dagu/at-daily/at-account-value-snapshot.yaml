# 제안(PROPOSAL, hk 3872) — 어디에도 등록되어 있지 않다.
# registered only via the runbook below: docs/runbooks/account-value-snapshot-daily.md
# (이 파일 복사 → 수동 1회 실행 → 그날 8행 또는 already_present 확인 → 스케줄 유지. 이 순서를 건너뛰지 않는다.)
# 근거: 운영자 결정 hk:doc decision/2026-11-11/factortrail-p1 §5.
#   retro/v1 `retro_scoreboard` 와 이후 holdings reconcile 이 review.account_value_snapshots 를 읽는데,
#   그 표는 scripts/account_value_snapshot.py --commit 이 돌 때만 채워진다(첫 수동 커밋 2026-11-11 06:23 KST, 8행).
#
# 기계가 읽는 줄(tests/scripts/test_dagu_account_value_snapshot_dag.py 가 검사한다):
# dagu_schedule_kst: 07:40 매일
#
# 스케줄은 UTC 로 쓴다. OCI Dagu 서버는 tz Asia/Seoul 로 돌기 때문에 CRON_TZ=UTC 접두를 명시한다
# (배치 DAG 와 같은 규칙, PR #2360). CRON_TZ=UTC 40 22 * * * = 07:40 KST 매일.
# 환경: dotenv 파일에서만 읽는다(이름만 런북에). 값은 이 파일과 레포에 없다.
#   AT_BATCH_PING_URL_ACCOUNT_VALUE_SNAPSHOT (성공/실패 핑 URL, 선택 — 비어 있으면 핑을 건너뛴다)
# 실패 경로: 핑 URL 이 있으면 handler_on 이 healthchecks 핑(성공은 URL, 실패는 URL/fail)을 보낸다.
# 없으면(healthchecks 무료 체크 한도) 핑 없이 Dagu 실행 상태(failed)로만 남는다.
#
# 세 step 은 서로 depends 가 없다 — Dagu 는 의존이 없는 step 을 병렬로 돌린다. 그래서 kis 가
# 실패해도 toss·upbit 는 계속 돈다. continue_on: failure 를 쓰지 않는 이유: Dagu 2.21.0 에서
# continue_on 은 DAG 를 partially_succeeded 로 끝내 *성공* 핸들러를 부르므로, 실패한 계좌가
# 있어도 /fail 핑이 오지 않는다. 의존 없는 병렬은 DAG 를 failed 로 끝내 /fail 핑을 보낸다.
#
# 재시도 1회는 안전하다: capture 는 (account, market, day) ON CONFLICT DO NOTHING 이고 같은 날
# 재실행은 already_present 인 no-op 이다(중복 행 0).
#
# 🔴 성공 핑은 "그날 행이 쓰였다"는 뜻이고 "평가가 완전하다"는 뜻이 아니다. 07:40 KST 에 DB 일봉이
# 아직 없으면 readers._marks 가 가격을 못 찾아 mark_unknown:<심볼> 사유가 붙은 채 행이 커밋되고
# step 은 exit 0 이다(fx 실패도 fx_unknown 으로 같은 경로). 사유는 예외가 아니라 retry 가 돌지
# 않으며, 같은 날 재실행은 ON CONFLICT DO NOTHING 이라 already_present 만 내므로 그날 행은 고칠 수
# 없다. 이 영구 미측정과 핑의 의미는 런북 §알려진 격차에 있다. 스케줄을 일봉 적재 뒤로 옮기는 것은
# 이 제안의 범위 밖이다(07:40 은 운영자 결정 §5 의 값).
description: "PROPOSAL: daily account value snapshot (kis/toss/upbit, DB write)"
schedule: "CRON_TZ=UTC 40 22 * * *"
max_active_runs: 1
hist_retention_days: 60
worker_selector:
  host: ncp
dotenv: /root/at-secrets/.env.dagu-at-batch
steps:
  - name: kis
    command: docker run --rm --network host --workdir /app --env-file /root/at-secrets/.env.api "$(cat /root/at-run/deployed-digest)" /app/.venv/bin/python -m scripts.account_value_snapshot --account kis --commit
    timeout_sec: 600
    retry_policy:
      limit: 1
      interval_sec: 60
  - name: toss
    command: docker run --rm --network host --workdir /app --env-file /root/at-secrets/.env.api "$(cat /root/at-run/deployed-digest)" /app/.venv/bin/python -m scripts.account_value_snapshot --account toss --commit
    timeout_sec: 600
    retry_policy:
      limit: 1
      interval_sec: 60
  - name: upbit
    command: docker run --rm --network host --workdir /app --env-file /root/at-secrets/.env.api "$(cat /root/at-run/deployed-digest)" /app/.venv/bin/python -m scripts.account_value_snapshot --account upbit --commit
    timeout_sec: 600
    retry_policy:
      limit: 1
      interval_sec: 60
handler_on:
  success:
    command: '[ -z "${AT_BATCH_PING_URL_ACCOUNT_VALUE_SNAPSHOT}" ] || curl -fsS -m 10 --retry 3 -o /dev/null "${AT_BATCH_PING_URL_ACCOUNT_VALUE_SNAPSHOT}"'
  failure:
    command: '[ -z "${AT_BATCH_PING_URL_ACCOUNT_VALUE_SNAPSHOT}" ] || curl -fsS -m 10 --retry 3 -o /dev/null "${AT_BATCH_PING_URL_ACCOUNT_VALUE_SNAPSHOT}/fail"'
