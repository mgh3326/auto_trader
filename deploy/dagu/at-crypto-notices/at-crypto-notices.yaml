# 미등록 Dagu 사본. 설치·등록·기동은 이 PR 범위가 아니다.
description: "Upbit·Bithumb 암호화폐 거래소 공지 수집"
schedule:
  - "*/5 * * * *"
max_active_runs: 1
hist_retention_days: 60
worker_selector:
  host: pi
steps:
  - name: collect
    script: |
      rc=0
      docker run --rm --init --network host --workdir /app --env-file /root/at-secrets/.env.api "$(cat /root/at-run/deployed-digest)" /app/.venv/bin/python -m scripts.collect_crypto_notices --commit || rc=$?
      exit "$rc"
    timeout_sec: 300
handler_on:
  success:
    command: 'logger -t at-dagu-crypto-notices "dag=at-crypto-notices status=success"'
  failure:
    command: 'logger -t at-dagu-crypto-notices "dag=at-crypto-notices status=failure"'
