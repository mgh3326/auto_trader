# 제안 복사본(hk 5752). 저장소는 이 파일을 등록하지 않는다. 설계 세션이 dry-run 채움률을 확인한 뒤 호스트에 등록한다(docs/runbooks/snapshot-refresh-dagu.md).
# 시각 근거: KR 일봉(07:30 UTC)과 KR 스크리너(11:25 UTC) 뒤, 21:30 KST(12:30 UTC) 월–금에 돈다. data-plane-kr(09:00 UTC)과 겹치지 않는다.
#   범위는 보유 ∪ 활성 관심 종목이다(--all 없음). 계좌 읽기를 포함하므로 장후 한 번만 돈다.
# commit 게이트: AT_SNAPSHOT_CONSENSUS_KR_COMMIT_ENABLED 가 참일 때만 --commit. 미설정 = dry-run(보유·관심 종목 조회와 컨센서스 호출은 하지만 쓰기는 없다).
# 스케줄은 UTC 로 쓴다(OCI Dagu 스케줄러가 UTC 로 돈다).
# 환경: dotenv 파일에서만 읽는다. 값은 이 파일과 레포에 없다.
# 실패 경로: handler_on 이 journal 한 줄(`logger -t at-dagu-batch`)을 먼저 남기고, 핑 URL 이 있을 때만 healthchecks 핑을 보낸다.
description: "KR analyst consensus snapshots (외부 읽기, DB 쓰기)"
schedule: "CRON_TZ=UTC 30 12 * * 1-5"
max_active_runs: 1
hist_retention_days: 60
worker_selector:
  host: pi
dotenv: /root/at-secrets/.env.dagu-at-batch
steps:
  - name: build
    command: docker run --rm --init --network host --workdir /app --env-file /root/at-secrets/.env.api "$(cat /root/at-run/deployed-digest)" /app/.venv/bin/python -m scripts.build_analyst_consensus_snapshots --market kr --batch-size 100 --concurrency 4 $(case "$(printf %s "${AT_SNAPSHOT_CONSENSUS_KR_COMMIT_ENABLED}" | tr A-Z a-z)" in 1|true|yes|on) echo --commit;; esac)
    timeout_sec: 3600
    retry_policy:
      limit: 1
      interval_sec: 300
handler_on:
  success:
    command: 'logger -t at-dagu-batch "dag=at-snapshot-consensus-kr status=success"; [ -z "${AT_BATCH_PING_URL_SNAPSHOT_CONSENSUS_KR:-}" ] || curl -fsS -m 10 --retry 3 -o /dev/null "${AT_BATCH_PING_URL_SNAPSHOT_CONSENSUS_KR}"'
  failure:
    command: 'logger -t at-dagu-batch "dag=at-snapshot-consensus-kr status=failure"; [ -z "${AT_BATCH_PING_URL_SNAPSHOT_CONSENSUS_KR:-}" ] || curl -fsS -m 10 --retry 3 -o /dev/null "${AT_BATCH_PING_URL_SNAPSHOT_CONSENSUS_KR}/fail"'
