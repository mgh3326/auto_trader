# PROPOSAL for operator approval (ROB-1443) — NOT registered anywhere.
# Copy to the Dagu DAGs directory only after the operator approves it.
#
# Point-in-time data plane, market: crypto.
# Schedule: 00:20 UTC daily, after the 00:00 UTC candle close + 5 min.
# Times are written in UTC because the OCI Dagu scheduler runs in UTC
# (schedule-inventory-1101). Per-DAG time zones were not verified on that
# Dagu version, so none are used.
#
# Every command is research.data_plane.cli (public, unauthenticated sources;
# no database, broker, account or credential). collect is idempotent per day:
# a rerun or a retry writes nothing for partitions that already exist.
# The health steps run even if collect fails, so a failure reaches the ping URL.
#
# Worker host env (set on the worker, never in this file):
#   AUTO_TRADER_DIR       checkout of auto_trader at a reviewed commit
#   DATA_PLANE_ROOT       artifact root outside git
#   DATA_PLANE_PING_CRYPTO_UNIVERSE / _BARS / _ACTIONS   https ping URLs (optional)
description: "PIT data plane (crypto): universe, daily bars, corporate actions + health"
schedule: "20 0 * * *"
max_active_runs: 1
hist_retention_days: 60
worker_selector:
  data-plane: "true"
steps:
  - name: collect
    working_dir: ${AUTO_TRADER_DIR}
    command: uv run python -m research.data_plane.cli collect --root ${DATA_PLANE_ROOT} --market crypto
    timeout_sec: 3600
    retry_policy:
      limit: 2
      interval_sec: 600
    continue_on:
      failure: true
  - name: health-universe
    working_dir: ${AUTO_TRADER_DIR}
    command: uv run python -m research.data_plane.cli health --root ${DATA_PLANE_ROOT} --market crypto --dataset universe --grace-hours 0.1 --ping-url-env DATA_PLANE_PING_CRYPTO_UNIVERSE
    depends:
      - collect
    continue_on:
      failure: true
  - name: health-bars
    working_dir: ${AUTO_TRADER_DIR}
    command: uv run python -m research.data_plane.cli health --root ${DATA_PLANE_ROOT} --market crypto --dataset bars_1d --grace-hours 0.1 --ping-url-env DATA_PLANE_PING_CRYPTO_BARS
    depends:
      - collect
    continue_on:
      failure: true
  - name: health-actions
    working_dir: ${AUTO_TRADER_DIR}
    command: uv run python -m research.data_plane.cli health --root ${DATA_PLANE_ROOT} --market crypto --dataset corporate_actions --grace-hours 0.1 --ping-url-env DATA_PLANE_PING_CRYPTO_ACTIONS
    depends:
      - collect
