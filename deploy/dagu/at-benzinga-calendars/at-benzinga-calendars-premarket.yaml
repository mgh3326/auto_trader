# 제안(PROPOSAL, hk 6513) — 어디에도 등록되어 있지 않다.
# 등록은 이 레인을 만든 설계 세션이 한다(운영자 결정
# hk:doc decision/2026-11-25/at-benzinga-trial-front-use: 체험 기간 동안 결정 흐름 앞단에서 쓴다).
# 이 파일은 Dagu 복사본이며 저장소가 등록하지 않는다(하드룰 6).
#
# 장전 1회: 미국 개장 전에 실적·등급·가이던스·배당·경제지표·컨퍼런스콜을 받아 둔다.
# 창은 오늘(KST) ~ +7일이고, 엔드포인트마다 페이지 상한(기본 20)이 있어 잘린 읽기는 실패로 끝난다.
# short_interest 는 symbols 파라미터가 필수라 이 DAG 에 넣지 않는다(수동 CLI 로 symbol 목록을 넘긴다).
#
# 게이트: BENZINGA_CALENDARS_ENABLED=true 는 이 일회성 컨테이너의 env 로만 준다(공유 env 파일 편집 금지).
# 키 BENZINGA_API_KEY 는 /root/at-secrets/.env.api 에서 온다.
# Benzinga 응답을 운영자 입력 없이 다시 쓰지 않는다: 재실행은 성공한 파티션을 건너뛴다.
description: "Benzinga calendars premarket (earnings/ratings/guidance/dividends/economics/conference)"
schedule: "CRON_TZ=America/New_York 30 7 * * 1-5"
max_active_runs: 1
hist_retention_days: 60
worker_selector:
  host: pi
steps:
  - name: premarket
    command: docker run --rm --init --network host --workdir /app --env-file /root/at-secrets/.env.api -e BENZINGA_CALENDARS_ENABLED=true "$(cat /root/at-run/deployed-digest)" /app/.venv/bin/python -m scripts.ingest_benzinga_calendars --category earnings,analyst_rating,guidance,dividend,economics,conference --from-date $(TZ=Asia/Seoul date +%F) --to-date $(TZ=Asia/Seoul date -d '7 days' +%F) --commit
    timeout_sec: 900
    retry_policy:
      limit: 1
      interval_sec: 60
handler_on:
  success:
    command: 'logger -t at-dagu-benzinga-calendars "dag=at-benzinga-calendars-premarket status=success"'
  failure:
    command: 'logger -t at-dagu-benzinga-calendars "dag=at-benzinga-calendars-premarket status=failure"'
