# 제안(PROPOSAL, hk 6513) — 어디에도 등록되어 있지 않다.
# 등록은 이 레인을 만든 설계 세션이 한다(운영자 결정
# hk:doc decision/2026-11-25/at-benzinga-trial-front-use: 체험 기간 동안 결정 흐름 앞단에서 쓴다).
# 이 파일은 Dagu 복사본이며 저장소가 등록하지 않는다(하드룰 6).
#
# 장전 1회: 미국 개장 전에 실적·등급·가이던스·배당·경제지표·컨퍼런스콜을 받아 둔다.
#
# 날짜: 스케줄이 America/New_York 이므로 날짜도 ET 로 계산한다. KST 날짜를 쓰면 10:00 ET
# 이후(00:00 KST) 하루 앞선 날짜를 조회하게 된다. Benzinga 캘린더의 date 도 미국 날짜다.
# 창: ET 오늘 ~ +7일. 엔드포인트당 요청은 날짜 범위 1회고 페이지 상한(기본 20)이 있다.
#
# --force: 파티션은 (category, date) 로 succeeded 가 되면 재조회되지 않는다. 개정(추정치·날짜·
# 등급 변경)은 재조회로만 보이므로, 갱신 대상 날짜는 매 실행 다시 받는다. 같은 payload 재수집은
# payload 해시 비교로 0행이고, 값이 바뀐 것만 market_event_revisions 에 1행씩 쌓인다.
#
# short_interest 는 symbols 파라미터가 필수라 이 DAG 에 넣지 않는다(수동 CLI 로 symbol 목록을 넘긴다).
# 게이트: BENZINGA_CALENDARS_ENABLED=true 는 이 일회성 컨테이너의 env 로만 준다(공유 env 파일 편집 금지).
# 키 BENZINGA_API_KEY 는 /root/at-secrets/.env.api 에서 온다.
description: "Benzinga calendars premarket (earnings/ratings/guidance/dividends/economic/conference)"
schedule: "CRON_TZ=America/New_York 30 7 * * 1-5"
max_active_runs: 1
hist_retention_days: 60
worker_selector:
  host: pi
steps:
  - name: premarket
    command: docker run --rm --init --network host --workdir /app --env-file /root/at-secrets/.env.api -e BENZINGA_CALENDARS_ENABLED=true "$(cat /root/at-run/deployed-digest)" /app/.venv/bin/python -m scripts.ingest_benzinga_calendars --category earnings,analyst_rating,guidance,dividend,economic,conference --from-date $(TZ=America/New_York date +%F) --to-date $(TZ=America/New_York date -d '7 days' +%F) --force --commit
    timeout_sec: 900
    retry_policy:
      limit: 1
      interval_sec: 60
handler_on:
  success:
    command: 'logger -t at-dagu-benzinga-calendars "dag=at-benzinga-calendars-premarket status=success"'
  failure:
    command: 'logger -t at-dagu-benzinga-calendars "dag=at-benzinga-calendars-premarket status=failure"'
