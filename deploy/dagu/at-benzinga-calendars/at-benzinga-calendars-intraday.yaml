# 제안(PROPOSAL, hk 6513) — 어디에도 등록되어 있지 않다.
# 등록은 이 레인을 만든 설계 세션이 한다. 이 파일은 Dagu 복사본이며 저장소가 등록하지 않는다(하드룰 6).
#
# 장중 30분 간격: 당일 실적 발표·애널리스트 등급 변경·WIIM(Why Is It Moving)·컨퍼런스콜을
# 새 값만 갱신한다. 같은 payload 는 revision 이 아니라 no-op 이고, 값이 바뀐 행은
# market_event_revisions 에 이전 버전이 남는다(덮어쓰지 않는다).
#
# 날짜: 스케줄이 America/New_York 이므로 --date 도 ET 오늘이다. KST 날짜(ET+13/14h)를 쓰면
# 10:00 ET 이후 틱이 내일 파티션을 조회·기록하고 오늘 행은 out_of_window 로 버려진다.
#
# --force: premarket 이 오늘 파티션을 이미 succeeded 로 만들어 두므로, 없으면 장중 틱은
# fetch 전에 건너뛰어 개정을 영영 못 본다. --force 로 매 틱 재조회하고, 같은 payload 는
# payload 해시 비교로 0행이다.
#
# 게이트·키는 premarket DAG 과 같다. short_interest 는 symbols 필수라 여기 없다.
description: "Benzinga calendars intraday (earnings/ratings/wiim/conference)"
schedule: "CRON_TZ=America/New_York */30 9-16 * * 1-5"
max_active_runs: 1
hist_retention_days: 60
worker_selector:
  host: pi
steps:
  - name: intraday
    command: docker run --rm --init --network host --workdir /app --env-file /root/at-secrets/.env.api -e BENZINGA_CALENDARS_ENABLED=true "$(cat /root/at-run/deployed-digest)" /app/.venv/bin/python -m scripts.ingest_benzinga_calendars --category earnings,analyst_rating,wiim,conference --date $(TZ=America/New_York date +%F) --force --commit
    timeout_sec: 600
    retry_policy:
      limit: 1
      interval_sec: 60
handler_on:
  success:
    command: 'logger -t at-dagu-benzinga-calendars "dag=at-benzinga-calendars-intraday status=success"'
  failure:
    command: 'logger -t at-dagu-benzinga-calendars "dag=at-benzinga-calendars-intraday status=failure"'
